<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#00C2CB">
<title>Second Brain</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./theme.css">
<style>
  /* Same neo-brutalist system as dailyplan/ — thick strokes, squared corners,
     solid accent blocks, hard zero-blur shadows. Shared colors/spacing live in
     theme.css; only page-specific rules stay here. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--teal); color:var(--ink);
    padding:
      calc(var(--page-top) + env(safe-area-inset-top)) calc(var(--page-side) + env(safe-area-inset-right))
      calc(var(--page-bottom) + env(safe-area-inset-bottom)) calc(var(--page-side) + env(safe-area-inset-left));
    font:16px/1.5 "Archivo","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .blk{font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900}
  .wrap{max-width:var(--page-width);margin:0 auto}

  /* The card is the box; the link is everything inside it except the handle, so
     a drag never lands on the anchor and turns into navigation. */
  .card{
    display:flex;align-items:stretch;
    background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    margin-bottom:14px;transition:transform .07s, box-shadow .07s;
  }
  .card:has(.face:active){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .card .face{
    flex:1;min-width:0;display:flex;align-items:center;gap:14px;
    text-decoration:none;color:inherit;padding:16px 18px;
  }
  .card .mark{
    flex:0 0 auto;width:44px;height:44px;background:var(--teal);
    border:var(--stroke) solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .card .name{flex:1;min-width:0;font-size:16px;letter-spacing:-.01em;line-height:1.2}

  /* Nothing personal is on screen until Firebase has said who is looking —
     the deck is which sections this person has, which is itself their data. */
  #wrap:not([data-auth="in"]) #deck,
  #wrap:not([data-auth="in"]) #empty{ display:none }

  .sync{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px;
    padding:9px 11px;background:var(--card);
    border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    font-size:12px;font-weight:700;color:var(--grey);
  }
  .sync .dot{flex:0 0 auto;width:9px;height:9px;border:2px solid var(--ink);background:var(--sunk)}
  .sync.on .dot{background:var(--lime)}
  .sync.err .dot{background:var(--pink)}
  .sync .msg{flex:1;min-width:120px}
  .sync button{
    font:inherit;font-size:11px;font-weight:900;letter-spacing:.05em;cursor:pointer;
    font-family:"Arial Black",Impact,sans-serif;
    padding:9px 13px;background:var(--card);color:var(--ink);
    border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  }
  .sync button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

  #empty{
    background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    padding:18px;font-size:14px;line-height:1.45;
  }

  .card.dragging{opacity:.45;position:relative;z-index:3}
  /* Yellow, not teal — the drop marker has to read against a teal page. */
  .card.drop-before{box-shadow:0 -6px 0 var(--yellow),var(--shadow)}
  .card.drop-after{box-shadow:0 6px 0 var(--yellow),var(--shadow)}
</style>
</head>
<body>
<div class="wrap" id="wrap" data-auth="checking">
  <header class="topbar">
    <span class="crumb here">SECOND BRAIN</span>
    <a class="crumb" id="adminLink" href="admin/" hidden>ADMIN</a>
  </header>

  <div class="sync" id="sync">
    <span class="dot"></span>
    <span class="msg" id="syncMsg">Checking sign-in…</span>
    <button id="authBtn" hidden></button>
  </div>

  <div id="empty" hidden>No sections are switched on for this account yet.</div>

  <div id="deck">
    <div class="card" data-key="exercise">
      <a class="face" href="exercise/">
        <span class="mark">🏋️</span>
        <span class="name blk">EXERCISE</span>
      </a>
    </div>

    <div class="card" data-key="dailyplan">
      <a class="face" href="dailyplan/">
        <span class="mark">✅</span>
        <span class="name blk">DAILYPLAN</span>
      </a>
    </div>

    <div class="card" data-key="jobs">
      <a class="face" href="jobs/">
        <span class="mark" style="background:var(--pink)">🎯</span>
        <span class="name blk">JOB SEARCH</span>
      </a>
    </div>

    <div class="card" data-key="streams">
      <a class="face" href="streams/">
        <span class="mark" style="background:var(--lime)">🌊</span>
        <span class="name blk">STREAMS</span>
      </a>
    </div>

    <div class="card" data-key="ideas">
      <a class="face" href="ideas/">
        <span class="mark" style="background:var(--yellow)">💡</span>
        <span class="name blk">STARTUP-UP IDEAS</span>
      </a>
    </div>

    <div class="card" data-key="finance">
      <a class="face" href="finance/">
        <span class="mark" style="background:var(--teal)">💰</span>
        <span class="name blk">FINANCE</span>
      </a>
    </div>

    <div class="card" data-key="opportunities">
      <a class="face" href="opportunities/">
        <span class="mark" style="background:var(--lime)">🏛️</span>
        <span class="name blk">OPPORTUNITIES</span>
      </a>
    </div>
  </div>
</div>

<script>
"use strict";

/* The home page is the list of sections this person has, which makes it their
   data rather than a menu. So it is gated like the rest of the app: nothing
   until Firebase says who is looking, then only the sections switched on for
   them in features/{uid}.
   
   Card order used to be a localStorage preference. It is an account setting now
   — one fewer thing on the device, and it follows him to his phone. */
(function () {
  const LEGACY_ORDER_KEY = "sb.home.order";
  try { localStorage.removeItem(LEGACY_ORDER_KEY); } catch {}

  const $ = id => document.getElementById(id);
  const deck = $("deck");
  const cards = [...deck.querySelectorAll(".card")];

  let order = [];        // section keys, this account's arrangement
  let fbLib = null, account = null, fb = null, uid = null, mode = "signed-out";
  let orderTimer = null;

  const readOrder = () => order;
  const saveOrder = () => {
    order = [...deck.querySelectorAll(".card")].map(c => c.dataset.key);
    pushHome();
  };

  function applyOrder() {
    const byKey = new Map(cards.map(c => [c.dataset.key, c]));
    const placed = new Set();
    const ordered = [];
    readOrder().forEach(key => {
      if (byKey.has(key) && !placed.has(key)) { ordered.push(byKey.get(key)); placed.add(key); }
    });
    cards.forEach(c => { if (!placed.has(c.dataset.key)) ordered.push(c); });
    ordered.forEach(c => deck.append(c));
  }

  function clearMarks() {
    deck.querySelectorAll(".drop-before,.drop-after")
      .forEach(el => el.classList.remove("drop-before", "drop-after"));
  }

  function cardUnder(clientY, self) {
    for (const el of deck.querySelectorAll(".card")) {
      if (el === self) continue;
      const rect = el.getBoundingClientRect();
      if (clientY >= rect.top && clientY <= rect.bottom) {
        return { el, before: clientY < rect.top + rect.height / 2 };
      }
    }
    return null;
  }

  /* Pointer events rather than HTML5 drag-and-drop, which Safari never fires for
     touch. Same handle behaviour as the other pages. */
  function addHandle(card) {
    const handle = document.createElement("span");
    handle.className = "handle";
    handle.setAttribute("aria-label", "Drag to reorder");
    handle.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">'
      + '<circle cx="5" cy="3" r="1.4" fill="#111"/><circle cx="11" cy="3" r="1.4" fill="#111"/>'
      + '<circle cx="5" cy="8" r="1.4" fill="#111"/><circle cx="11" cy="8" r="1.4" fill="#111"/>'
      + '<circle cx="5" cy="13" r="1.4" fill="#111"/><circle cx="11" cy="13" r="1.4" fill="#111"/></svg>';

    let startY = 0, moved = false, target = null, before = false;

    handle.addEventListener("pointerdown", event => {
      if (event.button) return;
      event.preventDefault();
      startY = event.clientY;
      moved = false; target = null;
      handle.setPointerCapture(event.pointerId);
    });

    handle.addEventListener("pointermove", event => {
      if (!handle.hasPointerCapture(event.pointerId)) return;
      const dy = event.clientY - startY;
      if (!moved && Math.abs(dy) < 6) return;
      moved = true;
      card.classList.add("dragging");
      card.style.transform = `translateY(${dy}px)`;
      clearMarks();
      const hit = cardUnder(event.clientY, card);
      target = hit ? hit.el : null;
      if (hit) { before = hit.before; hit.el.classList.add(before ? "drop-before" : "drop-after"); }
    });

    const finish = event => {
      if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
      card.classList.remove("dragging");
      card.style.transform = "";
      clearMarks();
      if (moved && target) {
        target.insertAdjacentElement(before ? "beforebegin" : "afterend", card);
        saveOrder();
      }
      moved = false; target = null;
    };
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);

    card.prepend(handle);
  }

  /* ---------- sign-in, and what this account may see ---------- */

  function setUI(state, msg, btnLabel, btnAction) {
    const row = $("sync"), btn = $("authBtn");
    row.className = "sync" + (state === "on" ? " on" : state === "err" ? " err" : "");
    $("syncMsg").textContent = msg;
    if (btnLabel) { btn.hidden = false; btn.textContent = btnLabel; btn.onclick = btnAction; }
    else { btn.hidden = true; btn.onclick = null; }
  }
  const setAuthState = state => { $("wrap").dataset.auth = state; };

  /* Hidden rather than removed, so the drag handlers stay attached and a
     section switched back on reappears in its place without a reload. */
  function applyFeatures(features) {
    let shown = 0;
    for (const card of cards) {
      const on = features[card.dataset.key] === true;
      card.hidden = !on;
      if (on) shown++;
    }
    $("empty").hidden = shown > 0;
  }

  function hideEverything() {
    for (const card of cards) card.hidden = true;
    $("empty").hidden = true;
  }

  const homeRef = () => fb.f.doc(fb.db, "users", uid, "config", "home");

  async function loadHome() {
    const { f } = fb;
    try {
      const snap = await fbLib.readDoc(f, homeRef());
      const stored = snap.exists() ? snap.data().order : null;
      order = Array.isArray(stored) ? stored.filter(k => typeof k === "string") : [];
    } catch (e) {
      console.warn("Card order unavailable:", e.code || e.message);
      order = [];
    }
    applyOrder();
  }

  /* Dragging one card past three others is one write, not three. */
  function pushHome() {
    if (mode !== "signed-in") return;
    clearTimeout(orderTimer);
    orderTimer = setTimeout(async () => {
      const { f } = fb;
      try { await f.setDoc(homeRef(), { order, updatedAt: f.serverTimestamp() }); }
      catch { /* offline — the next drag sends the whole order again */ }
    }, 600);
  }

  async function onAuth(user) {
    if (!user) {
      uid = null; mode = "signed-out";
      order = [];
      $("adminLink").hidden = true;
      hideEverything();
      setAuthState("out");
      setUI("off", "Sign in to see your sections.", "Sign in with Google", signIn);
      return;
    }
    uid = user.uid; mode = "signed-in";
    setUI("on", `Signed in as ${user.email || "your account"}`, "Sign out", signOut);

    // The profile card is written by watchAuth, on the one path every signed-in
    // page goes through — see shared/firebase.js.
    // A way in for whoever runs the place. Everyone else never learns it is
    // there — and firestore.rules is what stops them if they guess the URL.
    account.isAdmin(fb, uid).then(yes => { $("adminLink").hidden = !yes; });

    // Together, not one after the other: they are two separate documents, and
    // on a connection that has gone quiet each read waits before falling back
    // to the cache — in series that wait happens twice before anything is
    // drawn.
    const [features] = await Promise.all([account.loadFeatures(fb, uid), loadHome()]);
    if (!features) {
      hideEverything();
      setAuthState("err");
      setUI("err", "Couldn't check which sections you have.", "Reload", () => location.reload());
      return;
    }
    applyFeatures(features.sections);
    setAuthState("in");
  }

  async function signIn() {
    const msg = await fbLib.signIn(fb, text => setUI("off", text));
    if (msg) setUI("err", msg, "Try again", signIn);
  }

  async function signOut() {
    try { await fbLib.signOut(fb); }
    catch (e) { setUI("err", `Couldn't sign out (${e.message}).`, "Try again", signOut); }
  }

  async function boot() {
    try {
      [fbLib, account] = await Promise.all([
        import("./shared/firebase.js"),
        import("./shared/account.js")
      ]);
      fb = await fbLib.connect();
    } catch (e) {
      setAuthState("err");
      if (e && e.code === "no-config") {
        setUI("err", "Sync isn't configured, so there's nothing to show here.",
          "Reload", () => location.reload());
      } else {
        console.warn("Firebase unavailable:", e);
        setUI("err", "Couldn't reach Firebase, so there's nothing to show here.",
          "Reload", () => location.reload());
      }
      return;
    }
    mode = "signed-out";
    fbLib.watchAuth(fb, onAuth);
  }

  cards.forEach(addHandle);
  boot();
})();
</script>
</body>
</html>
