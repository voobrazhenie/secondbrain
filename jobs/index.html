<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4A1329">
<meta name="robots" content="noindex, nofollow">
<title>Jobs — Second Brain</title>

<!-- Add to Home Screen. iOS ignores the manifest's name/display, so the
     apple-* metas below are what actually make it launch standalone.
     One manifest for the whole Second Brain, so moving between sections
     never falls back to Safari. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!--
  PRIVATE MODULE. This file ships no job data at all — not a company name, not a
  link, not a note. Everything renders from users/{uid}/jobs in Firestore, which
  firestore.rules restricts to that signed-in uid. A visitor to the public Pages
  site sees the sign-in prompt and nothing else, which is the whole point: the
  repo is public, the job search is not.

  Seed or edit the data from Claude Code, or inline here once signed in.
-->
<link rel="stylesheet" href="../theme.css">
<style>
  /* Same neo-brutalist system as / and dailyplan/. Shared colors/spacing live
     in theme.css; only page-specific rules stay here. The header, section
     headers, action row and sync bar all follow opportunities/ so the two
     private modules read as one thing. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* This page runs dark. Full-strength --pink behind cream cards was loud
     enough to flatten them; the same pink taken right down leaves the cards,
     and the pink Focus handle, as the bright things on the screen. --on-page
     is for the handful of labels and rules that sit straight on the
     background instead of inside a card. */
  :root{ --page:#4A1329; --on-page:#F6E4EC; --on-page-faint:#B98CA0 }

  body{
    margin:0; background:var(--page); color:var(--ink);
    padding:
      calc(5vh + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
      calc(60px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    font:16px/1.5 "Archivo","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Explicit color plus -webkit-appearance:none on every button: iOS Safari
     renders unstyled button text in system blue otherwise. */
  button,input,textarea,select{font:inherit}
  button{cursor:pointer;color:var(--ink);-webkit-appearance:none;appearance:none;background:transparent}
  a{color:var(--ink)}
  .blk{font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900}
  .wrap{max-width:var(--page-width);margin:0 auto}
  .hide{display:none !important}

  /* Header is .crumbs from theme.css — one line, no back arrow. */

  /* ---------- sync bar ----------
     Quiet card with a status dot rather than a full-width colour block, and it
     sits under the list: signing in is a once-a-month event, the jobs are the
     page. Same markup and contract as opportunities/. */
  .sync{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border:2px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);
    padding:9px 11px;margin:30px 0 0;font-size:12px;font-weight:700;color:var(--grey)}
  .sync .dot{flex:0 0 auto;width:9px;height:9px;border:2px solid var(--ink);background:var(--sunk)}
  .sync.on .dot{background:var(--lime)}
  .sync.err .dot{background:var(--pink)}
  .sync .msg{flex:1;min-width:150px}
  .btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);
    font-size:11px;font-weight:800;padding:6px 10px;letter-spacing:.03em;
    font-family:"Arial Black",Impact,sans-serif}
  .btn:active{transform:translate(2px,2px)}

  /* ---------- gate ---------- */
  #gate{border:2.5px dashed var(--ink);padding:22px 20px;text-align:center;background:var(--card)}
  #gate p{margin:0;font-weight:700;font-size:14px;color:var(--grey)}

  /* ---------- filters ---------- */
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .chip{background:var(--card);border:2px solid var(--ink);font-size:11.5px;
    font-weight:800;padding:5px 10px;letter-spacing:.02em}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  /* ---------- section headers (from opportunities/) ---------- */
  .list-head{display:flex;align-items:center;gap:9px;margin:24px 0 10px}
  .list-head.first{margin-top:0}
  .list-head .t{font-size:11px;letter-spacing:.08em;background:var(--on-page);color:var(--ink);
    padding:3px 8px}
  .list-head .rule{height:2px;background:var(--on-page-faint);flex:1}
  .list-head .count{font-size:10px;color:var(--on-page);font-weight:800}
  /* Unread is the one section that should catch the eye from across the page. */
  .list-head.unread-head .t{background:var(--yellow)}
  .section-body.unread .job{box-shadow:4px 4px 0 var(--yellow)}

  .section-toggle{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;
    padding:0;margin:26px 0 10px;text-align:left}
  .section-toggle .t{font-size:11px;letter-spacing:.08em;background:transparent;
    color:var(--on-page-faint);border:2px solid var(--on-page-faint);
    padding:1px 6px;font-weight:900}
  .section-toggle .rule{height:2px;background:var(--on-page-faint);flex:1}
  .section-toggle .count{font-size:10px;color:var(--on-page);font-weight:800}
  .section-toggle .chev{font-size:11px;font-weight:900;color:var(--on-page)}
  /* Same small icon-button-next-to-a-count pattern as opportunities/. */
  .list-head .add{flex:0 0 auto;width:26px;height:26px;padding:0;font-size:15px;line-height:1;
    background:var(--card);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:"Arial Black",Impact,sans-serif}
  .list-head .add:active{transform:translate(2px,2px);box-shadow:none}
  .section-body{margin-bottom:6px}
  .section-body.parked .job{opacity:.82}
  /* A section lights up while a card is being dragged over it, which is how a
     job moves between Current and Not relevant without opening it. */
  .drop-in{outline:2px dashed var(--teal);outline-offset:4px}
  .empty{border:2.5px dashed var(--on-page-faint);padding:16px;text-align:center;
    color:var(--on-page);font-weight:700;font-size:12.5px}

  /* ---------- add and edit forms (same shape as opportunities/) ---------- */
  .add-panel{background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    padding:14px;margin-bottom:18px}
  .edit-form{border-top:2px solid var(--ink);padding:13px 14px;margin-top:8px}
  .field{display:block;margin-bottom:11px}
  .field span{display:block;font-size:9px;letter-spacing:.08em;margin-bottom:4px}
  /* 16px minimum on the controls — anything smaller makes iOS zoom on focus. */
  .field input,.field textarea{display:block;width:100%;border:2px solid var(--ink);
    background:var(--paper);color:var(--ink);padding:9px 10px;font-size:16px;font-weight:650;
    border-radius:0}
  .field textarea{min-height:64px;resize:vertical;line-height:1.45}
  .checkline{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;font-weight:800}
  .checkline input{width:16px;height:16px}
  .more-toggle{background:none;border:0;padding:0;margin-bottom:12px;font-size:11px;font-weight:800;
    letter-spacing:.04em;text-decoration:underline;color:var(--grey)}
  .form-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .fbtn{background:var(--card);color:var(--ink);border:2px solid var(--ink);
    padding:8px 12px;font-size:11px;font-weight:900;letter-spacing:.04em;
    box-shadow:2px 2px 0 var(--ink);font-family:"Arial Black",Impact,sans-serif}
  .fbtn.primary{background:var(--yellow)}
  .fbtn:active{transform:translate(2px,2px);box-shadow:none}

  /* ---------- job cards ---------- */
  .job{background:var(--card);border:var(--stroke) solid var(--ink);
    box-shadow:var(--shadow);margin-bottom:14px;display:flex;align-items:stretch}
  .job.done{opacity:.55;box-shadow:2px 2px 0 var(--ink)}
  .job.dragging{opacity:.45;position:relative;z-index:3}
  .job.drop-before{box-shadow:0 -6px 0 var(--teal),var(--shadow)}
  .job.drop-after{box-shadow:0 6px 0 var(--teal),var(--shadow)}
  .jobmain{flex:1;min-width:0;padding:15px 17px}
  /* .handle comes from theme.css. It is on every card so they line up, and the
     grip is what you drag rather than the whole card. Pink means Focus, the
     same signal opportunities/ uses. */
  .handle.hf{background:var(--pink)}
  .chev{flex:0 0 auto;font-size:16px;font-weight:900;line-height:1.4}
  .job-h{display:flex;align-items:flex-start;gap:11px;
    cursor:pointer;user-select:none}
  /* The gap under the header belongs to the body, not the header: on a
     collapsed card the body is display:none, so the padding stays even
     top and bottom. */
  .jbody{margin-top:8px}
  .titles{flex:1;min-width:0}
  .co{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.15}
  .ro{display:block;font-size:13px;font-weight:700;color:var(--grey);margin-top:3px}
  /* Where the job is, on the collapsed row. Remote leads; the place follows it
     when there is one, because "remote, Germany only" is not the same job. */
  .where{display:block;font-size:11px;font-weight:700;color:var(--grey);margin-top:5px;
    letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .where b{font-weight:900;color:var(--ink)}
  .meta{font-size:11.5px;font-weight:800;color:var(--grey);letter-spacing:.03em;
    text-transform:uppercase;margin:0 0 9px}
  .pill{display:inline-block;border:2px solid var(--ink);padding:1px 7px;
    font-size:10.5px;font-weight:800;margin:0 5px 4px 0;background:var(--paper)}
  .pill.remote{background:var(--lime)}
  .pill.pay{background:var(--yellow)}
  .pill.dead{background:var(--pink);color:#fff}
  .txt{font-size:13.8px;margin:0 0 9px}
  .txt b{font-weight:800}
  .flag{font-size:12.8px;background:var(--yellow);border-left:4px solid var(--ink);
    padding:8px 10px;margin:0 0 10px;font-weight:600}
  .links{margin-bottom:11px}
  a.go{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;
    font-size:12px;font-weight:800;padding:6px 11px;margin:0 6px 6px 0;
    border:2px solid var(--ink)}
  a.go.sec{background:var(--card);color:var(--ink)}
  a.go:active{transform:translate(2px,2px)}

  .track{border-top:2px solid var(--ink);padding-top:10px}
  .track .lab{font-size:10px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--grey);display:block;margin-bottom:6px}
  .states{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .st{background:var(--paper);border:2px solid var(--ink);font-size:10.5px;
    font-weight:800;padding:4px 8px;letter-spacing:.02em}
  .st[aria-pressed="true"]{background:var(--teal)}
  .st[aria-pressed="true"][data-v="passed"],
  .st[aria-pressed="true"][data-v="closed"]{background:var(--pink);color:#fff}
  .st[aria-pressed="true"][data-v="offer"]{background:var(--lime)}
  textarea{width:100%;font:inherit;font-size:13px;background:var(--paper);
    border:2px solid var(--ink);padding:8px 9px;resize:vertical;min-height:38px}
  .saved{font-size:10.5px;font-weight:800;color:var(--grey);letter-spacing:.06em;
    text-transform:uppercase;min-height:13px}
  /* SAVE NOTE only appears once the note differs from what is stored. */
  .note-row{display:flex;align-items:center;gap:9px;margin-top:8px;min-height:20px}
  .note-save{padding:6px 10px}

  /* ---------- action row (from opportunities/) ---------- */
  .action-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:11px;
    border-top:2px solid var(--sunk);margin-top:11px}
  .hf-toggle{display:inline-flex;align-items:center;border:2px solid var(--ink);
    background:var(--card);color:var(--ink);padding:6px 7px;font-size:10px;font-weight:900;
    letter-spacing:.02em;font-family:"Arial Black",Impact,sans-serif}
  .hf-toggle.on{background:var(--pink)}
  .abtn{background:var(--card);color:var(--ink);border:2px solid var(--ink);
    padding:6px 7px;font-size:10px;font-weight:900;letter-spacing:.02em;
    box-shadow:2px 2px 0 var(--ink);font-family:"Arial Black",Impact,sans-serif}
  .abtn:active{transform:translate(2px,2px);box-shadow:none}
  /* Park and Delete travel together, so a narrow screen wraps the pair
     instead of stranding Delete on a line of its own. */
  .right-actions{display:flex;gap:6px;margin-left:auto}
  .abtn.danger{background:var(--pink);color:#fff}
  /* Armed delete — the second tap is the confirmation. */
  .abtn.danger.armed{background:var(--ink);color:var(--paper)}

  @media (max-width:420px){
    .action-row{gap:5px}
    .right-actions{gap:5px}
    .abtn,.hf-toggle{padding:6px 6px;letter-spacing:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="crumbs">
    <a class="crumb" href="../">SECOND BRAIN</a>
    <span class="crumb here">JOB SEARCH</span>
  </nav>

  <div id="gate">
    <p>This module is private. Sign in with the account that owns this data to see it.</p>
  </div>

  <div id="app" class="hide">
    <div class="filters" id="filters"></div>

    <!-- Static markup, never rebuilt by render(): a snapshot arriving
         mid-typing would otherwise throw away a half-written entry. -->
    <form class="add-panel hide" id="addPanel">
      <label class="field">
        <span class="blk">COMPANY</span>
        <input id="fCompany" maxlength="80" required autocomplete="off" placeholder="Who is hiring?">
      </label>
      <label class="field">
        <span class="blk">ROLE</span>
        <input id="fRole" maxlength="120" autocomplete="off" placeholder="What is the job called?">
      </label>
      <button class="more-toggle" type="button" id="moreToggle">Add location, link, pay, notes &#9662;</button>
      <div id="addMore" class="hide">
        <label class="field">
          <span class="blk">LOCATION</span>
          <input id="fLocation" maxlength="120" autocomplete="off" placeholder="Berlin, or Remote">
        </label>
        <label class="field">
          <span class="blk">LINK</span>
          <input id="fLink" type="url" autocomplete="off" placeholder="https://…">
        </label>
        <label class="field">
          <span class="blk">PAY</span>
          <input id="fPay" maxlength="80" autocomplete="off" placeholder="Whatever they published">
        </label>
        <label class="field">
          <span class="blk">WHAT IT IS</span>
          <textarea id="fWhat" maxlength="2000"></textarea>
        </label>
        <label class="field">
          <span class="blk">WHY YOU</span>
          <textarea id="fWhy" maxlength="2000"></textarea>
        </label>
        <label class="field">
          <span class="blk">CATCH</span>
          <textarea id="fFlag" maxlength="2000"></textarea>
        </label>
        <label class="checkline">
          <input id="fRemote" type="checkbox">
          <span>Remote</span>
        </label>
      </div>
      <div class="form-actions">
        <button class="fbtn primary" type="submit">ADD</button>
        <button class="fbtn" type="button" id="cancelAdd">CANCEL</button>
      </div>
    </form>

    <!-- Where a research pass drops what it found. Nothing arrives in CURRENT
         on its own: he reads these and either keeps them or says no. Hidden
         entirely when empty, which is most of the time. -->
    <div class="list-head first unread-head hide" id="unreadHead">
      <span class="t blk">UNREAD</span><span class="rule"></span>
      <span class="count blk" id="unreadCount">0</span>
    </div>
    <div class="section-body unread hide" id="unreadList" data-group="unread"></div>

    <div class="list-head first" id="currentHead">
      <span class="t blk">CURRENT</span><span class="rule"></span>
      <span class="count blk" id="currentCount">0</span>
      <button class="add" type="button" id="addBtn" aria-label="Add a job">+</button>
    </div>
    <div class="section-body" id="currentList" data-group="current"></div>

    <button class="section-toggle" type="button" id="parkedToggle" aria-expanded="false">
      <span class="t blk">NOT RELEVANT</span><span class="rule"></span>
      <span class="count blk" id="parkedCount">0</span>
      <span class="chev" id="parkedChev">&#9662;</span>
    </button>
    <div class="section-body parked hide" id="parkedList" data-group="parked"></div>
  </div>

  <div class="sync" id="sync">
    <span class="dot"></span>
    <span class="msg" id="syncMsg">Connecting&hellip;</span>
    <button class="btn" id="authBtn" hidden></button>
  </div>
</div>

<script type="module">
"use strict";

const SDK = "https://www.gstatic.com/firebasejs/12.16.0/";
const $ = id => document.getElementById(id);

const STATES = [
  ["todo",         "To do"],
  ["applied",      "Applied"],
  ["interviewing", "Interviewing"],
  ["offer",        "Offer"],
  ["passed",       "Passed"],
  ["closed",       "Closed"]
];
const DONE = new Set(["passed", "closed"]);

const newId = () => "j-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const slug = s => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);

const App = {
  fb: null, uid: null, jobs: [], filter: "open", unsub: null,
  open: new Set(), parkedOpen: false, editingId: null, addOpen: false, addMoreOpen: false,
  /* Note text typed but not yet saved, by job id. A snapshot from Firestore
     rebuilds the whole list, so without this a half-written note would be
     replaced by whatever is stored the moment anything else changes. */
  drafts: new Map(),

  setUI(state, msg, btnLabel, btnAction) {
    $("sync").className = "sync" + (state === "on" ? " on" : state === "err" ? " err" : "");
    $("syncMsg").textContent = msg;
    const btn = $("authBtn");
    if (btnLabel) { btn.hidden = false; btn.textContent = btnLabel; btn.onclick = btnAction; }
    else { btn.hidden = true; btn.onclick = null; }
  },

  /* Bound once. The panel is static markup so a live snapshot arriving while
     he types can't wipe the half-written entry. */
  bindAddPanel() {
    $("addBtn").onclick = () => { this.addOpen = !this.addOpen; this.syncAddPanel(); };
    $("cancelAdd").onclick = () => { this.addOpen = false; this.syncAddPanel(); };
    $("moreToggle").onclick = () => {
      this.addMoreOpen = !this.addMoreOpen;
      $("addMore").classList.toggle("hide", !this.addMoreOpen);
      $("moreToggle").innerHTML = this.addMoreOpen
        ? "Hide location, link, pay, notes &#9652;"
        : "Add location, link, pay, notes &#9662;";
    };
    $("addPanel").addEventListener("submit", e => {
      e.preventDefault();
      const company = $("fCompany").value.trim();
      if (!company) { $("fCompany").focus(); return; }
      this.add({
        company,
        role: $("fRole").value.trim(),
        location: $("fLocation").value.trim(),
        pay: $("fPay").value.trim(),
        what: $("fWhat").value.trim(),
        why: $("fWhy").value.trim(),
        flag: $("fFlag").value.trim(),
        remote: $("fRemote").checked,
        link: $("fLink").value.trim()
      });
      this.addOpen = false;
      this.syncAddPanel({ clear: true });
    });
  },

  syncAddPanel({ clear = false } = {}) {
    $("addPanel").classList.toggle("hide", !this.addOpen);
    if (clear) {
      for (const id of ["fCompany","fRole","fLocation","fLink","fPay","fWhat","fWhy","fFlag"]) $(id).value = "";
      $("fRemote").checked = false;
    }
    if (this.addOpen) $("fCompany").focus();
  },

  /* New jobs go to the top of Current. Rank is still what orders the list —
     the number just isn't printed on the card any more. */
  async add(fields) {
    const { f, db } = this.fb;
    const top = Math.min(0, ...this.jobs.map(j => j.rank || 0));
    const id = (slug(fields.company + "-" + fields.role) || newId()) + "-" + newId().slice(-4);
    const links = fields.link ? [{ label: "The role", url: fields.link }] : [];
    delete fields.link;
    await f.setDoc(f.doc(db, "users", this.uid, "jobs", id), {
      ...fields, links, rank: top - 1, live: true, status: "todo",
      unread: false, parked: false, focus: false,
      addedBy: "hand",
      createdAt: f.serverTimestamp(), updatedAt: f.serverTimestamp()
    });
  },

  async init() {
    let config = null;
    try { ({ firebaseConfig: config } = await import("./firebase-config.js")); }
    catch { /* file:// origin, or the file is missing */ }
    if (!config || !config.projectId) {
      this.setUI("err", "No Firebase config — this module can't load without it.");
      return;
    }
    try {
      const [{ initializeApp }, authMod, fsMod] = await Promise.all([
        import(SDK + "firebase-app.js"),
        import(SDK + "firebase-auth.js"),
        import(SDK + "firebase-firestore.js")
      ]);
      const app = initializeApp(config);
      const db = fsMod.initializeFirestore(app, {
        localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() })
      });
      this.fb = { auth: authMod.getAuth(app), db, a: authMod, f: fsMod };
      authMod.getRedirectResult(this.fb.auth).catch(() => {});
      authMod.onAuthStateChanged(this.fb.auth, u => this.onAuth(u));
    } catch (e) {
      console.warn("Firebase unavailable:", e);
      this.setUI("err", "Couldn't reach Firebase.", "Retry", () => location.reload());
    }
  },

  onAuth(user) {
    if (this.unsub) { this.unsub(); this.unsub = null; }
    if (!user) {
      this.uid = null; this.jobs = [];
      $("app").classList.add("hide");
      $("gate").classList.remove("hide");
      this.setUI("off", "Signed out — nothing loaded.", "Sign in with Google", () => this.signIn());
      return;
    }
    this.uid = user.uid;
    this.setUI("on", `Signed in as ${user.email || "your account"}`, "Sign out", () => this.signOut());
    $("gate").classList.add("hide");
    $("app").classList.remove("hide");
    this.bindAddPanel();
    this.attach();
  },

  async signIn() {
    const { a, auth } = this.fb;
    try {
      this.setUI("off", "Opening Google sign-in…");
      await a.signInWithPopup(auth, new a.GoogleAuthProvider());
    } catch (e) {
      const code = (e && e.code) || "";
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
        try { await a.signInWithRedirect(auth, new a.GoogleAuthProvider()); return; }
        catch (e2) { e = e2; }
      }
      const msg =
        code === "auth/unauthorized-domain" ? "This domain isn't authorised in Firebase Auth yet."
      : code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request" ? "Sign-in was cancelled."
      : `Sign-in failed (${e.code || e.message}).`;
      this.setUI("err", msg, "Try again", () => this.signIn());
    }
  },

  async signOut() {
    try { await this.fb.a.signOut(this.fb.auth); }
    catch (e) { this.setUI("err", `Couldn't sign out (${e.message}).`, "Try again", () => this.signOut()); }
  },

  attach() {
    const { f, db } = this.fb;
    const col = f.collection(db, "users", this.uid, "jobs");
    this.unsub = f.onSnapshot(col,
      snap => {
        this.jobs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                             .sort((a, b) => (a.rank || 99) - (b.rank || 99));
        this.render();
      },
      err => this.setUI("err", `Couldn't read jobs (${err.code || err.message}).`)
    );
  },

  ref(id) {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "jobs", id);
  },

  async patch(id, fields, el) {
    const { f } = this.fb;
    try {
      await f.updateDoc(this.ref(id), { ...fields, updatedAt: f.serverTimestamp() });
      if (el) { el.textContent = "Saved"; setTimeout(() => { el.textContent = ""; }, 1600); }
    } catch (e) {
      if (el) el.textContent = `Not saved (${e.code || e.message})`;
    }
  },

  async remove(id) {
    this.open.delete(id);
    await this.fb.f.deleteDoc(this.ref(id));
  },

  /* The three sections are two booleans, and this is the only thing that
     writes them, so a job is never in two places at once. Parking is also the
     memory: a later research pass reads `parked` and leaves those roles alone
     instead of finding them again. `parkedAt` is there so the note on the card
     can say when you decided. */
  setGroup(id, group) {
    this.open.delete(id);
    this.patch(id, {
      unread: group === "unread",
      parked: group === "parked",
      parkedAt: group === "parked" ? new Date().toISOString().slice(0, 10) : ""
    });
  },

  /* Reordering runs on pointer events rather than HTML5 drag-and-drop, which
     Safari never fires for touch. Dropping onto the other section is how a job
     moves between Current and Not relevant, so the handle watches which
     section the finger is over as well as which card. */
  dragHandle(card, job) {
    const handle = document.createElement("span");
    handle.className = "handle" + (job.focus ? " hf" : "");
    handle.setAttribute("aria-label", "Drag to reorder");
    handle.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">'
      + '<circle cx="5" cy="3" r="1.4" fill="#111"/><circle cx="11" cy="3" r="1.4" fill="#111"/>'
      + '<circle cx="5" cy="8" r="1.4" fill="#111"/><circle cx="11" cy="8" r="1.4" fill="#111"/>'
      + '<circle cx="5" cy="13" r="1.4" fill="#111"/><circle cx="11" cy="13" r="1.4" fill="#111"/></svg>';

    let startY = 0, moved = false, targetId = null, targetGroup = null, before = false;

    handle.addEventListener("pointerdown", e => {
      if (e.button) return;
      e.preventDefault(); e.stopPropagation();
      startY = e.clientY; moved = false; targetId = null; targetGroup = null;
      handle.setPointerCapture(e.pointerId);
    });

    handle.addEventListener("pointermove", e => {
      if (!handle.hasPointerCapture(e.pointerId)) return;
      const dy = e.clientY - startY;
      if (!moved && Math.abs(dy) < 6) return;
      moved = true;
      card.classList.add("dragging");
      card.style.transform = `translateY(${dy}px)`;
      this.clearDropMarks();

      const hit = this.cardUnder(e.clientY, job.id);
      targetId = null; targetGroup = null;
      if (hit) {
        targetId = hit.id; before = hit.before;
        hit.el.classList.add(before ? "drop-before" : "drop-after");
        if (hit.group !== this.groupOf(job)) this.markGroup(hit.group);
      } else {
        const sec = this.groupUnder(e.clientY);
        if (sec && sec !== this.groupOf(job)) { targetGroup = sec; this.markGroup(sec); }
      }
    });

    const finish = e => {
      e.stopPropagation();
      if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId);
      card.classList.remove("dragging");
      card.style.transform = "";
      this.clearDropMarks();
      if (moved && (targetId || targetGroup)) this.drop(job.id, targetId, before, targetGroup);
      moved = false; targetId = null; targetGroup = null;
    };
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
    return handle;
  },

  groupOf(job) { return job.parked ? "parked" : job.unread ? "unread" : "current"; },

  cardUnder(clientY, selfId) {
    for (const el of document.querySelectorAll(".section-body .job")) {
      if (el.dataset.id === selfId) continue;
      const rect = el.getBoundingClientRect();
      if (clientY >= rect.top && clientY <= rect.bottom) {
        return {
          el, id: el.dataset.id,
          group: el.closest(".section-body").dataset.group,
          before: clientY < rect.top + rect.height / 2
        };
      }
    }
    return null;
  },

  /* An empty section is a valid drop target too, and so is the header above
     it — otherwise the first job you want to park has nowhere to land. */
  groupUnder(clientY) {
    for (const [id, group] of [["unreadList", "unread"], ["currentList", "current"],
                               ["parkedList", "parked"]]) {
      const body = $(id);
      if (body.classList.contains("hide")) continue;
      const rect = body.getBoundingClientRect();
      const top = rect.top - 34;   // the section header counts as the section
      if (clientY >= top && clientY <= rect.bottom + 6) return group;
    }
    return null;
  },

  markGroup(group) {
    const el = document.querySelector(`.section-body[data-group="${group}"]`);
    if (el) el.classList.add("drop-in");
  },

  clearDropMarks() {
    document.querySelectorAll(".drop-before,.drop-after,.drop-in")
      .forEach(el => el.classList.remove("drop-before", "drop-after", "drop-in"));
  },

  /* One drop handles both jobs: moving inside a section reorders it, and
     moving across sections parks or unparks the job. */
  drop(id, targetId, before, toGroup) {
    if (!id || id === targetId) return;
    const job = this.jobs.find(x => x.id === id);
    if (!job) return;
    const target = targetId ? this.jobs.find(x => x.id === targetId) : null;
    const group = target ? this.groupOf(target) : toGroup;
    if (!group) return;

    if (group !== this.groupOf(job)) {
      this.setGroup(id, group);
      if (!target) return;
    }

    const rows = this.jobs.filter(x => x.id !== id);
    let to = targetId ? rows.findIndex(x => x.id === targetId) : rows.length;
    if (to < 0) return;
    if (!before) to += 1;
    rows.splice(to, 0, job);
    rows.forEach((x, i) => {
      const rank = i + 1;
      if (x.rank !== rank) { x.rank = rank; this.patch(x.id, { rank }); }
    });
    this.jobs = rows;
    this.render();
  },

  /* The chips filter by stage and only ever see live jobs — parked ones have
     their own section and stay out of every count. */
  visible() {
    const live = this.jobs.filter(j => this.groupOf(j) === "current");
    if (this.filter === "all") return live;
    if (this.filter === "open") return live.filter(j => !DONE.has(j.status || "todo"));
    if (this.filter === "live") return live.filter(j => j.live !== false && !DONE.has(j.status || "todo"));
    return live.filter(j => (j.status || "todo") === this.filter);
  },

  render() {
    /* A rebuild replaces every field on the page, so anything he is typing in
       has to be found again afterwards — otherwise a write from another tab,
       or his own Save, drops him out of the field mid-sentence. */
    const active = document.activeElement;
    const keep = active && active.dataset && active.dataset.notes
      ? { id: active.dataset.notes, start: active.selectionStart, end: active.selectionEnd }
      : null;

    const unread = this.jobs.filter(j => this.groupOf(j) === "unread");
    const live = this.jobs.filter(j => this.groupOf(j) === "current");
    const parked = this.jobs.filter(j => this.groupOf(j) === "parked");

    const counts = { all: live.length, open: live.filter(j => !DONE.has(j.status || "todo")).length };
    const chips = [["open", `Open ${counts.open}`], ["live", "Live only"], ["applied", "Applied"],
                   ["interviewing", "Interviewing"], ["all", `All ${counts.all}`]];
    $("filters").innerHTML = "";
    for (const [v, label] of chips) {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", String(this.filter === v));
      b.onclick = () => { this.filter = v; this.render(); };
      $("filters").appendChild(b);
    }

    this.fill("unreadList", "unreadCount", unread, unread.length, "");
    $("unreadHead").classList.toggle("hide", !unread.length);
    $("unreadList").classList.toggle("hide", !unread.length);
    $("currentHead").classList.toggle("first", !unread.length);

    this.fill("currentList", "currentCount", this.visible(), live.length,
              this.jobs.length ? "Nothing in this view." : "No opportunities stored yet.");
    this.fill("parkedList", "parkedCount", parked, parked.length,
              "Nothing parked. Drag a job here, or use NOT RELEVANT inside a card.");

    $("parkedList").classList.toggle("hide", !this.parkedOpen);
    $("parkedChev").innerHTML = this.parkedOpen ? "&#9652;" : "&#9662;";
    $("parkedToggle").setAttribute("aria-expanded", String(this.parkedOpen));
    $("parkedToggle").onclick = () => { this.parkedOpen = !this.parkedOpen; this.render(); };

    if (keep) {
      const ta = $("app").querySelector(`textarea[data-notes="${CSS.escape(keep.id)}"]`);
      if (ta) {
        ta.focus({ preventScroll: true });
        try { ta.setSelectionRange(keep.start, keep.end); } catch {}
      }
    }
  },

  fill(listId, countId, rows, count, emptyText) {
    const list = $(listId);
    list.innerHTML = "";
    $(countId).textContent = count;
    if (!rows.length) {
      const d = document.createElement("div");
      d.className = "empty"; d.textContent = emptyText;
      list.appendChild(d);
      return;
    }
    for (const j of rows) list.appendChild(this.card(j));
  },

  card(j) {
    const status = j.status || "todo";
    const isOpen = this.open.has(j.id) || this.editingId === j.id;
    const el = document.createElement("div");
    el.className = "job" + (DONE.has(status) ? " done" : "") + (j.parked ? " parked" : "");
    el.dataset.id = j.id;
    el.appendChild(this.dragHandle(el, j));

    const main = document.createElement("div");
    main.className = "jobmain";

    const head = document.createElement("div");
    head.className = "job-h";
    const titles = document.createElement("div");
    titles.className = "titles";
    const co = document.createElement("span"); co.className = "co blk"; co.textContent = j.company || "";
    const ro = document.createElement("span"); ro.className = "ro"; ro.textContent = j.role || "";
    titles.append(co, ro);
    /* Remote or not, and where, without opening the card. */
    const where = document.createElement("span");
    where.className = "where";
    if (j.remote) {
      const tag = document.createElement("b");
      tag.textContent = "Remote";
      where.appendChild(tag);
      // "Fully remote, worldwide" would otherwise read "Remote · Fully remote…"
      const rest = (j.location || "").replace(/^\s*(fully\s+|100%\s+)?remote\b[\s,:–—-]*/i, "").trim();
      if (rest) where.appendChild(document.createTextNode(" · " + rest));
    } else if (j.location) {
      where.textContent = j.location;
    }
    if (where.textContent) titles.appendChild(where);
    const chev = document.createElement("span");
    chev.className = "chev blk"; chev.textContent = isOpen ? "▴" : "▾";
    head.append(titles, chev);
    head.onclick = () => {
      if (this.open.has(j.id)) this.open.delete(j.id); else this.open.add(j.id);
      this.render();
    };
    main.appendChild(head);

    // Everything below the header is hidden until the card is opened, so a
    // collapsed list reads as just company + role.
    const body = document.createElement("div");
    body.className = "jbody" + (isOpen ? "" : " hide");

    const meta = document.createElement("div");
    meta.className = "meta";
    const pills = [];
    if (j.pay) pills.push(["pay", j.pay]);
    if (j.live === false) pills.push(["dead", "Closed listing"]);
    if (j.parked && j.parkedAt) pills.push(["", `Parked ${j.parkedAt}`]);
    for (const [cls, text] of pills) {
      const s = document.createElement("span");
      s.className = "pill " + cls; s.textContent = text;
      meta.appendChild(s);
    }
    body.appendChild(meta);

    for (const key of ["what", "why"]) {
      if (!j[key]) continue;
      const p = document.createElement("p");
      p.className = "txt";
      if (key === "why") { const b = document.createElement("b"); b.textContent = "Why you: "; p.appendChild(b); }
      p.appendChild(document.createTextNode(j[key]));
      body.appendChild(p);
    }
    if (j.flag) {
      const f = document.createElement("p"); f.className = "flag"; f.textContent = j.flag;
      body.appendChild(f);
    }

    if (Array.isArray(j.links) && j.links.length) {
      const wrap = document.createElement("div");
      wrap.className = "links";
      j.links.forEach((l, i) => {
        const a = document.createElement("a");
        a.className = "go" + (i ? " sec" : "");
        a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = l.label || "Open";
        wrap.appendChild(a);
      });
      body.appendChild(wrap);
    }

    // tracking
    const track = document.createElement("div");
    track.className = "track";
    const lab = document.createElement("span");
    lab.className = "lab"; lab.textContent = "Stage";
    track.appendChild(lab);

    const saved = document.createElement("div");
    saved.className = "saved";

    const states = document.createElement("div");
    states.className = "states";
    for (const [v, label] of STATES) {
      const b = document.createElement("button");
      b.className = "st"; b.dataset.v = v; b.textContent = label;
      b.setAttribute("aria-pressed", String(status === v));
      b.onclick = () => this.patch(j.id, { status: v }, saved);
      states.appendChild(b);
    }
    track.appendChild(states);

    /* Notes save on the button, not on a timer. Saving writes to Firestore,
       the listener fires, and render() rebuilds the list — which used to yank
       the cursor out of the field a second after he stopped typing. */
    const ta = document.createElement("textarea");
    ta.placeholder = "Notes — contacts, dates, what you sent…";
    ta.dataset.notes = j.id;
    const stored = j.notes || "";
    ta.value = this.drafts.has(j.id) ? this.drafts.get(j.id) : stored;
    ta.rows = 2;

    const save = document.createElement("button");
    save.type = "button";
    save.className = "fbtn primary note-save";
    save.textContent = "SAVE NOTE";

    /* The button only exists while there is something to save. */
    const sync = () => {
      const dirty = ta.value !== stored;
      if (dirty) this.drafts.set(j.id, ta.value); else this.drafts.delete(j.id);
      save.classList.toggle("hide", !dirty);
      if (dirty) saved.textContent = "Unsaved";
      else if (saved.textContent === "Unsaved") saved.textContent = "";
    };
    ta.oninput = sync;
    save.onclick = () => {
      this.drafts.delete(j.id);
      save.classList.add("hide");
      this.patch(j.id, { notes: ta.value }, saved);
    };
    sync();

    const notesRow = document.createElement("div");
    notesRow.className = "note-row";
    notesRow.append(save, saved);
    track.append(ta, notesRow);
    body.appendChild(track);

    body.appendChild(this.actionRow(j));
    if (this.editingId === j.id) body.appendChild(this.editForm(j));
    main.appendChild(body);
    el.appendChild(main);

    return el;
  },

  actionRow(j) {
    const row = document.createElement("div");
    row.className = "action-row";

    const focus = document.createElement("button");
    focus.type = "button";
    focus.className = "hf-toggle" + (j.focus ? " on" : "");
    focus.textContent = "FOCUS";
    focus.setAttribute("aria-pressed", String(!!j.focus));
    focus.onclick = () => this.patch(j.id, { focus: !j.focus });

    const right = document.createElement("div");
    right.className = "right-actions";

    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "abtn";
    edit.textContent = this.editingId === j.id ? "CLOSE EDIT" : "EDIT";
    edit.onclick = () => {
      this.editingId = this.editingId === j.id ? null : j.id;
      this.open.add(j.id);
      this.render();
    };

    /* An unread job gets the one button it needs: keep it. Saying no is the
       same NOT RELEVANT button every other card has. */
    const keep = document.createElement("button");
    keep.type = "button";
    keep.className = "abtn keep";
    keep.textContent = "KEEP";
    keep.onclick = () => this.setGroup(j.id, "current");

    const park = document.createElement("button");
    park.type = "button";
    park.className = "abtn";
    park.textContent = j.parked ? "BRING BACK" : "NOT RELEVANT";
    park.onclick = () => this.setGroup(j.id, j.parked ? "current" : "parked");

    const del = document.createElement("button");
    del.type = "button";
    del.className = "abtn danger";
    this.armDelete(del, "DELETE", () => {
      del.textContent = "…";
      this.remove(j.id).catch(e => { del.textContent = `FAILED (${e.code || e.message})`; });
    });

    right.append(park, del);
    if (this.groupOf(j) === "unread") row.append(keep, edit, right);
    else row.append(focus, edit, right);
    return row;
  },

  field(labelText, tag, value, options = {}) {
    const label = document.createElement("label");
    label.className = "field";
    const caption = document.createElement("span");
    caption.className = "blk";
    caption.textContent = labelText;
    const control = document.createElement(tag);
    control.value = value || "";
    if (options.type) control.type = options.type;
    if (options.maxLength) control.maxLength = options.maxLength;
    label.append(caption, control);
    return { label, control };
  },

  /* Edits the fields a research pass writes. Stage and notes are edited in
     place above and are deliberately not repeated here. */
  editForm(j) {
    const form = document.createElement("form");
    form.className = "edit-form";
    const company  = this.field("COMPANY", "input", j.company, { maxLength: 80 });
    const role     = this.field("ROLE", "input", j.role, { maxLength: 120 });
    const location = this.field("LOCATION", "input", j.location, { maxLength: 120 });
    const pay      = this.field("PAY", "input", j.pay, { maxLength: 80 });
    const link     = this.field("LINK", "input", (j.links && j.links[0] && j.links[0].url) || "", { type: "url" });
    const what     = this.field("WHAT IT IS", "textarea", j.what, { maxLength: 2000 });
    const why      = this.field("WHY YOU", "textarea", j.why, { maxLength: 2000 });
    const flag     = this.field("CATCH", "textarea", j.flag, { maxLength: 2000 });

    const remoteLabel = document.createElement("label");
    remoteLabel.className = "checkline";
    const remote = document.createElement("input");
    remote.type = "checkbox"; remote.checked = !!j.remote;
    const remoteText = document.createElement("span");
    remoteText.textContent = "Remote";
    remoteLabel.append(remote, remoteText);

    const actions = document.createElement("div");
    actions.className = "form-actions";
    const save = document.createElement("button");
    save.type = "submit"; save.className = "fbtn primary"; save.textContent = "SAVE";
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.className = "fbtn"; cancel.textContent = "CANCEL";
    cancel.onclick = () => { this.editingId = null; this.render(); };
    actions.append(save, cancel);

    form.append(company.label, role.label, location.label, pay.label, link.label,
                what.label, why.label, flag.label, remoteLabel, actions);

    form.addEventListener("submit", e => {
      e.preventDefault();
      // Keep any extra links a research pass added; only the first is edited here.
      const rest = Array.isArray(j.links) ? j.links.slice(1) : [];
      const url = link.control.value.trim();
      const links = url
        ? [{ label: (j.links && j.links[0] && j.links[0].label) || "The role", url }, ...rest]
        : rest;
      this.editingId = null;
      this.patch(j.id, {
        company: company.control.value.trim(),
        role: role.control.value.trim(),
        location: location.control.value.trim(),
        pay: pay.control.value.trim(),
        what: what.control.value.trim(),
        why: why.control.value.trim(),
        flag: flag.control.value.trim(),
        remote: remote.checked,
        links
      });
      this.render();
    });
    setTimeout(() => { company.control.focus(); }, 0);
    return form;
  },

  /* Two taps on the same button rather than a dialog: the first arms it, the
     second does it, and it disarms itself after four seconds. */
  armDelete(button, label, action) {
    let armed = false, timer = null;
    const disarm = () => { armed = false; button.classList.remove("armed"); button.textContent = label; };
    button.textContent = label;
    button.onclick = () => {
      if (!armed) {
        armed = true;
        button.classList.add("armed");
        button.textContent = "SURE?";
        timer = setTimeout(disarm, 4000);
        return;
      }
      clearTimeout(timer);
      action();
    };
  }
};

App.init();
</script>
</body>
</html>
