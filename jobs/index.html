<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2EDE0">
<meta name="robots" content="noindex, nofollow">
<title>Jobs — Second Brain</title>

<!-- Add to Home Screen. iOS ignores the manifest's name/display, so the
     apple-* metas below are what actually make it launch standalone.
     One manifest for the whole Second Brain, so moving between sections
     never falls back to Safari. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!--
  PRIVATE MODULE. This file ships no job data at all — not a company name, not a
  link, not a note. Everything renders from users/{uid}/jobs in Firestore, which
  firestore.rules restricts to that signed-in uid. A visitor to the public Pages
  site sees the sign-in prompt and nothing else, which is the whole point: the
  repo is public, the job search is not.

  Seed or edit the data from Claude Code, or inline here once signed in.
-->
<style>
  /* Same neo-brutalist system as / and dailyplan/. */
  :root{
    --paper:#F2EDE0; --card:#FFFDF7; --ink:#111111;
    --yellow:#FFD53D; --teal:#00C2CB; --pink:#FF3D8B; --lime:#B8E62E;
    --grey:#7A756A;
    --stroke:2.5px; --shadow:5px 5px 0 var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    padding:
      calc(5vh + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
      calc(60px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    font:16px/1.5 "Archivo","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .blk{font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900}
  .wrap{max-width:620px;margin:0 auto}

  a.back{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;
    text-decoration:none;color:var(--ink);border-bottom:2px solid var(--ink);margin-bottom:16px}
  .eyebrow{display:inline-block;background:var(--ink);color:var(--paper);
    font-size:10px;letter-spacing:.1em;padding:4px 9px;margin-bottom:14px}
  h1{font-size:clamp(28px,7.5vw,38px);margin:0 0 12px;line-height:1.03;letter-spacing:-.02em}
  h1 em{font-style:normal;background:var(--yellow);border:var(--stroke) solid var(--ink);
    padding:0 8px;box-shadow:4px 4px 0 var(--ink);display:inline-block}
  .lede{color:var(--grey);font-weight:600;margin:0 0 22px;font-size:14.5px}

  /* ---------- sync bar (same contract as dailyplan/) ---------- */
  .sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    border:var(--stroke) solid var(--ink);background:var(--card);
    padding:11px 13px;margin-bottom:22px;font-size:12.5px;font-weight:700}
  .sync.on{background:var(--lime)}
  .sync.err{background:var(--pink);color:#fff}
  .sync .msg{flex:1;min-width:150px}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--ink);color:var(--paper);border:var(--stroke) solid var(--ink);
    font-size:12px;font-weight:800;padding:6px 11px;letter-spacing:.03em}
  .btn:active{transform:translate(2px,2px)}

  /* ---------- gate ---------- */
  #gate{border:2.5px dashed var(--ink);padding:22px 20px;text-align:center}
  #gate p{margin:0 0 14px;font-weight:700;font-size:14px;color:var(--grey)}

  /* ---------- filters ---------- */
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .chip{background:var(--card);border:2px solid var(--ink);font-size:11.5px;
    font-weight:800;padding:5px 10px;letter-spacing:.02em}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  /* ---------- overview ---------- */
  .panel{background:var(--card);border:var(--stroke) solid var(--ink);
    box-shadow:var(--shadow);padding:15px 17px;margin-bottom:20px}
  .panel h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    margin:0 0 9px;background:var(--teal);border:2px solid var(--ink);
    display:inline-block;padding:3px 8px}
  .panel p{margin:0 0 9px;font-size:13.8px}
  .panel p:last-child{margin:0}
  .panel ul{margin:8px 0 0;padding-left:19px;font-size:13.5px}
  .panel li{margin-bottom:6px}

  /* ---------- job cards ---------- */
  .job{background:var(--card);border:var(--stroke) solid var(--ink);
    box-shadow:var(--shadow);padding:15px 17px;margin-bottom:16px}
  .job.done{opacity:.55;box-shadow:2px 2px 0 var(--ink)}
  .chev{flex:0 0 auto;font-size:16px;font-weight:900;line-height:1.4}
  .digest{width:100%;text-align:left;margin-bottom:20px;padding:11px 13px;font-size:12px}
  .track-foot{display:flex;align-items:center;gap:10px;margin-top:8px}
  .rm{background:var(--paper);border:2px solid var(--ink);font-size:10.5px;
    font-weight:800;padding:5px 9px;letter-spacing:.02em;margin-left:auto;white-space:nowrap}
  .rm.arm{background:var(--pink);color:#fff}
  .job-h{display:flex;align-items:flex-start;gap:11px;margin-bottom:8px;
    cursor:pointer;user-select:none}
  .rank{flex:0 0 auto;width:30px;height:30px;background:var(--yellow);
    border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
    font-size:14px}
  .titles{flex:1;min-width:0}
  .co{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.15}
  .ro{display:block;font-size:13px;font-weight:700;color:var(--grey);margin-top:3px}
  .meta{font-size:11.5px;font-weight:800;color:var(--grey);letter-spacing:.03em;
    text-transform:uppercase;margin:0 0 9px}
  .pill{display:inline-block;border:2px solid var(--ink);padding:1px 7px;
    font-size:10.5px;font-weight:800;margin:0 5px 4px 0;background:var(--paper)}
  .pill.remote{background:var(--lime)}
  .pill.pay{background:var(--yellow)}
  .pill.dead{background:var(--pink);color:#fff}
  .txt{font-size:13.8px;margin:0 0 9px}
  .txt b{font-weight:800}
  .flag{font-size:12.8px;background:var(--yellow);border-left:4px solid var(--ink);
    padding:8px 10px;margin:0 0 10px;font-weight:600}
  .links{margin-bottom:11px}
  a.go{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;
    font-size:12px;font-weight:800;padding:6px 11px;margin:0 6px 6px 0;
    border:2px solid var(--ink)}
  a.go.sec{background:var(--card);color:var(--ink)}
  a.go:active{transform:translate(2px,2px)}

  .track{border-top:2px solid var(--ink);padding-top:10px}
  .track .lab{font-size:10px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--grey);display:block;margin-bottom:6px}
  .states{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .st{background:var(--paper);border:2px solid var(--ink);font-size:10.5px;
    font-weight:800;padding:4px 8px;letter-spacing:.02em}
  .st[aria-pressed="true"]{background:var(--teal)}
  .st[aria-pressed="true"][data-v="passed"],
  .st[aria-pressed="true"][data-v="closed"]{background:var(--pink);color:#fff}
  .st[aria-pressed="true"][data-v="offer"]{background:var(--lime)}
  textarea{width:100%;font:inherit;font-size:13px;background:var(--paper);
    border:2px solid var(--ink);padding:8px 9px;resize:vertical;min-height:38px}
  .saved{font-size:10.5px;font-weight:800;color:var(--grey);letter-spacing:.06em;
    text-transform:uppercase;margin-top:5px;min-height:13px}

  footer{margin-top:34px;padding-top:14px;border-top:2px solid var(--ink);
    font-size:11px;font-weight:700;color:var(--grey);line-height:1.6}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="../">&larr; SECOND BRAIN</a>
  <span class="eyebrow">PRIVATE &middot; SIGNED-IN ONLY</span>
  <h1 class="blk">Job <em>search</em></h1>
  <p class="lede" id="lede">Verified opportunities, tracked by stage.</p>

  <div class="sync" id="sync">
    <span class="msg" id="syncMsg">Connecting&hellip;</span>
    <button class="btn" id="authBtn" hidden></button>
  </div>

  <div id="gate">
    <p>This module is private. Sign in with the account that owns this data to see it.</p>
  </div>

  <div id="app" class="hide">
    <div class="filters" id="filters"></div>
    <button class="btn digest blk" id="digestBtn" aria-expanded="false">DIGEST ▾</button>
    <div id="overview" class="hide"></div>
    <div id="list"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script type="module">
const SDK = "https://www.gstatic.com/firebasejs/12.16.0/";
const $ = id => document.getElementById(id);

const STATES = [
  ["todo",         "To do"],
  ["applied",      "Applied"],
  ["interviewing", "Interviewing"],
  ["offer",        "Offer"],
  ["passed",       "Passed"],
  ["closed",       "Closed"]
];
const DONE = new Set(["passed", "closed"]);

const App = {
  fb: null, uid: null, jobs: [], overview: null, filter: "open", unsub: null,
  open: new Set(), digestOpen: false,

  setUI(state, msg, btnLabel, btnAction) {
    $("sync").className = "sync" + (state === "on" ? " on" : state === "err" ? " err" : "");
    $("syncMsg").textContent = msg;
    const btn = $("authBtn");
    if (btnLabel) { btn.hidden = false; btn.textContent = btnLabel; btn.onclick = btnAction; }
    else { btn.hidden = true; btn.onclick = null; }
  },

  async init() {
    let config = null;
    try { ({ firebaseConfig: config } = await import("./firebase-config.js")); }
    catch { /* file:// origin, or the file is missing */ }
    if (!config || !config.projectId) {
      this.setUI("err", "No Firebase config — this module can't load without it.");
      return;
    }
    try {
      const [{ initializeApp }, authMod, fsMod] = await Promise.all([
        import(SDK + "firebase-app.js"),
        import(SDK + "firebase-auth.js"),
        import(SDK + "firebase-firestore.js")
      ]);
      const app = initializeApp(config);
      const db = fsMod.initializeFirestore(app, {
        localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() })
      });
      this.fb = { auth: authMod.getAuth(app), db, a: authMod, f: fsMod };
      authMod.getRedirectResult(this.fb.auth).catch(() => {});
      authMod.onAuthStateChanged(this.fb.auth, u => this.onAuth(u));
    } catch (e) {
      console.warn("Firebase unavailable:", e);
      this.setUI("err", "Couldn't reach Firebase.", "Retry", () => location.reload());
    }
  },

  onAuth(user) {
    if (this.unsub) { this.unsub(); this.unsub = null; }
    if (!user) {
      this.uid = null; this.jobs = []; this.overview = null;
      $("app").classList.add("hide");
      $("gate").classList.remove("hide");
      $("foot").textContent = "";
      this.setUI("off", "Signed out — nothing loaded.", "Sign in with Google", () => this.signIn());
      return;
    }
    this.uid = user.uid;
    this.setUI("on", `Signed in as ${user.email || "your account"}`, "Sign out", () => this.signOut());
    $("gate").classList.add("hide");
    $("app").classList.remove("hide");
    this.attach();
    this.loadOverview();
  },

  async signIn() {
    const { a, auth } = this.fb;
    try {
      this.setUI("off", "Opening Google sign-in…");
      await a.signInWithPopup(auth, new a.GoogleAuthProvider());
    } catch (e) {
      const code = (e && e.code) || "";
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
        try { await a.signInWithRedirect(auth, new a.GoogleAuthProvider()); return; }
        catch (e2) { e = e2; }
      }
      const msg =
        code === "auth/unauthorized-domain" ? "This domain isn't authorised in Firebase Auth yet."
      : code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request" ? "Sign-in was cancelled."
      : `Sign-in failed (${e.code || e.message}).`;
      this.setUI("err", msg, "Try again", () => this.signIn());
    }
  },

  async signOut() {
    try { await this.fb.a.signOut(this.fb.auth); }
    catch (e) { this.setUI("err", `Couldn't sign out (${e.message}).`, "Try again", () => this.signOut()); }
  },

  attach() {
    const { f, db } = this.fb;
    const col = f.collection(db, "users", this.uid, "jobs");
    this.unsub = f.onSnapshot(col,
      snap => {
        this.jobs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                             .sort((a, b) => (a.rank || 99) - (b.rank || 99));
        this.render();
      },
      err => this.setUI("err", `Couldn't read jobs (${err.code || err.message}).`)
    );
  },

  async loadOverview() {
    const { f, db } = this.fb;
    try {
      const snap = await f.getDoc(f.doc(db, "users", this.uid, "jobsMeta", "overview"));
      this.overview = snap.exists() ? snap.data() : null;
    } catch { this.overview = null; }
    this.render();
  },

  ref(id) {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "jobs", id);
  },

  async patch(id, fields, el) {
    const { f } = this.fb;
    try {
      await f.updateDoc(this.ref(id), { ...fields, updatedAt: f.serverTimestamp() });
      if (el) { el.textContent = "Saved"; setTimeout(() => { el.textContent = ""; }, 1600); }
    } catch (e) {
      if (el) el.textContent = `Not saved (${e.code || e.message})`;
    }
  },

  async remove(id) {
    this.open.delete(id);
    await this.fb.f.deleteDoc(this.ref(id));
  },

  visible() {
    if (this.filter === "all") return this.jobs;
    if (this.filter === "open") return this.jobs.filter(j => !DONE.has(j.status || "todo"));
    if (this.filter === "live") return this.jobs.filter(j => j.live !== false && !DONE.has(j.status || "todo"));
    return this.jobs.filter(j => (j.status || "todo") === this.filter);
  },

  render() {
    // filters
    const counts = { all: this.jobs.length, open: this.jobs.filter(j => !DONE.has(j.status || "todo")).length };
    const chips = [["open", `Open ${counts.open}`], ["live", "Live only"], ["applied", "Applied"],
                   ["interviewing", "Interviewing"], ["all", `All ${counts.all}`]];
    $("filters").innerHTML = "";
    for (const [v, label] of chips) {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", String(this.filter === v));
      b.onclick = () => { this.filter = v; this.render(); };
      $("filters").appendChild(b);
    }

    // digest — the read, this week, ruled out, corrections
    const ov = this.overview;
    const hasDigest = !!(ov && (ov.strategy || (ov.thisWeek || []).length
      || (ov.ruledOut || []).length || (ov.corrections || []).length));
    const dg = $("digestBtn");
    dg.classList.toggle("hide", !hasDigest);
    dg.textContent = this.digestOpen ? "DIGEST ▴" : "DIGEST ▾";
    dg.setAttribute("aria-expanded", String(this.digestOpen));
    dg.onclick = () => { this.digestOpen = !this.digestOpen; this.render(); };
    $("overview").classList.toggle("hide", !this.digestOpen);
    $("overview").innerHTML = "";
    if (ov) {
      if (ov.lede) $("lede").textContent = ov.lede;
      const blocks = [
        ["The read", ov.strategy, null],
        ["This week", null, ov.thisWeek],
        ["Ruled out", null, ov.ruledOut],
        ["Corrections", null, ov.corrections]
      ];
      for (const [title, para, list] of blocks) {
        if (!para && !(list && list.length)) continue;
        const d = document.createElement("div");
        d.className = "panel";
        const h = document.createElement("h2"); h.className = "blk"; h.textContent = title;
        d.appendChild(h);
        if (para) { const p = document.createElement("p"); p.textContent = para; d.appendChild(p); }
        if (list && list.length) {
          const ul = document.createElement("ul");
          for (const item of list) { const li = document.createElement("li"); li.textContent = item; ul.appendChild(li); }
          d.appendChild(ul);
        }
        $("overview").appendChild(d);
      }
    }

    // jobs
    const list = $("list");
    list.innerHTML = "";
    const rows = this.visible();
    if (!rows.length) {
      const d = document.createElement("div");
      d.className = "panel";
      d.textContent = this.jobs.length ? "Nothing in this view." : "No opportunities stored yet.";
      list.appendChild(d);
    }
    for (const j of rows) list.appendChild(this.card(j));

    $("foot").textContent = ov && ov.footer
      ? ov.footer
      : `${this.jobs.length} opportunities. Private to your account.`;
  },

  card(j) {
    const status = j.status || "todo";
    const isOpen = this.open.has(j.id);
    const el = document.createElement("div");
    el.className = "job" + (DONE.has(status) ? " done" : "");

    const head = document.createElement("div");
    head.className = "job-h";
    const rank = document.createElement("div");
    rank.className = "rank blk"; rank.textContent = j.rank ?? "•";
    const titles = document.createElement("div");
    titles.className = "titles";
    const co = document.createElement("span"); co.className = "co blk"; co.textContent = j.company || "";
    const ro = document.createElement("span"); ro.className = "ro"; ro.textContent = j.role || "";
    titles.append(co, ro);
    const chev = document.createElement("span");
    chev.className = "chev blk"; chev.textContent = isOpen ? "▴" : "▾";
    head.append(rank, titles, chev);
    head.onclick = () => {
      if (this.open.has(j.id)) this.open.delete(j.id); else this.open.add(j.id);
      this.render();
    };
    el.appendChild(head);

    // Everything below the header is hidden until the card is opened, so a
    // collapsed list reads as just company + role.
    const body = document.createElement("div");
    body.className = "jbody" + (isOpen ? "" : " hide");

    const meta = document.createElement("div");
    meta.className = "meta";
    const pills = [];
    if (j.location) pills.push(["", j.location]);
    if (j.remote) pills.push(["remote", "Remote"]);
    if (j.pay) pills.push(["pay", j.pay]);
    if (j.live === false) pills.push(["dead", "Closed listing"]);
    for (const [cls, text] of pills) {
      const s = document.createElement("span");
      s.className = "pill " + cls; s.textContent = text;
      meta.appendChild(s);
    }
    body.appendChild(meta);

    for (const key of ["what", "why"]) {
      if (!j[key]) continue;
      const p = document.createElement("p");
      p.className = "txt";
      if (key === "why") { const b = document.createElement("b"); b.textContent = "Why you: "; p.appendChild(b); }
      p.appendChild(document.createTextNode(j[key]));
      body.appendChild(p);
    }
    if (j.flag) {
      const f = document.createElement("p"); f.className = "flag"; f.textContent = j.flag;
      body.appendChild(f);
    }

    if (Array.isArray(j.links) && j.links.length) {
      const wrap = document.createElement("div");
      wrap.className = "links";
      j.links.forEach((l, i) => {
        const a = document.createElement("a");
        a.className = "go" + (i ? " sec" : "");
        a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = l.label || "Open";
        wrap.appendChild(a);
      });
      body.appendChild(wrap);
    }

    // tracking
    const track = document.createElement("div");
    track.className = "track";
    const lab = document.createElement("span");
    lab.className = "lab"; lab.textContent = "Stage";
    track.appendChild(lab);

    const saved = document.createElement("div");
    saved.className = "saved";

    const states = document.createElement("div");
    states.className = "states";
    for (const [v, label] of STATES) {
      const b = document.createElement("button");
      b.className = "st"; b.dataset.v = v; b.textContent = label;
      b.setAttribute("aria-pressed", String(status === v));
      b.onclick = () => this.patch(j.id, { status: v }, saved);
      states.appendChild(b);
    }
    track.appendChild(states);

    const ta = document.createElement("textarea");
    ta.placeholder = "Notes — contacts, dates, what you sent…";
    ta.value = j.notes || "";
    ta.rows = 2;
    let t = null;
    ta.oninput = () => {
      clearTimeout(t);
      saved.textContent = "…";
      t = setTimeout(() => this.patch(j.id, { notes: ta.value }, saved), 700);
    };
    const foot = document.createElement("div");
    foot.className = "track-foot";
    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "Remove";
    let armed = false, armTimer = null;
    rm.onclick = () => {
      if (!armed) {                       // two taps, so a stray tap can't delete
        armed = true;
        rm.classList.add("arm");
        rm.textContent = "Tap again to remove";
        armTimer = setTimeout(() => {
          armed = false; rm.classList.remove("arm"); rm.textContent = "Remove";
        }, 4000);
        return;
      }
      clearTimeout(armTimer);
      rm.textContent = "Removing…";
      this.remove(j.id).catch(e => { rm.textContent = `Failed (${e.code || e.message})`; });
    };
    foot.append(saved, rm);

    track.append(ta, foot);
    body.appendChild(track);
    el.appendChild(body);

    return el;
  }
};

App.init();
</script>
</body>
</html>
