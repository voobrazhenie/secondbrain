<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2EDE0">
<title>Streams — Second Brain</title>

<!-- Add to Home Screen. iOS ignores the manifest's name/display, so the
     apple-* metas below are what actually make it launch standalone.
     One manifest for the whole Second Brain, so moving between sections
     never falls back to Safari. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="../theme.css">
<style>
  /* Same neo-brutalist system as / and dailyplan/. Shared colors/spacing live
     in theme.css; only page-specific rules stay here. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    padding:
      calc(var(--page-top) + env(safe-area-inset-top)) calc(var(--page-side) + env(safe-area-inset-right))
      calc(var(--page-bottom) + env(safe-area-inset-bottom)) calc(var(--page-side) + env(safe-area-inset-left));
    font:15px/1.5 "Archivo","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .blk{font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900}
  .wrap{max-width:var(--page-width);margin:0 auto}


  /* ---------- sync bar (same contract as dailyplan/ and jobs/) — lives at the
     bottom now, streams are the point of this page ---------- */
  .sync{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border:2px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);
    padding:9px 11px;margin:0 0 20px;font-size:12px;font-weight:700;color:var(--grey)}
  .sync.on{background:var(--card)}
  .sync .dot{flex:0 0 auto;width:9px;height:9px;border:2px solid var(--ink);background:var(--sunk)}
  .sync.on .dot{background:var(--lime)}
  .sync.err .dot{background:var(--pink)}
  .sync .msg{flex:1;min-width:150px}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--card);color:var(--ink);border:2px solid var(--ink);
    font-size:11px;font-weight:800;padding:6px 11px;letter-spacing:.03em;
    box-shadow:2px 2px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:none}

  /* ---------- groups ---------- */
  .group{margin-bottom:24px}
  .group.drop-in{outline:2px dashed var(--teal);outline-offset:5px}
  .group-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .group-h .t{font-size:11px;font-weight:900;letter-spacing:.07em;
    background:var(--ink);color:var(--paper);padding:3px 8px;
    font-family:"Arial Black",Impact,sans-serif}
  .group-h .t.hot{background:var(--pink);color:#fff}
  .group-h .r{flex:1;height:2px;background:var(--ink)}
  .group-h .cap{font-size:9.5px;font-weight:900;color:var(--grey);white-space:nowrap}
  .group-h .cap.full{color:var(--ink)}
  /* Same small "+" next to the count as opportunities/ and the daily page. */
  .group-h .add{flex:0 0 auto;width:26px;height:26px;padding:0;font-size:15px;line-height:1;
    background:var(--card);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:"Arial Black",Impact,sans-serif}
  .group-h .add:active{transform:translate(2px,2px);box-shadow:none}
  .group-h .add:disabled{opacity:.35;cursor:default;transform:none;box-shadow:2px 2px 0 var(--faint)}
  .group-note{font-size:11px;font-weight:600;color:var(--grey);margin:-5px 0 10px}

  /* ---------- add panel ---------- */
  .add-panel{background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    padding:12px;margin-bottom:11px}
  .field{display:block;margin-bottom:10px}
  .field span{display:block;font-size:9px;letter-spacing:.08em;margin-bottom:4px}
  /* 16px minimum — anything smaller makes iOS zoom the page on focus. */
  .field input{display:block;width:100%;border:2px solid var(--ink);background:var(--paper);
    color:var(--ink);padding:9px 10px;font-size:16px;font-weight:650;border-radius:0}
  .form-actions{display:flex;gap:6px;flex-wrap:wrap}
  .btn{background:var(--card);color:var(--ink);border:2px solid var(--ink);
    padding:8px 12px;font-size:11px;font-weight:900;letter-spacing:.04em;
    box-shadow:2px 2px 0 var(--ink);font-family:"Arial Black",Impact,sans-serif}
  .btn.primary{background:var(--yellow)}
  .btn:active{transform:translate(2px,2px);box-shadow:none}

  /* ---------- cards ---------- */
  .stream{position:relative;background:var(--card);border:var(--stroke) solid var(--ink);
    box-shadow:var(--shadow);margin-bottom:9px}
  .stream.dragging{opacity:.45;z-index:3}
  .stream.drop-before{box-shadow:0 -6px 0 var(--teal),var(--shadow)}
  .stream.drop-after{box-shadow:0 6px 0 var(--teal),var(--shadow)}

  /* The tray is clipped to the row, not the whole card: an open card's body is
     transparent and would let the pink show through behind it. */
  .rowclip{position:relative;overflow:hidden}
  .tray{position:absolute;top:0;right:0;bottom:0;width:92px;display:flex}
  .tray button{flex:1;border:0;background:var(--pink);color:var(--paper);
    font-size:10px;font-weight:900;letter-spacing:.03em;font-family:"Arial Black",Impact,sans-serif}
  .tray button.armed{background:var(--ink)}

  .surface{position:relative;background:var(--card);display:flex;align-items:stretch;
    transition:transform .16s ease-out;touch-action:pan-y}
  /* .handle comes from theme.css; here it also carries the Focus-now colour. */
  .stream.hot .handle{background:var(--pink)}
  /* A stream is one line and stays one line — no expanding. Selection is off
     via .press-edit in theme.css, so a long press reads as "rename" rather
     than "select text". */
  .rowbody{flex:1;min-width:0;display:flex;align-items:center;padding:11px 14px 11px 12px;
    cursor:pointer}
  .r-title{font-size:15px;font-weight:700;overflow-wrap:anywhere}

  .stream-body{border-top:2px solid var(--ink);padding:11px 12px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .abtn{background:var(--card);color:var(--ink);border:2px solid var(--ink);
    padding:6px 8px;font-size:10px;font-weight:900;letter-spacing:.02em;
    box-shadow:2px 2px 0 var(--ink);font-family:"Arial Black",Impact,sans-serif}
  .abtn:active{transform:translate(2px,2px);box-shadow:none}
  .abtn.danger{margin-left:auto;background:var(--pink);color:#fff}
  .abtn.danger.armed{background:var(--ink);color:var(--paper)}

  .empty{font-size:12px;font-weight:600;color:var(--grey);padding:2px 2px 10px}

  footer{margin-top:30px;padding-top:14px;border-top:2px solid var(--ink);
    font-size:11px;font-weight:700;color:var(--grey);line-height:1.6}

  /* Streams are the account's, so nothing shows until Firebase has said who is
     looking. This page used to work signed out, keeping a copy in the browser —
     which is how one account's data ended up under another's on DailyPlan. */
  #wrap:not([data-auth="in"]) #groups,
  #wrap:not([data-auth="in"]) #foot{ display:none }
</style>
</head>
<body>
<div class="wrap" id="wrap" data-auth="checking">

  <header class="topbar">
    <a class="crumb" href="../">SECOND BRAIN</a>
    <span class="crumb here">LIFE STREAMS</span>
  </header>

  <div id="groups"></div>

  <div class="sync" id="sync">
    <span class="dot"></span>
    <span class="msg" id="syncMsg">Checking sync&hellip;</span>
    <button class="btn" id="authBtn" hidden></button>
  </div>

  <footer id="foot">Drag a stream by its handle — inside a section to reorder, into another to move it. Hold a stream to rename it, swipe it left to delete.</footer>
</div>

<script type="module">
"use strict";

/* Nothing about the account stays on the device. This clears what the previous
   version left behind, once, on load. */
try { localStorage.removeItem("secondbrain.streams.v1"); } catch {}

/* shared/firebase.js, once init() has pulled it in. */
let fbLib = null;
const $ = id => document.getElementById(id);
const newId = () => "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// [key, label, cap] — cap is null for no limit. Order here is display order.
const GROUPS = [
  ["focus",    "FOCUS NOW",              3],
  ["maintain", "MAINTAIN",               null],
  ["parked",   "PARKED, NOT FORGOTTEN",  null]
];
let streams = [];      // [{ id, title, group }], array order = display order
let editingId = null;  // stream showing its rename form instead of its row
let revealedId = null; // stream whose swipe tray is showing
let addGroup = null;   // group whose add panel is open

const TRAY_W = 92;     // px — matches .tray width
const TAP_SLOP = 8;    // shorter than this is a tap, not a swipe

/* Written whole, no merge — same contract as dailyplan's `custom` doc. The list
   lives in memory while the page is open and in Firestore between visits, so
   "save" means "send it up". push defaults on; sync.pull() passes push:false so
   a pull doesn't immediately write the same data straight back. */
function saveLocal({ push = true } = {}) {
  if (push) sync.push();
}

const countIn  = group => streams.filter(s => s.group === group).length;
const capOf    = group => GROUPS.find(g => g[0] === group)[2];
const isFull   = group => { const c = capOf(group); return c != null && countIn(group) >= c; };

function addStream(group, title) {
  title = (title || "").trim();
  if (!title || isFull(group)) return false;
  streams.push({ id: newId(), title: title.slice(0, 80), group });
  addGroup = null;
  saveLocal();
  render();
  return true;
}

function renameStream(id, title) {
  title = (title || "").trim();
  const s = streams.find(x => x.id === id);
  editingId = null;
  if (!s || !title) { render(); return; }
  s.title = title.slice(0, 80);
  saveLocal();
  render();
}

function removeStream(id) {
  streams = streams.filter(x => x.id !== id);
  revealedId = null;
  saveLocal();
  render();
}

/* The flat array is the order, so a drop is a splice. A card dropped into
   another section changes group as it lands — that is the only way to move
   between sections now — except into a section that is already full, which is
   refused and leaves the card where it was. */
function dropStream(id, targetId, before, toGroup) {
  const from = streams.findIndex(x => x.id === id);
  if (from < 0) return;
  const moving = streams[from];
  const target = targetId ? streams.find(x => x.id === targetId) : null;
  const group = target ? target.group : toGroup;
  if (!group) return;
  if (group !== moving.group && isFull(group)) return;
  if (target && target.id === id) return;

  const [s] = streams.splice(from, 1);
  s.group = group;
  if (target) {
    let to = streams.findIndex(x => x.id === targetId);
    if (to < 0) streams.push(s);
    else streams.splice(before ? to : to + 1, 0, s);
  } else {
    streams.push(s);          // dropped on an empty section
  }
  saveLocal();
  render();
}

/* ---------- render ---------- */
function render() {
  const wrap = $("groups");
  wrap.textContent = "";

  for (const [key, label, cap] of GROUPS) {
    const items = streams.filter(s => s.group === key);

    const sec = document.createElement("div");
    sec.className = "group";
    sec.dataset.group = key;

    const h = document.createElement("div");
    h.className = "group-h";
    const t = document.createElement("span");
    t.className = "t" + (key === "focus" ? " hot" : "");
    t.textContent = label;
    const rule = document.createElement("span");
    rule.className = "r";
    h.append(t, rule);
    if (cap != null) {
      const capEl = document.createElement("span");
      capEl.className = "cap" + (items.length >= cap ? " full" : "");
      capEl.textContent = items.length >= cap ? `${items.length}/${cap} · FULL` : `${items.length}/${cap}`;
      h.appendChild(capEl);
    }
    const add = document.createElement("button");
    add.className = "add";
    add.type = "button";
    add.textContent = "+";
    add.disabled = isFull(key);
    add.setAttribute("aria-label", `Add a stream to ${label}`);
    add.addEventListener("click", () => { addGroup = addGroup === key ? null : key; render(); });
    h.appendChild(add);
    sec.appendChild(h);

    if (addGroup === key) sec.appendChild(addPanel(key));

    if (!items.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Nothing here.";
      sec.appendChild(e);
    }

    for (const s of items) sec.appendChild(streamRow(s, key));
    wrap.appendChild(sec);
  }
}

function addPanel(group) {
  const form = document.createElement("form");
  form.className = "add-panel";
  const label = document.createElement("label");
  label.className = "field";
  const caption = document.createElement("span");
  caption.textContent = "STREAM";
  const input = document.createElement("input");
  input.maxLength = 80;
  input.required = true;
  input.autocomplete = "off";
  input.placeholder = "What are you giving attention to?";
  label.append(caption, input);

  const actions = document.createElement("div");
  actions.className = "form-actions";
  const save = document.createElement("button");
  save.type = "submit"; save.className = "btn primary"; save.textContent = "ADD";
  const cancel = document.createElement("button");
  cancel.type = "button"; cancel.className = "btn"; cancel.textContent = "CANCEL";
  cancel.addEventListener("click", () => { addGroup = null; render(); });
  actions.append(save, cancel);

  form.append(label, actions);
  form.addEventListener("submit", event => {
    event.preventDefault();
    if (!addStream(group, input.value)) input.focus();
  });
  setTimeout(() => input.focus(), 0);
  return form;
}

function streamRow(s, group) {
  const card = document.createElement("article");
  card.className = "stream" + (group === "focus" ? " hot" : "");
  card.dataset.id = s.id;

  if (editingId === s.id) {
    card.appendChild(editForm(s));
    return card;
  }

  const clip = document.createElement("div");
  clip.className = "rowclip";

  const tray = document.createElement("div");
  tray.className = "tray";
  const trayDelete = document.createElement("button");
  trayDelete.type = "button";
  armDelete(trayDelete, "DELETE", () => removeStream(s.id));
  tray.appendChild(trayDelete);

  const surface = document.createElement("div");
  surface.className = "surface";
  surface.style.transform = `translateX(${revealedId === s.id ? -TRAY_W : 0}px)`;

  const body = document.createElement("div");
  body.className = "rowbody press-edit";
  const title = document.createElement("span");
  title.className = "r-title";
  title.textContent = s.title;
  body.appendChild(title);

  surface.append(dragHandle(card, s), body);
  attachSwipe(surface, s);
  clip.append(tray, surface);
  card.appendChild(clip);
  return card;
}

/* Delete asks once, on the button itself: the first tap arms it, the second
   one within four seconds does it. */
function armDelete(button, label, action) {
  let armed = false, timer = null;
  button.textContent = label;
  button.addEventListener("click", () => {
    if (!armed) {
      armed = true;
      button.textContent = "SURE?";
      button.classList.add("armed");
      timer = setTimeout(() => {
        armed = false;
        button.textContent = label;
        button.classList.remove("armed");
      }, 4000);
      return;
    }
    clearTimeout(timer);
    action();
  });
}

function editForm(s) {
  const form = document.createElement("form");
  form.className = "stream-body";
  const label = document.createElement("label");
  label.className = "field";
  const caption = document.createElement("span");
  caption.textContent = "STREAM";
  const input = document.createElement("input");
  input.value = s.title;
  input.maxLength = 80;
  input.required = true;
  label.append(caption, input);

  const actions = document.createElement("div");
  actions.className = "form-actions";
  const save = document.createElement("button");
  save.type = "submit"; save.className = "btn primary"; save.textContent = "SAVE";
  const cancel = document.createElement("button");
  cancel.type = "button"; cancel.className = "btn"; cancel.textContent = "CANCEL";
  cancel.addEventListener("click", () => { editingId = null; render(); });
  actions.append(save, cancel);

  form.append(label, actions);
  form.addEventListener("submit", event => {
    event.preventDefault();
    renameStream(s.id, input.value);
  });
  setTimeout(() => { input.focus(); input.select(); }, 0);
  return form;
}

/* ---------- reordering ----------
   Pointer events rather than HTML5 drag-and-drop, which Safari never fires for
   touch. Dropping onto another section is how a stream changes section, so the
   handle also watches which section the finger is over. */
function dragHandle(card, s) {
  const handle = document.createElement("span");
  handle.className = "handle";
  handle.setAttribute("aria-label", "Drag to reorder");
  handle.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<circle cx="5" cy="3" r="1.4" fill="#111"/><circle cx="11" cy="3" r="1.4" fill="#111"/>'
    + '<circle cx="5" cy="8" r="1.4" fill="#111"/><circle cx="11" cy="8" r="1.4" fill="#111"/>'
    + '<circle cx="5" cy="13" r="1.4" fill="#111"/><circle cx="11" cy="13" r="1.4" fill="#111"/></svg>';

  let startY = 0, moved = false, targetId = null, targetGroup = null, before = false;

  handle.addEventListener("pointerdown", event => {
    if (event.button) return;
    event.preventDefault();
    event.stopPropagation();
    startY = event.clientY;
    moved = false; targetId = null; targetGroup = null;
    handle.setPointerCapture(event.pointerId);
  });

  handle.addEventListener("pointermove", event => {
    if (!handle.hasPointerCapture(event.pointerId)) return;
    const dy = event.clientY - startY;
    if (!moved && Math.abs(dy) < 6) return;
    moved = true;
    card.classList.add("dragging");
    card.style.transform = `translateY(${dy}px)`;
    clearDropMarks();

    const hit = rowUnder(event.clientY, s.id);
    targetId = null; targetGroup = null;
    if (hit && allowed(s, hit.group)) {
      targetId = hit.id; before = hit.before;
      hit.el.classList.add(before ? "drop-before" : "drop-after");
      if (hit.group !== s.group) markGroup(hit.group);
    } else if (!hit) {
      const sec = groupUnder(event.clientY);
      if (sec && allowed(s, sec)) { targetGroup = sec; markGroup(sec); }
    }
  });

  const finish = event => {
    event.stopPropagation();
    if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
    card.classList.remove("dragging");
    card.style.transform = "";
    clearDropMarks();
    if (moved && (targetId || targetGroup)) dropStream(s.id, targetId, before, targetGroup);
    moved = false; targetId = null; targetGroup = null;
  };
  handle.addEventListener("pointerup", finish);
  handle.addEventListener("pointercancel", finish);
  return handle;
}

const allowed = (s, group) => group === s.group || !isFull(group);

function markGroup(key) {
  const sec = document.querySelector(`.group[data-group="${key}"]`);
  if (sec) sec.classList.add("drop-in");
}

function rowUnder(clientY, selfId) {
  for (const el of document.querySelectorAll("#groups .stream")) {
    if (el.dataset.id === selfId) continue;
    const rect = el.getBoundingClientRect();
    if (clientY >= rect.top && clientY <= rect.bottom) {
      const row = streams.find(x => x.id === el.dataset.id);
      return { el, id:el.dataset.id, group: row ? row.group : null,
               before: clientY < rect.top + rect.height / 2 };
    }
  }
  return null;
}

function groupUnder(clientY) {
  for (const sec of document.querySelectorAll("#groups .group")) {
    const rect = sec.getBoundingClientRect();
    if (clientY >= rect.top && clientY <= rect.bottom) return sec.dataset.group;
  }
  return null;
}

function clearDropMarks() {
  document.querySelectorAll(".drop-before,.drop-after,.drop-in")
    .forEach(el => el.classList.remove("drop-before", "drop-after", "drop-in"));
}

/* ---------- swipe and long press ----------
   The row tracks the finger with the transition switched off, then snaps open
   or shut on release — swipe left for Delete. Holding still for half a second
   instead opens the rename form, which is the only way in now that the rows
   don't expand. The first few pixels decide which gesture this is. */
const LONG_PRESS_MS = 500;

function attachSwipe(surface, s) {
  let startX = 0, startY = 0, base = 0, dx = 0, axis = null, tracking = false;
  let timer = null, held = false, mouse = false;

  const settle = offset => {
    surface.style.transition = "";
    surface.style.transform = `translateX(${offset}px)`;
  };

  surface.addEventListener("pointerdown", event => {
    if (event.button) return;
    tracking = true; axis = null; dx = 0; held = false;
    mouse = event.pointerType === "mouse";
    startX = event.clientX; startY = event.clientY;
    base = revealedId === s.id ? -TRAY_W : 0;
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (axis !== null) return;          // already swiping — not a hold
      held = true;
      if (navigator.vibrate) navigator.vibrate(12);
      editingId = s.id;
      revealedId = null;
      render();
    }, LONG_PRESS_MS);
  });

  surface.addEventListener("pointermove", event => {
    if (!tracking) return;
    const ax = event.clientX - startX;
    const ay = event.clientY - startY;
    if (axis === null) {
      if (Math.abs(ax) < TAP_SLOP && Math.abs(ay) < TAP_SLOP) return;
      axis = Math.abs(ax) > Math.abs(ay) ? "x" : "y";
      clearTimeout(timer);
      // Swiping is a finger's gesture; a mouse drag across a row is not one.
      if (axis === "x" && mouse) axis = "y";
      if (axis === "x") {
        surface.style.transition = "none";
        surface.setPointerCapture(event.pointerId);
      }
    }
    if (axis !== "x") return;
    dx = Math.max(-TRAY_W, Math.min(0, base + ax));
    surface.style.transform = `translateX(${dx}px)`;
  });

  surface.addEventListener("pointerup", () => {
    clearTimeout(timer);
    if (!tracking || held) { tracking = false; axis = null; return; }
    tracking = false;

    if (axis === "x") {
      axis = null;
      const reveal = dx <= -TRAY_W / 2;
      if (reveal && revealedId && revealedId !== s.id) resetTray(revealedId);
      revealedId = reveal ? s.id : null;
      settle(reveal ? -TRAY_W : 0);
      return;
    }
    axis = null;

    // A plain tap only puts a revealed row back; there is nothing to open.
    if (revealedId === s.id) { revealedId = null; settle(0); }
  });

  surface.addEventListener("pointercancel", () => {
    clearTimeout(timer);
    tracking = false; axis = null;
    settle(revealedId === s.id ? -TRAY_W : 0);
  });

  // Mouse equivalents of the hold.
  surface.addEventListener("dblclick", event => {
    event.preventDefault();
    editingId = s.id; revealedId = null; render();
  });
  surface.addEventListener("contextmenu", event => {
    event.preventDefault();
    editingId = s.id; revealedId = null; render();
  });
}

/* Sliding one row open closes whichever other one was open, without a full
   re-render — the snap has to animate from where the row actually is. */
function resetTray(id) {
  const other = document.querySelector(`.stream[data-id="${id}"] .surface`);
  if (other) { other.style.transition = ""; other.style.transform = "translateX(0px)"; }
}

/* ---------- sync ---------- */
const sync = {
  fb: null, uid: null, mode: "checking",
  lastRefresh: 0,     // throttles refresh(), see there

  setUI(state, msg, btnLabel, btnAction) {
    $("sync").className = "sync" + (state === "on" ? " on" : state === "err" ? " err" : "");
    $("syncMsg").textContent = msg;
    const btn = $("authBtn");
    if (btnLabel) { btn.hidden = false; btn.textContent = btnLabel; btn.onclick = btnAction; }
    else { btn.hidden = true; btn.onclick = null; }
  },

  /* Connecting and knowing who is signed in is shared/firebase.js's job; the
     wording and the gate stay here. */
  setAuthState(state) { $("wrap").dataset.auth = state; },

  async init() {
    try {
      fbLib = await import("../shared/firebase.js");
      this.fb = await fbLib.connect();
    } catch (e) {
      this.setAuthState("err");
      if (e && e.code === "no-config") {
        this.setUI("err", "Sync isn't configured, so there's nothing to show here.",
          "Reload", () => location.reload());
      } else {
        console.warn("Firebase unavailable:", e);
        this.setUI("err", "Couldn't reach Firebase, so there's nothing to show here.",
          "Reload", () => location.reload());
      }
      return;
    }
    this.mode = "signed-out";
    fbLib.watchAuth(this.fb, u => this.onAuth(u));
  },

  async onAuth(user) {
    if (!user) {
      this.mode = "signed-out";
      this.uid = null;
      streams = [];
      editingId = null; revealedId = null; addGroup = null;
      render();
      this.setAuthState("out");
      this.setUI("off", "Sign in to see your streams.",
        "Sign in with Google", () => this.signIn());
      return;
    }
    this.uid = user.uid;
    this.mode = "signed-in";
    this.setUI("on", `Synced — signed in as ${user.email || "your account"}`,
      "Sign out", () => this.signOut());
    await this.pull();
    this.setAuthState("in");
  },

  async signIn() {
    const msg = await fbLib.signIn(this.fb, text => this.setUI("off", text));
    if (msg) this.setUI("err", msg, "Try again", () => this.signIn());
  },

  async signOut() {
    try { await fbLib.signOut(this.fb); }
    catch (e) { this.setUI("err", `Couldn't sign out (${e.message}).`, "Try again", () => this.signOut()); }
  },

  ref() {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "config", "streams");
  },

  async push() {
    if (this.mode !== "signed-in") return;
    const { f } = this.fb;
    try {
      await f.setDoc(this.ref(), { streams, updatedAt: f.serverTimestamp() });
    } catch (e) {
      this.setUI("err", `Couldn't save to sync (${e.code || e.message}). Saved on this device.`,
        "Retry", () => this.push());
    }
  },

  async pull() {
    const { f } = this.fb;
    try {
      let snap;
      try { snap = await f.getDocFromServer(this.ref()); }
      catch { snap = await f.getDoc(this.ref()); }
      streams = snap.exists() ? (snap.data().streams || []) : [];
      render();
      /* No "else push what this device is holding". That branch is what seeded a
         fresh account with the previous one's list. */
    } catch { /* offline — the local copy stands */ }
  },

  /* Pull again on every return to the page. The pull above otherwise runs
     once at sign-in and never again, so an edit made on another device stays
     invisible here until a reload — and a home-screen app rarely gets one.

     Never mid-rename and never with the add panel open: pull() calls render(),
     which would replace the open input and lose what was typed into it. */
  refresh() {
    if (this.mode !== "signed-in") return;
    if (editingId !== null || addGroup !== null) return;
    const now = Date.now();
    if (now - this.lastRefresh < 45000) return;
    this.lastRefresh = now;
    this.pull();
  }
};

render();
sync.init();
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) sync.refresh();
});
</script>
</body>
</html>
