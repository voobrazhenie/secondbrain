<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFD53D">
  <title>Exercise · Second Brain</title>

  <!-- Add to Home Screen. iOS ignores the manifest's name/display, so the
       apple-* metas below are what actually make it launch standalone.
       One manifest for the whole Second Brain, so moving between sections
       never falls back to Safari. -->
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Second Brain">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* Same neo-brutalist system as / and dailyplan/. Shared colors, strokes and
       shadows live in theme.css; only page-specific rules stay here.

       This page is deliberately phone-width: it is used one-handed, mid-set,
       and the set tiles need to stay under a thumb. Hence --maxw below rather
       than the 620px the reading-oriented pages use. */
    :root{--maxw:var(--page-width)}

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;background:var(--yellow);color:var(--ink);
      padding:
        calc(var(--page-top) + env(safe-area-inset-top)) calc(var(--page-side) + env(safe-area-inset-right))
        calc(var(--page-bottom) + env(safe-area-inset-bottom)) calc(var(--page-side) + env(safe-area-inset-left));
      font:15px/1.4 "Archivo","Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit;color:var(--ink)}
    a{color:var(--ink)}
    a:hover{color:var(--pink)}
    .wrap{max-width:var(--maxw);margin:0 auto}
    .blk{font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900;letter-spacing:-.01em}
    [hidden]{display:none!important}

    .syncchip{
      display:inline-flex;align-items:center;gap:5px;
      background:var(--card);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
      padding:3px 8px;font-family:"Arial Black",Impact,sans-serif;
      font-size:8.5px;font-weight:900;letter-spacing:.06em;
    }
    .syncchip i{width:7px;height:7px;border:1.5px solid var(--ink);background:var(--lime);display:inline-block}
    .syncchip.off i{background:var(--sunk)}
    .syncchip.err i{background:var(--pink)}

    .weekcard{
      background:var(--card);color:var(--ink);
      border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
      padding:10px 11px 11px;margin-bottom:13px;
    }
    .weekhead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
    .weekscore{
      flex:0 0 auto;width:34px;height:34px;border:2px solid var(--ink);background:var(--teal);
      display:flex;align-items:center;justify-content:center;
      font-family:"Arial Black",Impact,sans-serif;font-size:17px;line-height:1;
    }
    .weekcopy{flex:1;min-width:0;font-size:11px;font-weight:900;line-height:1.15}
    .weekcopy small{display:block;margin-top:2px;font-size:8px;letter-spacing:.06em;color:var(--faint);font-weight:800}
    .weekrange{font-family:"Arial Black",Impact,sans-serif;font-size:7.5px;letter-spacing:.05em;color:var(--faint)}
    .weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
    .weekday{
      min-width:0;height:38px;border:1.5px solid var(--ink);background:var(--card);
      display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:3px;
      font:inherit;color:var(--ink);padding:0;cursor:pointer;
    }
    .weekday b{font-family:"Arial Black",Impact,sans-serif;font-size:10px}
    .weekday span{font-size:7px;font-weight:900;color:var(--ink)}
    .weekday.done{background:var(--teal)}
    .weekday.missed{background:var(--pink)}
    .weekday.rest{background:var(--sunk);border-color:var(--faint)}
    .weekday.rest span,.weekday.rest b{color:var(--faint)}
    .weekday.future{border-style:dashed;background:var(--paper)}
    .weekday.future span,.weekday.future b{color:var(--faint)}
    .weekday.today{outline:2px solid var(--ink);outline-offset:1px;background:var(--yellow)}
    .weekday:active{transform:translate(1px,1px)}
    .weeklegend{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:7px;font-weight:900;letter-spacing:.03em;color:var(--faint)}
    .weeklegend .key{display:inline-flex;align-items:center;gap:4px}
    .weeklegend i{display:inline-block;width:7px;height:7px;border:1px solid var(--ink)}
    .weeklegend .trained{background:var(--teal)}
    .weeklegend .miss{background:var(--pink)}
    .weeklegend .rested{background:var(--sunk);border-color:var(--faint)}

    .daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .daynav button{
      flex:0 0 auto;min-width:44px;min-height:44px;padding:0;font-size:15px;line-height:1;
      background:var(--card);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
      font-family:"Arial Black",Impact,sans-serif;font-weight:900;cursor:pointer;
    }
    .daynav button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
    .daynav .lbl{
      flex:1;text-align:center;font-size:11px;letter-spacing:.05em;
      font-family:"Arial Black",Impact,sans-serif;
    }
    .daynav .lbl small{display:block;font-size:8.5px;color:var(--ink);letter-spacing:.06em;margin-top:2px;font-weight:800}

    .sec{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
    .sec .t{
      font-size:11px;font-weight:900;letter-spacing:.07em;
      background:var(--ink);color:var(--paper);padding:3px 8px;
      font-family:"Arial Black",Impact,sans-serif;
    }
    .sec .r{flex:1;height:2px;background:var(--ink)}
    .sec .n{font-size:9px;font-weight:900;color:var(--ink)}

    /* Bleeds past .wrap's own side padding to the true screen edge, so the
       sticky strip is one solid painted rect with no seam a scrolled card
       can ever peek through at the corners. */
    .timerwrap{position:sticky;top:0;z-index:20;background:var(--yellow);margin:0 -14px;padding:5px 14px 9px}
    .timer{
      background:var(--ink);color:var(--paper);
      border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
      padding:10px 11px 11px;
    }
    .timer.transition{background:var(--teal);color:var(--ink)}
    .timer.ready{background:var(--lime);color:var(--ink)}
    .timer-main{display:flex;align-items:center;gap:10px}
    .timer-copy{min-width:0;flex:1}
    .timer .k{
      font-family:"Arial Black",Impact,sans-serif;font-size:8px;letter-spacing:.1em;color:var(--paper);
    }
    .timer.transition .k,.timer.ready .k{color:var(--ink)}
    .timer .clock{
      font-family:"Arial Black","Archivo Black",Impact,sans-serif;
      font-size:30px;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums;
    }
    .timer .acts{display:flex;gap:6px;margin-left:auto}
    /* Same button as the day-nav arrows: card bg, ink border/shadow/text — one
       button style regardless of which color the timer card itself is in. */
    .timer button{min-height:44px;min-width:44px;font-size:9px;padding:7px 10px;box-shadow:2px 2px 0 var(--ink);background:var(--card);color:var(--ink);border:2px solid var(--ink);font-family:"Arial Black",Impact,sans-serif;font-weight:900;cursor:pointer}
    .timer button:active{transform:translate(2px,2px);box-shadow:none}
    .timer .sub{margin-top:7px;font-size:9.5px;font-weight:700;line-height:1.35;color:var(--paper)}
    .timer.transition .sub,.timer.ready .sub{color:var(--ink)}

    .exercise{
      background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
      padding:10px 11px 11px;margin-bottom:9px;
    }
    .exercise.priority{background:var(--teal)}
    .exercise.done{background:var(--sunk);box-shadow:2px 2px 0 var(--ink)}
    .exhead{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
    .exname{flex:1;min-width:0;font-size:14px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
    .exercise.done .exname{color:var(--faint)}
    .excount{
      flex:0 0 auto;font-size:9.5px;font-family:"Arial Black",Impact,sans-serif;
      border:2px solid var(--ink);padding:2px 6px;background:var(--card);line-height:1.3;
    }
    .exercise.done .excount{background:transparent;border-color:var(--faint);color:var(--faint)}
    .extarget{font-size:10px;font-weight:800;color:var(--grey);letter-spacing:.02em;margin-bottom:2px}
    .exercise.priority .extarget{color:var(--ink)}
    .exnote{font-size:9.5px;font-weight:600;color:var(--faint);line-height:1.4;margin-bottom:9px}
    .exercise.priority .exnote{color:var(--ink)}

    .results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .settile{
      display:flex;flex-direction:column;justify-content:space-between;gap:7px;
      width:100%;height:60px;padding:8px 9px 7px;
      background:var(--card);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
      font:inherit;text-align:left;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
    }
    .settile .toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
    .settile .setlabel{font-family:"Arial Black",Impact,sans-serif;font-size:7px;letter-spacing:.07em;color:var(--faint)}
    .settile .state{font-family:"Arial Black",Impact,sans-serif;font-size:6px;letter-spacing:.06em;color:var(--faint)}
    .settile .botrow{display:flex;align-items:baseline;gap:4px}
    .settile .repvalue{font-family:"Arial Black",Impact,sans-serif;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
    .settile .unit{font-family:"Arial Black",Impact,sans-serif;font-size:6.5px;letter-spacing:.05em;color:var(--faint)}
    .settile[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
    .settile[aria-pressed="true"] .setlabel,.settile[aria-pressed="true"] .unit{color:var(--paper)}
    .settile[aria-pressed="true"] .state{color:var(--lime)}
    .settile:active{transform:translate(2px,2px);box-shadow:none}
    .settile:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
    .settile:disabled{cursor:default;box-shadow:none;opacity:.75}
    .settile:disabled:active{transform:none}

    .editbar{
      display:grid;grid-template-columns:1fr 78px;align-items:end;gap:7px;
      margin-top:9px;padding:9px;background:var(--sunk);border:2px solid var(--ink);
    }
    .editbar label{display:block;font-family:"Arial Black",Impact,sans-serif;font-size:7px;letter-spacing:.06em}
    .editbar input{
      display:block;width:100%;height:44px;margin-top:5px;padding:0 10px;border:2px solid var(--ink);
      background:var(--card);font-family:"Arial Black",Impact,sans-serif;font-size:18px;-moz-appearance:textfield;
    }
    .editbar input::-webkit-inner-spin-button,.editbar input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .editbar button{height:44px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-family:"Arial Black",Impact,sans-serif;font-size:8px;letter-spacing:.05em;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
    .editbar button:active{transform:translate(2px,2px);box-shadow:none}

    .signoff{
      display:flex;align-items:center;gap:12px;width:100%;
      text-align:left;cursor:pointer;background:var(--card);
      border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
      padding:12px 11px;margin-top:14px;
    }
    .signoff:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
    .signoff[aria-pressed="true"]{background:var(--lime)}
    .signoff .box{
      flex:0 0 auto;width:40px;height:28px;border:2.5px solid var(--ink);background:var(--card);
      display:flex;align-items:center;justify-content:center;font-family:"Arial Black",Impact,sans-serif;
      font-size:7px;letter-spacing:.06em;
    }
    .signoff[aria-pressed="true"] .box{background:var(--ink);color:var(--paper)}
    .signoff .copy{flex:1;min-width:0}
    .signoff .copy b{display:block;font-size:16px;font-family:"Arial Black",Impact,sans-serif;letter-spacing:.02em}
    .signoff .copy span{display:block;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:3px;line-height:1.4}
    .signoff[aria-pressed="true"] .copy span{color:var(--ink)}
    /* Only while a sign-off is in flight — the button is not gated on the
       tally. Deliberately still legible rather than greyed to nothing. */
    .signoff:disabled{cursor:not-allowed;box-shadow:2px 2px 0 var(--ink);background:var(--sunk)}
    .signoff:disabled:active{transform:none}
    .signoff:disabled .copy b{color:var(--faint)}

    /* Panels: sign-in, loading, connection errors, and the read-only day
       states. Neutral card surface, so --faint is allowed here. */
    .panel{
      background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
      padding:14px 12px;margin-bottom:12px;
    }
    .panel.err{background:var(--pink)}
    .panel.err strong,.panel.err span{color:var(--ink)}
    .panel strong{display:block;font-family:"Arial Black",Impact,sans-serif;font-size:12px;letter-spacing:.04em}
    .panel span{display:block;font-size:11px;font-weight:600;line-height:1.45;color:var(--faint);margin-top:5px}
    .panel.err span{color:var(--ink)}
    .panel button{
      margin-top:10px;min-height:44px;padding:0 14px;background:var(--ink);color:var(--paper);
      border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
      font-family:"Arial Black",Impact,sans-serif;font-size:9px;letter-spacing:.05em;cursor:pointer;
    }
    .panel button:active{transform:translate(2px,2px);box-shadow:none}

    .restday{
      background:var(--teal);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
      padding:26px 14px;text-align:center;
      font-family:"Arial Black",Impact,sans-serif;font-size:19px;letter-spacing:.02em;color:var(--ink);
    }
    .restday small{display:block;margin-top:6px;font-size:9px;letter-spacing:.06em;color:var(--ink);font-weight:800}

    .banner{
      border:2px dashed var(--ink);background:var(--yellow);color:var(--ink);
      padding:8px 9px;margin-bottom:11px;
      font-family:"Arial Black",Impact,sans-serif;font-size:8.5px;letter-spacing:.05em;line-height:1.4;
    }

    .sync{
      display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0 0;
      padding:9px 11px;background:var(--card);
      border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
      font-size:12px;font-weight:700;color:var(--faint);
    }
    .sync .dot{flex:0 0 auto;width:9px;height:9px;border:2px solid var(--ink);background:var(--sunk)}
    .sync.on .dot{background:var(--lime)}
    .sync.err .dot{background:var(--pink)}
    .sync .msg{flex:1;min-width:120px}
    .sync button{
      min-height:34px;padding:0 11px;background:var(--ink);color:var(--paper);
      border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
      font-family:"Arial Black",Impact,sans-serif;font-size:8.5px;letter-spacing:.05em;cursor:pointer;
    }
    .sync button:active{transform:translate(2px,2px);box-shadow:none}

    footer{
      margin-top:16px;padding-top:10px;border-top:2px solid var(--ink);
      font-size:10px;font-weight:700;color:var(--ink);line-height:1.55;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="crumb" href="../">SECOND BRAIN</a>
      <span class="crumb here">EXERCISE</span>
      <span class="grow"></span>
      <span class="syncchip off" id="chip"><i></i><span id="chipText">CHECKING</span></span>
    </header>

    <div id="content" aria-live="polite">
      <div class="panel"><strong>Checking sign-in</strong><span>Exercises stay hidden until Firebase authentication resolves.</span></div>
    </div>

    <div class="sync" id="sync">
      <span class="dot"></span>
      <span class="msg" id="syncMsg">Checking sign-in…</span>
      <button type="button" id="authBtn" hidden>Sign in</button>
    </div>

    <footer id="footer" hidden>Tap a set to complete it. Hold a set to edit repetitions. The timer stays on this device and continues while the screen is open.</footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
