<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffde59">
  <title>Exercise · Second Brain</title>
  <style>
    :root{--ink:#151515;--paper:#fffdf7;--yellow:#ffde59;--pink:#ff8fab;--lime:#b8f34a;--blue:#8dd8ff;--grey:#6b6b6b;--line:3px}
    *{box-sizing:border-box}
    body{margin:0;background:#ece9df;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{border:var(--line) solid var(--ink);background:var(--paper);color:var(--ink);font-weight:900;padding:10px 12px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
    button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
    button:disabled{cursor:not-allowed;opacity:.5;transform:none;box-shadow:3px 3px 0 var(--ink)}
    .primary{background:var(--yellow)}
    .wrap{width:min(760px,100%);min-height:100vh;margin:auto;background:var(--paper);padding:18px clamp(14px,4vw,30px) 48px}
    .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .home{color:var(--ink);font-size:12px;font-weight:950;letter-spacing:.08em;text-decoration:none}
    .grow{flex:1}
    h1{font-size:clamp(34px,8vw,58px);line-height:.95;margin:10px 0 8px;letter-spacing:-.045em;text-transform:uppercase}
    .lede{margin:0 0 22px;color:var(--grey);font-size:14px;font-weight:700;line-height:1.45}
    .date-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;margin:20px 0}
    .date-nav button:last-child{justify-self:stretch}
    .date-center{text-align:center;min-width:180px}
    .date-center strong{display:block;font-size:15px;text-transform:uppercase}
    .date-center small{display:block;color:var(--grey);font-weight:800;margin-top:3px}
    #todayBtn{display:block;margin:8px auto 0;padding:6px 10px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
    .panel,.state,.exercise{border:var(--line) solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:white}
    .panel,.state{padding:18px;margin:18px 0}
    .state h2{font-size:20px;margin:0 0 6px;text-transform:uppercase}
    .state p{margin:0;color:var(--grey);font-weight:700;line-height:1.45}
    .auth-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .auth-copy{flex:1;min-width:210px}
    .auth-copy strong{display:block;text-transform:uppercase}
    .auth-copy span{display:block;color:var(--grey);font-size:12px;font-weight:700;margin-top:4px}
    .week{display:flex;justify-content:space-between;gap:6px;margin:14px 0 22px}
    .week-day{flex:1;text-align:center;border:2px solid var(--ink);padding:7px 2px;background:#fff;font-size:10px;font-weight:950;text-transform:uppercase}
    .week-day.selected{background:var(--blue)}
    .week-day.done{background:var(--lime)}
    .week-day.missed{background:var(--pink)}
    .week-day.planned{border-style:dashed}
    .week-day b{display:block;font-size:13px;margin-top:2px}
    .rest-day{border:var(--line) solid var(--ink);background:var(--blue);box-shadow:5px 5px 0 var(--ink);padding:28px 18px;text-align:center;font-size:23px;font-weight:950;text-transform:uppercase}
    .routine{display:grid;gap:14px}
    .exercise{padding:16px}
    .exercise-head{display:flex;align-items:start;gap:12px}
    .exercise-title{flex:1}
    .exercise-title h3{margin:0;font-size:18px}
    .exercise-title p{margin:4px 0 0;color:var(--grey);font-size:12px;font-weight:750}
    .badge{border:2px solid var(--ink);background:var(--yellow);padding:4px 7px;font-size:10px;font-weight:950;text-transform:uppercase}
    .sets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
    .set label{display:block;font-size:10px;font-weight:950;text-transform:uppercase;margin-bottom:4px}
    .set input,.set-value{width:100%;min-height:45px;border:2px solid var(--ink);background:var(--paper);padding:8px;text-align:center;font-weight:900}
    .set-value{display:grid;place-items:center}
    .exercise-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px}
    .exercise-actions label{font-size:12px;font-weight:850}
    .exercise-actions input{width:20px;height:20px;vertical-align:middle}
    .save-status{min-height:18px;margin-top:8px;color:var(--grey);font-size:11px;font-weight:800}
    .done-wrap{margin-top:20px;border:var(--line) solid var(--ink);background:var(--lime);padding:16px;box-shadow:5px 5px 0 var(--ink)}
    .done-wrap button{width:100%;font-size:17px;background:var(--yellow)}
    .done-wrap p{font-size:11px;font-weight:750;margin:9px 0 0;text-align:center}
    .planned-banner{border:2px dashed var(--ink);padding:9px;background:var(--yellow);font-size:11px;font-weight:950;text-transform:uppercase;margin-bottom:14px}
    .error{background:var(--pink)}
    [hidden]{display:none!important}
    @media(max-width:520px){.date-nav{grid-template-columns:auto 1fr auto}.date-nav button{font-size:0}.date-nav button:first-child::after{content:"←";font-size:18px}.date-nav button:last-child::after{content:"→";font-size:18px}.date-center{min-width:0}.sets{gap:6px}.wrap{padding-top:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="home" href="../">‹ SECOND BRAIN</a>
      <span class="grow"></span>
      <button id="authBtn" hidden>Sign in</button>
    </div>
    <h1>Workout<br>session</h1>
    <p class="lede">One equipment-free routine, up to three completed workout sessions per Monday–Sunday week.</p>

    <nav class="date-nav" aria-label="Workout date">
      <button id="previousBtn" type="button">Previous day</button>
      <div class="date-center">
        <strong id="selectedLabel">Loading…</strong>
        <small id="selectedDate"></small>
        <button id="todayBtn" type="button" hidden>Today</button>
      </div>
      <button id="nextBtn" type="button">Next day</button>
    </nav>

    <div id="content" aria-live="polite">
      <div class="panel">Checking sign-in…</div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
