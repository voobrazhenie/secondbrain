<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scrollable but not zoomable: pinch-zoom off, and inputs are 16px+ below so
     iOS doesn't zoom the page when a field takes focus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFD53D">
<title>DailyPlan</title>

<!-- Add to Home Screen. iOS ignores the manifest's name/display, so the
     apple-* tags below are what actually make it open without Safari chrome. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyPlan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="../theme.css">
<style>
  /* Neo-brutalist character sheet — thick strokes, squared corners, solid accent
     blocks, hard zero-blur shadows. Light on paper rather than the old dark UI.
     Shared colors/spacing live in theme.css; --maxw is page-specific. */
  :root{ --maxw:var(--page-width); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--yellow); color:var(--ink);
    padding:
      calc(var(--page-top) + env(safe-area-inset-top)) calc(var(--page-side) + env(safe-area-inset-right))
      calc(var(--page-bottom) + env(safe-area-inset-bottom)) calc(var(--page-side) + env(safe-area-inset-left));
    font:15px/1.4 "Archivo","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto}
  .blk{font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900;letter-spacing:-.01em}

  /* ---------- header ---------- */
  .streak{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--yellow);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    padding:3px 9px;font-family:"Arial Black",Impact,sans-serif;
    font-size:8.5px;font-weight:900;letter-spacing:.06em;
  }
  .streak b{font-size:12px}
  .streak.cold{background:var(--sunk);color:var(--grey)}

  /* ---------- day counter ----------
     One tracked thing, one row: a square holding the number, the unit, the name.
     Built to take more of these later (screen time, habits to build) — nothing
     in it is weed-specific. Same box metrics as a checklist .row on purpose, so
     it sits in the page rather than shouting over it. */
  .counter{
    display:flex;align-items:center;gap:11px;
    background:var(--card);color:var(--ink);
    border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    padding:9px 11px;min-height:56px;margin-bottom:14px;
  }
  /* Filled while the count is running, empty at zero — the same shape as a box
     you haven't ticked. No red: a bad day gets the colour drained out, not a
     telling-off. */
  .counter .sq{
    flex:0 0 auto;width:36px;height:36px;
    border:var(--stroke) solid var(--ink);background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-family:"Arial Black",Impact,sans-serif;font-weight:900;font-size:17px;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    transition:background-color .2s linear;
  }
  .counter .sq.on{background:var(--lime)}
  .counter .sq.d3{font-size:13px;letter-spacing:-.04em}
  .counter .unit{
    flex:0 0 auto;font-family:"Arial Black",Impact,sans-serif;
    font-size:9px;letter-spacing:.07em;color:var(--grey);
  }
  .counter .nm{flex:1;min-width:0;font-size:13px;font-weight:900;line-height:1.15}
  @media (prefers-reduced-motion: reduce){ .counter .sq{transition:none} }

  /* ---------- day switcher ---------- */
  .daynav{
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .daynav button{
    flex:0 0 auto;padding:7px 12px;font-size:13px;line-height:1;
    box-shadow:3px 3px 0 var(--ink);
  }
  .daynav .lbl{
    flex:1;text-align:center;font-size:11px;letter-spacing:.05em;
    font-family:"Arial Black",Impact,sans-serif;
  }
  .daynav .lbl small{display:block;font-size:8.5px;color:var(--grey);letter-spacing:.06em;margin-top:2px}
  .daynav button[hidden]{display:none}

  /* ---------- list ---------- */
  .sec{display:flex;align-items:center;gap:8px;margin:16px 0 7px;cursor:pointer;user-select:none}
  .sec:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .sec .chev{flex:0 0 auto;font-size:9px;color:var(--grey)}
  .sec.collapsed .chev{color:var(--faint)}
  .sec .t{font-size:11px;font-weight:900;letter-spacing:.07em;
    background:var(--ink);color:var(--paper);padding:3px 8px;
    font-family:"Arial Black",Impact,sans-serif}
  .sec.collapsed .t{background:var(--faint)}
  .sec .r{flex:1;height:2px;background:var(--ink)}
  .sec.collapsed .r{background:var(--faint)}
  .sec .n{font-size:9px;font-weight:900;color:var(--grey)}

  .row{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    padding:0 11px;min-height:44px;
    margin-bottom:9px;cursor:pointer;
    /* No press effect. A row is a line on a list, not a button, and the tick
       arriving is the answer to a tap. The transition is for the swipe. */
    transition:transform .16s ease-out, background .15s;
  }
  .row.done{background:var(--sunk)}
  .row input{position:absolute;opacity:0;pointer-events:none}
  .box{
    flex:0 0 auto;width:20px;height:20px;border:2.5px solid var(--ink);background:var(--card);
    display:flex;align-items:center;justify-content:center;
  }
  .row.done .box{background:var(--ink)}
  .box svg{width:12px;height:12px;opacity:0}
  .row.done .box svg{opacity:1}
  .emoji{flex:0 0 auto;font-size:14px;line-height:1}
  .txt{flex:1;min-width:0;font-size:13px;font-weight:700}
  .row.done .txt{color:var(--grey);text-decoration:line-through}
  /* Only a held-open row shows its detail line now. The Notes button that used
     to reveal every one of them is gone: it was a control nobody reached for,
     and the day reads better without a paragraph under each task. */
  .detail{display:none;font-size:10.5px;font-weight:600;color:var(--grey);margin-top:3px;line-height:1.35}
  .pill{
    flex:0 0 auto;font-size:10px;font-weight:900;font-family:"Arial Black",Impact,sans-serif;
    background:var(--pink);color:var(--ink);border:2px solid var(--ink);padding:2px 6px;
  }
  .row.done .pill{background:transparent;border-color:var(--faint);color:var(--faint)}
  .pill.cost{background:var(--ink);color:var(--paper)}
  /* How long a task has been carried. Sits next to the text, not in the pill
     column, because it is about the task rather than the day's score. */
  .carry{display:inline-block;margin-left:7px;font-size:9px;font-weight:900;
    letter-spacing:.06em;border:2px solid var(--ink);padding:0 4px;vertical-align:2px}
  .row.done .carry{border-color:var(--faint);color:var(--faint)}
  .row.done .pill.cost{background:transparent;border-color:var(--faint);color:var(--faint)}

  /* Owned by another page — it shows state, it doesn't take input. Its note
     is always visible, notes mode or not: without it the row just looks like
     a checkbox that won't tick. */
  .row.locked .detail{display:block}
  .row.locked{cursor:default;padding-top:9px;padding-bottom:9px}
  .row.locked .box{border-style:dashed;border-width:2px}
  .row.locked.done .box{border-style:solid}

  /* ---------- the auth gate ----------
     Everything personal is hidden unless Firebase has confirmed an account.
     The attribute ships as "checking" in the markup rather than being set by
     script, so a cached page cannot flash yesterday's list in the moment
     before the SDK loads. What stays visible in every state is the top bar,
     the sync row — which carries the sign-in button — and the footer. */
  #wrap:not([data-auth="in"]) .counter,
  #wrap:not([data-auth="in"]) .daynav,
  #wrap:not([data-auth="in"]) #priorityWrap,
  #wrap:not([data-auth="in"]) #level,
  #wrap:not([data-auth="in"]) #list,
  #wrap:not([data-auth="in"]) #streak{ display:none }

  /* ---------- sync + actions ---------- */
  /* Which of these a person gets is set per account in admin/. Display only:
     the points are still counted and the streak still recorded, they are just
     not drawn — so switching one back on shows the real number rather than
     starting again from zero. */
  body.no-xp .pill,
  body.no-xp .level{ display:none!important }
  body.no-priority .priority-wrap{ display:none!important }
  /* Both of them: the block of counters, and the days-in-a-row chip in the top
     bar. A switch called Streaks that leaves a streak on screen is worse than
     either answer on its own. */
  body.no-streaks .streaks,
  body.no-streaks .streak{ display:none!important }

  .sync{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0;
    padding:9px 11px;background:var(--card);
    border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    font-size:12px;font-weight:700;color:var(--grey);
  }
  .sync .dot{flex:0 0 auto;width:9px;height:9px;border:2px solid var(--ink);background:var(--sunk)}
  .sync.on .dot{background:var(--lime)}
  .sync.err .dot{background:var(--pink)}
  .sync .msg{flex:1;min-width:120px}

  button{
    font:inherit;font-size:11px;font-weight:900;letter-spacing:.05em;cursor:pointer;
    font-family:"Arial Black",Impact,sans-serif;
    padding:9px 13px;background:var(--card);color:var(--ink);
    border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    transition:transform .07s, box-shadow .07s;
  }
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  button.primary{background:var(--yellow)}
  button.on{background:var(--teal)}
  button:disabled{opacity:.5;cursor:default;transform:none}

  /* ---------- add / edit / remove ---------- */
  .sec .add{
    flex:0 0 auto;padding:2px 8px;font-size:13px;line-height:1.1;
    background:var(--card);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
    font-family:"Arial Black",Impact,sans-serif;cursor:pointer;
  }
  .sec .add:active{transform:translate(2px,2px);box-shadow:none}

  /* Swipe left and a Delete button is waiting underneath, the same as
     Opportunities: the row slides off it and stays there until the button is
     tapped or the row is tapped shut. Nothing is destroyed by the swipe itself,
     which is what a swipe that deletes at a threshold gets wrong — the point of
     no return lands halfway through a gesture rather than on a button.

     The border and shadow move from the row to the clip around it, because the
     row is the part that slides and they have to stay put. */
  .rowwrap{position:relative;margin-bottom:9px}
  .rowclip{position:relative;overflow:hidden;
    border:var(--stroke) solid var(--ink);box-shadow:var(--shadow)}
  .rowclip:has(.row.done){box-shadow:2px 2px 0 var(--ink)}
  .rowclip .row{position:relative;margin-bottom:0;border:0;box-shadow:none;touch-action:pan-y}
  .tray{position:absolute;top:0;right:0;bottom:0;width:96px;display:flex}
  .tray button{
    flex:1;border:0;box-shadow:none;background:var(--pink);color:var(--ink);
    font-size:10px;font-weight:900;letter-spacing:.03em;
    font-family:"Arial Black",Impact,sans-serif;cursor:pointer;
  }
  .tray button:active{transform:none;box-shadow:none}

  /* desktop affordance — hidden on touch, where the gestures do the work */
  .rowbtns{position:absolute;top:50%;right:8px;transform:translateY(-50%);
    display:none;gap:5px;z-index:2}
  @media (hover:hover){ .rowwrap:not(.revealed):hover .rowbtns{display:flex} }
  .rowbtns button{padding:2px 7px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}

  /* ---------- modal ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(17,17,17,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .scrim[hidden]{display:none}
  .modal{
    width:100%;max-width:400px;background:var(--card);
    border:var(--stroke) solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px;
  }
  .modal h3{margin:0 0 12px;font-size:14px;letter-spacing:.05em;
    font-family:"Arial Black",Impact,sans-serif}
  .modal label{display:block;font-size:9px;letter-spacing:.08em;color:var(--grey);
    font-family:"Arial Black",Impact,sans-serif;margin:10px 0 4px}
  /* 16px minimum — anything smaller makes iOS zoom the page on focus. */
  .modal input,.modal select{
    width:100%;font:inherit;font-size:16px;font-weight:700;padding:9px 10px;
    background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  }
  /* Icon and XP hold four characters and two digits. Sized for what goes in
     them rather than stretched to fill the row, so the form reads the same
     whether or not the account has points switched on — with XP hidden, the
     icon field stays put instead of growing across the dialog. */
  .modal .rowpair{display:flex;gap:9px}
  .modal .rowpair>div.small{flex:0 0 104px;min-width:0}
  .modal .acts{display:flex;gap:9px;margin-top:16px}
  .modal .acts button{flex:1}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;z-index:60;
    background:var(--ink);color:var(--paper);
    /* Fixed shadow color, not --grey: this box's fill is --ink, so once --grey
       became black too the shadow would match the card and vanish. */
    border:2px solid var(--ink);box-shadow:4px 4px 0 #7A756A;
    padding:10px 12px;font-size:12px;font-weight:700;max-width:92vw;
  }
  .toast[hidden]{display:none}
  .toast button{
    padding:5px 10px;font-size:10px;background:var(--yellow);color:var(--ink);
    border:2px solid var(--paper);box-shadow:none;
  }

  /* ---------- priority ----------
     The muted tones are the pink's own dark end, picked to sit on it at the
     same contrast the teal card's darker text used to hold. */
  /* Same swipe-to-delete and long-press-to-edit as a task row, so the card
     answers the finger the way everything else on this page does. The backdrop
     cannot be the rows' pink here — the card sliding off it is pink — so its
     Delete goes black instead. */
  .priority-wrap{position:relative;margin:0 0 16px}
  .priority-wrap[hidden]{display:none}
  /* The card is pink, so its Delete cannot be — it goes black instead, which is
     the same treatment Opportunities gives its second tray button. */
  .priority-wrap .tray button{background:var(--ink);color:var(--paper)}
  .priority-wrap .priority{border:0;box-shadow:none}

  /* desktop affordance — hidden on touch, where the gestures do the work */
  .priority-btns{position:absolute;top:9px;right:10px;display:none;gap:5px;z-index:2}
  @media (hover:hover){ .priority-wrap:not(.revealed):hover .priority-btns{display:flex} }
  .priority-btns button{
    padding:2px 7px;font-size:11px;background:var(--card);
    box-shadow:2px 2px 0 var(--ink);
  }
  .priority-btns[hidden]{display:none}

  .priority{
    position:relative;background:var(--pink);
    border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    padding:13px 14px 13px;margin:0;touch-action:pan-y;
    transition:transform .16s ease-out;
  }
  .priority .k{
    font-size:8px;letter-spacing:.1em;font-family:"Arial Black",Impact,sans-serif;
  }
  .priority .value{
    font-size:20px;line-height:1.12;margin:3px 0 0;overflow-wrap:anywhere;
    font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900;
  }
  /* The next action is a second line under the priority, not a panel of its
     own — it is the smaller half of the pair and should read that way. Close
     enough under it to belong to it rather than to sit on its own. */
  .priority .next{
    font-size:13px;line-height:1.25;font-weight:900;color:var(--ink);
    margin:2px 0 0;overflow-wrap:anywhere;
  }
  .priority .acts{display:flex;gap:9px;flex-wrap:wrap}
  .priority .acts button{flex:1;min-width:120px;background:var(--card)}
  .priority .acts button.primary{background:var(--yellow)}
  /* Nothing stands between the label and the button once the day has no
     priority on it, so the gap the prompt used to hold is set here instead. */
  #priorityEmpty .acts{margin-top:10px}
  .priority label{
    display:block;font-size:9px;letter-spacing:.08em;margin:10px 0 4px;
    font-family:"Arial Black",Impact,sans-serif;
  }
  /* The first label is the top of the card now, so it sits on the padding. */
  .priority label:first-child{margin-top:0}
  /* One shared line-height so a one-row textarea and the input below it are
     the same height rather than nearly the same. */
  .priority textarea,.priority input{
    display:block;width:100%;font:inherit;font-size:16px;line-height:1.25;
    font-weight:700;padding:9px 10px;background:var(--card);color:var(--ink);
    border:2px solid var(--ink);
  }
  .priority textarea{min-height:0;resize:vertical}
  .priority .error{min-height:1.2em;margin-top:6px;font-size:11px;font-weight:900;color:#3D0016}

  /* ---------- level ---------- */
  .level{
    background:var(--card);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow);
    padding:12px 14px 13px;margin:0 0 16px;
  }
  .level[hidden]{display:none}
  .lv-top{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
  .lv-num{
    font-family:"Arial Black","Archivo Black",Impact,sans-serif;font-weight:900;
    font-size:30px;line-height:1;font-variant-numeric:tabular-nums;
  }
  .lv-num::before{
    content:"LV ";font-size:11px;color:var(--faint);letter-spacing:.06em;
  }
  .lv-today{
    margin-left:auto;font-size:9.5px;letter-spacing:.05em;font-weight:900;
    font-family:"Arial Black",Impact,sans-serif;font-variant-numeric:tabular-nums;
    background:var(--yellow);border:2px solid var(--ink);padding:3px 7px;
  }
  .lv-today.cost{background:var(--ink);color:var(--paper)}
  .lv-today.zero{background:var(--sunk);color:var(--grey)}
  .lv-bar{background:var(--sunk);border:2px solid var(--ink);height:15px;padding:2px}
  .lv-fill{
    height:100%;background:var(--lime);width:0%;
    transition:width .45s cubic-bezier(.2,.7,.3,1);
  }
  .lv-cap{
    margin-top:6px;font-size:9.5px;letter-spacing:.04em;font-weight:800;color:var(--grey);
    font-family:"Arial Black",Impact,sans-serif;font-variant-numeric:tabular-nums;
  }
  @media (prefers-reduced-motion: reduce){ .lv-fill{transition:none} }

</style>
</head>
<body>
<div class="wrap" id="wrap" data-auth="checking">

  <header class="topbar">
    <a class="crumb" href="../">SECOND BRAIN</a>
    <span class="crumb here">DAILYPLAN</span>
    <span class="grow"></span>
    <span class="streak" id="streak"><b id="streakN">0</b><span id="streakLbl">days</span></span>
  </header>

  <!-- One streak today, more later, so the block is named for the idea rather
       than for the habit that happens to be in it. -->
  <section class="streaks" id="streaks" aria-label="Streaks">
    <div class="counter" id="counter" hidden>
      <span class="sq" id="counterN">0</span>
      <span class="unit">DAYS</span>
      <span class="nm">No weed</span>
    </div>
  </section>

  <div class="daynav">
    <button id="dayPrev" title="Previous day">‹</button>
    <span class="lbl" id="dayLbl">TODAY<small></small></span>
    <button id="dayToday" hidden>TODAY</button>
    <button id="dayNext" title="Next day">›</button>
  </div>

  <div class="priority-wrap" id="priorityWrap" hidden>
    <div class="rowclip">
      <div class="tray"><button type="button" id="prioritySwipeDelete">DELETE</button></div>
    <section class="priority" id="priority" aria-label="Priority">
      <div id="priorityEmpty" hidden>
        <div class="k">PRIORITY</div>
        <div class="acts">
          <button class="primary" id="prioritySet">SET PRIORITY</button>
        </div>
      </div>

      <div id="priorityEdit" hidden>
        <!-- No card label here: the field's own label already says PRIORITY, and
             the two sat on top of each other once the prompt between them went. -->
        <label for="priorityText">PRIORITY</label>
        <textarea id="priorityText" rows="1" maxlength="180" placeholder="What matters most today?"></textarea>
        <label for="priorityNext">NEXT ACTION <span aria-hidden="true">—</span> OPTIONAL</label>
        <input id="priorityNext" type="text" maxlength="140" placeholder="One concrete move">
        <div class="error" id="priorityError" role="status" aria-live="polite"></div>
        <div class="acts">
          <button id="priorityCancel">CANCEL</button>
          <button class="primary" id="prioritySave">SAVE</button>
        </div>
      </div>

      <div id="prioritySaved" hidden>
        <div class="k">TODAY'S PRIORITY</div>
        <div class="value" id="priorityValue"></div>
        <div class="next" id="priorityNextSaved" hidden><span id="priorityNextValue"></span></div>
      </div>
    </section>
    </div>

    <div class="priority-btns" id="priorityBtns">
      <button id="priorityEditBtn" title="Edit">✎</button>
      <button id="priorityDeleteBtn" title="Remove">✕</button>
    </div>
  </div>

  <section class="level" id="level" aria-label="Level" hidden>
    <div class="lv-top">
      <span class="lv-num" id="lvNum">1</span>
      <span class="lv-today" id="lvToday"></span>
    </div>
    <div class="lv-bar"><div class="lv-fill" id="lvFill"></div></div>
    <div class="lv-cap" id="lvCap"></div>
  </section>

  <main id="list"></main>

  <div class="sync" id="sync">
    <span class="dot"></span>
    <span class="msg" id="syncMsg">Checking sync…</span>
    <button id="authBtn" hidden></button>
  </div>

</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal">
    <h3 id="mTitle">ADD TASK</h3>
    <label for="mText">TASK</label>
    <input id="mText" type="text" maxlength="70" placeholder="e.g. 10 min walk">
    <div class="rowpair">
      <div class="small">
        <label for="mEmoji">ICON</label>
        <input id="mEmoji" type="text" maxlength="4" placeholder="✅">
      </div>
      <div class="small" id="mXpWrap">
        <label for="mXp">XP</label>
        <input id="mXp" type="number" min="0" max="99" step="5" value="10">
      </div>
    </div>
    <div id="mScopeWrap">
      <label for="mScope">HOW OFTEN</label>
      <select id="mScope">
        <option value="today">Just today</option>
        <option value="daily">Routine — every day</option>
        <option value="carry">Until it's done</option>
      </select>
    </div>
    <div class="acts">
      <button id="mCancel">CANCEL</button>
      <button class="primary" id="mSave">SAVE</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastMsg"></span>
  <button id="toastUndo">UNDO</button>
</div>

<script>
"use strict";

/* Keys this page used to write. Nothing reads them any more — they are listed
   so a device that ran the old version can be cleaned of them once. */
const LEGACY_KEYS = [
  "secondbrain.dailyplan.",         // ticks, day meta, the migration flag
  "secondbrain.daily.priority.",
  "secondbrain.fitness.notes",
  "secondbrain.fitness.collapsed",
  "secondbrain.fitness.xpmonth.",
  "secondbrain.fitness.xppeak",
  "secondbrain.fitness.custom",
  "secondbrain.fitness.v1.",
  "secondbrain.fitness.meta.",
  "lifeinterface.fitness."
];
/* Nothing about a day, a task or an account is kept on the device any more —
   see the note on `mem` below. This clears what earlier versions left behind,
   because it is exactly the data that was showing up under the wrong account. */
(function wipeLegacyStorage() {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    for (const key of keys) {
      if (key && LEGACY_KEYS.some(prefix => key.startsWith(prefix))) localStorage.removeItem(key);
    }
  } catch { /* storage disabled — there is nothing to clear */ }
})();
const HISTORY_DAYS = 90;
const RING_C     = 2 * Math.PI * 33;   // matches r=33 in the svg
const $ = id => document.getElementById(id);

/* ?date=YYYY-MM-DD opens a specific DailyPlan date for review. */
const DEV_DATE = new URLSearchParams(location.search).get("date");

let viewDate = null;  // the day being looked at; null means today
/* The routine, once the account has been read. Until then, and for an account
   that has not written one yet, it is empty: this page shows what its owner put
   in it and nothing else. Workout configuration is separate. */
const TODO_GROUP = "To do";
/* Every routine has a To do category, whatever else is in it. It is where a new
   task goes when nobody has said where, and a page that opens with nowhere to
   put anything is a dead end. `keepEmpty` is what stops it disappearing on the
   days it holds nothing. */
const todoGroup = () => ({ title: TODO_GROUP, emoji: "\u{1F4CB}", keepEmpty: true, items: [] });
const withTodo = daily => (daily || []).some(g => g && g.title === TODO_GROUP)
  ? daily
  : [todoGroup(), ...(daily || [])];
const emptyPlan = () => ({
  schemaVersion: 1, startDate: todayISO(), principles: null,
  daily: [todoGroup()], oneOffs: null
});
let dailyConfig = emptyPlan();
let plan    = null;   // today, derived from it
/* ---------- what this page knows, while it is open ----------
   Everything below used to be mirrored into localStorage, and that is what let
   one account's day, XP and task list show up — and then upload themselves —
   under the next account to sign in on the same browser. There is no second
   copy now: Firestore holds it, this holds it while the page is open, and
   teardown() empties it on sign-out.

   Working offline still works. Firebase keeps its own cache on the device, and
   that one is filed under the document path, so it can never be handed to
   another account. */
const mem = {
  ticks: new Map(),     // YYYY-MM-DD -> { itemId: true }
  meta: new Map(),      // YYYY-MM-DD -> { xpEarned }
  priority: new Map(),  // YYYY-MM-DD -> priority record
  xpMonth: new Map(),   // YYYY-MM -> total
  peak: 0
};

/* date -> { xpEarned, ticked } for days other than today. Today is always
   computed live from the current tick state instead. */
const history = new Map();

/* Live references into the rendered list, so ticking updates the affected row in
   place. Rebuilding the whole list on every tap invalidated the checkbox the user
   was still interacting with and killed the row transitions. */
const rowEls = new Map();   // item id -> <label class="row">
const secEls = new Map();   // group title -> count <span>
let lastRendered = null;    // JSON of the ticks the list was last built from

/* ---------- dates: always local, never UTC ---------- */
function localISO(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function prettyDate(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString(undefined,
    { weekday:"long", day:"numeric", month:"long", year:"numeric" });
}
function daysBetween(a, b) {
  const [ay,am,ad] = a.split("-").map(Number);
  const [by,bm,bd] = b.split("-").map(Number);
  return Math.round((Date.UTC(by,bm-1,bd) - Date.UTC(ay,am-1,ad)) / 86400000);
}
function shiftDate(iso, delta) {
  const [y,m,d] = iso.split("-").map(Number);
  return localISO(new Date(y, m-1, d + delta));
}
function todayISO() { return DEV_DATE || localISO(); }

/* ---------- priority ----------
   One date-scoped, user-written priority. It is intentionally separate from
   tasks and XP.

   `status` carries which of two things the day holds: a priority that was
   written, or a card that was swiped away. "dismissed" is what the swipe
   stores — the card is gone for that date and comes back tomorrow, which is
   why it is a record rather than the absence of one. */
let priorityEditDate = null;

function normalisePriority(value) {
  if (!value) return null;
  const updatedAt = typeof value.updatedAt === "string" ? value.updatedAt : new Date().toISOString();
  if (value.status === "dismissed") return { status:"dismissed", text:"", nextAction:"", updatedAt };
  if (value.status !== "set") return null;
  const text = typeof value.text === "string" ? value.text.trim().slice(0, 180) : "";
  if (!text) return null;
  return {
    status:"set",
    text,
    nextAction:typeof value.nextAction === "string" ? value.nextAction.trim().slice(0, 140) : "",
    updatedAt
  };
}

function loadPriority(date) {
  return normalisePriority(mem.priority.get(date) ?? null);
}

function savePriorityLocal(date, record) {
  mem.priority.set(date, record);
}

function showPriorityState(id) {
  for (const state of ["priorityEmpty","priorityEdit","prioritySaved"]) {
    $(state).hidden = state !== id;
  }
  // The hover buttons are the desktop stand-in for the two gestures, so they
  // are only there in the states the gestures are.
  $("priorityBtns").hidden = id === "priorityEdit";
}

function renderPriority() {
  if (!plan) return;
  const date = plan.date;
  const wrap = $("priorityWrap");
  // Redrawing the card puts its Delete away.
  if (revealed && revealed.id === "priority") revealed = null;
  wrap.classList.remove("revealed");
  $("priority").style.transform = "";

  if (priorityEditDate === date) {
    wrap.hidden = false;
    showPriorityState("priorityEdit");
    return;
  }
  if (priorityEditDate && priorityEditDate !== date) priorityEditDate = null;

  const record = loadPriority(date);
  wrap.hidden = record?.status === "dismissed";
  if (wrap.hidden) return;

  if (!record) {
    showPriorityState("priorityEmpty");
    return;
  }

  $("priorityValue").textContent = record.text;
  $("priorityNextValue").textContent = record.nextAction;
  $("priorityNextSaved").hidden = !record.nextAction;
  showPriorityState("prioritySaved");
}

function startPriorityEdit() {
  const date = plan.date;
  const record = loadPriority(date);
  priorityEditDate = date;
  $("priorityText").value = record?.text || "";
  $("priorityNext").value = record?.nextAction || "";
  $("priorityError").textContent = "";
  showPriorityState("priorityEdit");
  $("priorityText").focus();
}

function cancelPriorityEdit() {
  priorityEditDate = null;
  $("priorityError").textContent = "";
  renderPriority();
}

function storePriority(record, date = plan.date) {
  savePriorityLocal(date, record);
  priorityEditDate = null;
  renderPriority();
  sync.pushPriority(date, record);
}

/* Back to a day that never had one, which is not the same as a dismissal: the
   stored record has to go rather than be replaced, on the server too. */
function clearPriority(date) {
  mem.priority.delete(date);
  priorityEditDate = null;
  renderPriority();
  sync.dropPriority(date);
}

/* The swipe. It takes the card off the day whether or not something was
   written on it, and the toast is the way back — after that it returns
   tomorrow, like every other date-scoped thing here. */
function deletePriority() {
  const date = plan.date;
  const before = loadPriority(date);
  if (before?.status === "dismissed") return;
  storePriority({ status:"dismissed", text:"", nextAction:"", updatedAt:new Date().toISOString() });
  showToast(before ? "Priority removed" : "Priority hidden for today", () => {
    // The day nav may have moved on while the toast was up, so the undo is
    // aimed at the date it came from rather than whatever is on screen.
    if (before) storePriority(before, date); else clearPriority(date);
  });
}

function savePriorityForm() {
  const text = $("priorityText").value.trim();
  if (!text) {
    $("priorityError").textContent = "Write a priority before saving.";
    $("priorityText").focus();
    return;
  }
  storePriority({
    status:"set",
    text:text.slice(0, 180),
    nextAction:$("priorityNext").value.trim().slice(0, 140),
    updatedAt:new Date().toISOString()
  });
}

/* ---------- tick storage ---------- */
function loadTicks(date) {
  return mem.ticks.get(date) || {};
}
function saveTicks(date, ticks) {
  mem.ticks.set(date, ticks);
}
/* The days this page is holding — in practice the one in view, since the rest
   come back from Firestore as `history`. Both are still scanned wherever a
   question spans days, because the day being ticked right now is only here. */
function storedDates() {
  return [...mem.ticks.keys()].sort();
}

function loadDayMeta(date) {
  const value = mem.meta.get(date);
  return value ? { xpEarned: Number(value.xpEarned) || 0 } : null;
}
function saveDayMeta(date, m) {
  mem.meta.set(date, { xpEarned: Number(m?.xpEarned) || 0 });
}

/* ---------- derivation ---------- */

function itemText(it) {
  return it.reps ? `${it.text || ""} · ${it.reps}` : (it.text || "");
}

/* ---------- recurrence ----------
   An item can repeat on a cycle rather than daily:
     every:  14            repeat every 14 days
     anchor: "2026-08-05"  the day the first cycle is due (defaults to plan start)
   and it can stand down on days when another item is showing:
     skipWhen: ["c-microneedling"]
   which is how minoxidil gets out of the way on microneedling days.

   Due-ness is measured from when the item was actually last ticked, not from
   the calendar: miss a day and it stays due — carries forward — until it's
   done, then the next cycle counts `every` days from that real completion
   instead of from the original anchor. Before it's ever been ticked, the
   anchor plays the same role a real completion would (as if one had landed
   `every` days before it), so a missed first occurrence carries forward the
   exact same way rather than silently vanishing until the next multiple. */
function lastTicked(id, exceptDate) {
  let last = null;
  for (const [date, h] of history) {
    if (date < exceptDate && h.ticks && h.ticks[id] && (!last || date > last)) last = date;
  }
  for (const date of storedDates()) {
    if (date < exceptDate && loadTicks(date)[id] && (!last || date > last)) last = date;
  }
  return last;
}
function onCycle(it, date) {
  if (!it.every) return true;
  const anchor = it.anchor || dailyConfig.startDate;
  const baseline = lastTicked(it.id, date) || shiftDate(anchor, -it.every);
  return date >= shiftDate(baseline, it.every);
}

function scheduleFilter(items, date) {
  const due = (items || []).filter(i => onCycle(i, date));
  const showing = new Set(due.map(i => i.id));
  return due.filter(i => !(i.skipWhen || []).some(id => showing.has(id)));
}

/* Excludes the day in progress: ticking a one-off shouldn't make it vanish from
   under your finger, it should just be gone tomorrow. */
function everTicked(id, exceptDate) {
  for (const [date, h] of history) {
    if (date === exceptDate) continue;
    if (h.ticks && h.ticks[id]) return true;
  }
  for (const date of storedDates()) {
    if (date === exceptDate) continue;
    if (loadTicks(date)[id]) return true;
  }
  return false;
}

/* ---------- your changes on top of the daily configuration ----------
   The routine in users/{uid}/config/plan is the shape of the day, and this page
   has no editor for it, so anything you add, edit or delete lives here instead
   and is layered over the derived day. Kept in users/{uid}/config/custom so it
   follows you between devices like the ticks do. */
let custom = { added: [], hidden: {}, doneOnce: {}, edits: {} };

function saveCustom({ push = true } = {}) {
  if (push) sync.pushCustom();
}
const newId = () => "u-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* Applies hides and text edits, then folds in anything you added. */
/* A task you add is one of three things.

   Just today — `scope` is that one date. It is the default, and it is gone
   tomorrow whether or not it was ever ticked, which is the point of it: a list
   that carries everything forward stops being a list of today.

   Routine, every day — `scope` is "daily", so it is on every day's list.

   Until it's done — `carry`, which stores the day it was created and the day it
   was finished. Those two dates are the whole mechanism: it shows from
   `created` up to and including `done`, and nowhere else. Nothing runs
   overnight to move it; every day is worked out from the dates when the page
   draws it. */
function showsOn(a, date) {
  if (a.carry) {
    if (a.created && date < a.created) return false;
    if (a.done && date > a.done) return false;
    return true;
  }
  return a.scope === "daily" || a.scope === date;
}

/* 1 on the day it was created, 2 the next day, and so on — what the row shows
   as "day 3" while a task drags on. */
function carriedDays(a, date) {
  if (!a.carry || !a.created) return 0;
  return daysBetween(a.created, date) + 1;
}

function applyCustom(groups, date) {
  const out = [];
  for (const g of groups) {
    let items = (g.items || [])
      .filter(i => !custom.hidden[i.id])
      .map(i => {
        const e = custom.edits[i.id];
        return e ? { ...i, text: e.text ?? i.text, xp: e.xp ?? i.xp, emoji: e.emoji ?? i.emoji } : i;
      });

    const mine = custom.added.filter(a =>
      a.group === g.title &&
      !custom.hidden[a.id] &&
      showsOn(a, date)
    );
    items = items.concat(mine.map(a => ({ ...a, custom: true, carriedDays: carriedDays(a, date) })));

    // keepEmpty keeps a section on the page with nothing in it, so there is a
    // permanent place to add to — otherwise an emptied group disappears.
    if (items.length || g.keepEmpty) out.push({ ...g, items });
  }

  // Tasks filed under a group the configuration doesn't have — e.g. things pulled in
  // from the calendar — get their own section at the end.
  const known = new Set(out.map(g => g.title));
  const extra = new Map();
  for (const a of custom.added) {
    if (known.has(a.group) || custom.hidden[a.id]) continue;
    if (!showsOn(a, date)) continue;
    if (!extra.has(a.group)) extra.set(a.group, []);
    extra.get(a.group).push({ ...a, custom: true, carriedDays: carriedDays(a, date) });
  }
  for (const [title, items] of extra) {
    out.push({ title, emoji: items[0].groupEmoji || "📌", items });
  }
  return out;
}

function deriveDay(date) {
  const groups = [];

  for (const g of dailyConfig.daily || []) {
    const items = scheduleFilter(g.items, date).map(i => ({ ...i, text: itemText(i) }));
    if (items.length || g.keepEmpty) groups.push({ ...g, items });
  }

  /* custom.doneOnce is the durable record — it rides in the synced custom
     document, so a completed one-off stays gone on every device rather than
     only the one it was ticked on. everTicked() stays as the fallback, which is
     what keeps one-offs finished before this existed still hidden. */
  const pending = (dailyConfig.oneOffs?.items || []).filter(i =>
    !(custom.doneOnce && custom.doneOnce[i.id]) && !everTicked(i.id, date));
  if (pending.length) {
    groups.push({ ...dailyConfig.oneOffs, items: pending.map(i => ({ ...i, text: itemText(i) })) });
  }

  const shown = applyCustom(groups, date);

  const dayOfPlan = daysBetween(dailyConfig.startDate, date) + 1;
  return {
    date, dayOfPlan, groups: shown,
    week: Math.floor((dayOfPlan - 1) / 7) + 1
  };
}

/* ---------- scoring ---------- */
const allItems = () => (plan.groups || []).flatMap(g => g.items || []);

/* An inverted item reads backwards: the stored flag is the exception, and the
   row is ticked when there is no flag. "Didn't smoke weed" works this way, so
   a clean day stores nothing at all and a day never opened still reads clean.
   Only the display and the XP invert — the flag itself keeps its old meaning,
   which is what the streak and the no-weed counter are still counting. */
const isTicked = (item, ticks) => item.invert ? !ticks[item.id] : !!ticks[item.id];

function todayXp() {
  const t = loadTicks(plan.date);
  return allItems().reduce((s, i) => s + (isTicked(i, t) ? (i.xp || 0) : 0), 0);
}
/* Real ticks only, never the inverted default — this is what decides whether a
   day counts toward the streak, and an untouched day has to score zero. */
function todayTicked() {
  const t = loadTicks(plan.date);
  return allItems().filter(i => t[i.id]).length;
}

/* A day counts toward the streak if anything at all was ticked, so the streak
   measures showing up for the daily commitments. */
function activeDates() {
  const s = new Set();
  for (const [date, h] of history) if (h.ticked > 0) s.add(date);
  for (const date of storedDates()) {
    if (Object.keys(loadTicks(date)).length > 0) s.add(date);
  }
  if (todayTicked() > 0) s.add(plan.date); else s.delete(plan.date);
  return s;
}
function computeStreak() {
  const active = activeDates();
  const today = todayISO();
  let cur = active.has(today) ? today : shiftDate(today, -1);
  let n = 0;
  while (active.has(cur)) { n++; cur = shiftDate(cur, -1); }
  return n;
}
function totalXp() {
  let sum = todayXp();
  for (const [date, h] of history) if (date !== plan.date) sum += h.xpEarned || 0;
  return sum;
}

/* ---------- levels ----------
   XP has always been recorded per day; this is what spends it. Two problems had
   to be solved for a level to be trustworthy:

   1. History is a bounded 90-day query, and signed out it is empty altogether,
      so summing it would make the level stall and then run backwards. Instead a
      total per month is kept (users/{uid}/xp/{YYYY-MM}) and lifetime is the sum
      of those — a dozen small numbers a year. Each month is
      recomputed wholesale from the day records rather than incremented, so a
      wrong total repairs itself on the next tick instead of drifting forever.

   2. Items can cost XP as well as pay it, so a total can shrink. The level and
      bar used to be read off `peakXp` — a high-water mark — so they could never
      go backwards. That made the bar sit still for days after a negative tick,
      and freeze outright whenever the stored peak was above what the page
      could see, which defeated the point of having it. Both now read live
      lifetime XP, so every tick moves the bar, and a negative item moves it
      back. `peakXp` is still recorded (see bumpPeak) but no longer drawn. */

function monthKey(date) { return date.slice(0, 7); }

/* Rising cost per level: 400, 560, 740, 940, 1160 … ~2,560 by level 10. A
   formula rather than a table so it never runs out of levels. */
function costForLevel(n) { return 400 + 150 * (n - 1) + 10 * (n - 1) * (n - 1); }

function levelFromXp(xp) {
  let level = 1, remaining = Math.max(0, xp);
  while (remaining >= costForLevel(level)) { remaining -= costForLevel(level); level++; }
  return { level, into: remaining, need: costForLevel(level) };
}

/* Same dual-scan shape as lastTicked(). Precedence matters:
   this browser's day meta is only what this device saw, so Firestore history
   overrides it for past days — it carries the other devices' writes too. Local
   still covers everything outside the 90-day window, and everything when signed
   out. The day in view beats both, read live so it moves as you tick. */
function monthTotal(key) {
  const seen = new Map();
  for (const date of storedDates()) {
    if (monthKey(date) !== key) continue;
    const m = loadDayMeta(date);
    if (m && typeof m.xpEarned === "number") seen.set(date, m.xpEarned);
  }
  for (const [date, h] of history) {
    if (monthKey(date) === key) seen.set(date, h.xpEarned || 0);
  }
  if (plan && monthKey(plan.date) === key) seen.set(plan.date, todayXp());
  let sum = 0;
  for (const v of seen.values()) sum += v;
  return sum;
}

function storedMonths() {
  return [...mem.xpMonth.keys()];
}
function loadMonthXp(key) {
  const v = mem.xpMonth.get(key);
  return Number.isFinite(v) ? v : 0;
}
function lifetimeXp() {
  let sum = 0;
  for (const key of storedMonths()) sum += loadMonthXp(key);
  return sum;
}
function loadPeak() {
  return Number.isFinite(mem.peak) ? mem.peak : 0;
}

/* Recompute the month being looked at, roll it into lifetime, and raise the peak
   if that beat it. The peak is kept for the record and mirrored to Firestore, but
   nothing renders from it any more — renderLevel() reads lifetimeXp() live. */
function bumpPeak() {
  if (!plan) return loadPeak();
  const key = monthKey(plan.date);
  const total = monthTotal(key);
  mem.xpMonth.set(key, total);

  const peak = Math.max(loadPeak(), lifetimeXp());
  mem.peak = peak;

  sync.queueXp(key, total, peak);
  return peak;
}

/* ---------- category collapse ----------
   Display-only: never filters plan.groups itself, so counts, XP, streak and
   sync all keep computing from the full data regardless of what's collapsed. */
let collapsedGroups = new Set();
function toggleGroup(title) {
  if (collapsedGroups.has(title)) collapsedGroups.delete(title); else collapsedGroups.add(title);
  sync.pushPrefs();
  render();
}

/* Which sections are folded up is a setting about a person's own list rather
   than about this browser — the next account to sign in here has different
   sections entirely. So it lives with the account, and follows him to his
   phone. */

/* ---------- render ---------- */
function render() {
  const ticks = loadTicks(plan.date);
  const list = $("list");
  list.textContent = "";
  rowEls.clear();
  secEls.clear();
  lastRendered = JSON.stringify(ticks);

  for (const g of plan.groups || []) {
    const collapsed = collapsedGroups.has(g.title);

    const sec = document.createElement("div");
    sec.className = "sec" + (collapsed ? " collapsed" : "");
    sec.tabIndex = 0;
    sec.setAttribute("role", "button");
    sec.setAttribute("aria-expanded", String(!collapsed));
    const chev = document.createElement("span");
    chev.className = "chev";
    chev.setAttribute("aria-hidden", "true");
    chev.textContent = collapsed ? "▸" : "▾";
    const name = document.createElement("span");
    name.className = "t";
    name.textContent = g.title.toUpperCase();
    const rule = document.createElement("span");
    rule.className = "r";
    const cnt = document.createElement("span");
    cnt.className = "n";
    const gd = (g.items || []).filter(i => isTicked(i, ticks)).length;
    cnt.textContent = `${gd}/${(g.items || []).length}`;
    secEls.set(g.title, cnt);
    sec.append(chev, name, rule, cnt);
    if (!g.fixed) {
      const add = document.createElement("button");
      add.className = "add";
      add.textContent = "+";
      add.title = `Add a task to ${g.title}`;
      add.addEventListener("click", e => { e.stopPropagation(); openAdd(g.title); });
      sec.appendChild(add);
    }
    const toggle = e => { if (e.target.closest(".add")) return; toggleGroup(g.title); };
    sec.addEventListener("click", toggle);
    sec.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      toggle(e);
    });
    list.appendChild(sec);

    if (collapsed) continue;

    for (const it of g.items || []) {
      const on = isTicked(it, ticks);
      const row = document.createElement("label");
      row.className = "row" + (on ? " done" : "");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = on;
      cb.addEventListener("change", () => setTick(it.id, it.invert ? !cb.checked : cb.checked));

      const box = document.createElement("span");
      box.className = "box";
      box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6"/></svg>';

      const em = document.createElement("span");
      em.className = "emoji";
      em.textContent = it.emoji || "•";

      const txt = document.createElement("span");
      txt.className = "txt";
      txt.append(document.createTextNode(it.text));
      // Only while it is still dragging — the day it gets done it is not late.
      if (it.carriedDays > 1 && !on) {
        const age = document.createElement("span");
        age.className = "carry";
        age.textContent = `DAY ${it.carriedDays}`;
        txt.appendChild(age);
      }
      if (it.detail) {
        const d = document.createElement("span");
        d.className = "detail";
        d.textContent = it.detail;
        txt.appendChild(d);
      }

      const pill = document.createElement("span");
      // Items can cost XP as well as pay it, so the sign comes from the number.
      const xp = it.xp || 0;
      pill.className = "pill" + (xp < 0 ? " cost" : "");
      pill.textContent = xp < 0 ? `−${Math.abs(xp)}` : `+${xp}`;

      row.append(cb, box, em, txt, pill);
      rowEls.set(it.id, row);

      const wrap = document.createElement("div");
      wrap.className = "rowwrap";
      const clip = document.createElement("div");
      clip.className = "rowclip";
      const tray = document.createElement("div");
      tray.className = "tray";
      const trayDelete = document.createElement("button");
      trayDelete.type = "button";
      trayDelete.textContent = "DELETE";
      trayDelete.addEventListener("click", e => {
        e.preventDefault(); e.stopPropagation();
        closeRevealed();
        removeItem(it);
      });
      tray.append(trayDelete);

      const btns = document.createElement("div");
      btns.className = "rowbtns";
      const bEdit = document.createElement("button");
      bEdit.textContent = "✎"; bEdit.title = "Edit";
      bEdit.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openEdit(it); });
      const bDel = document.createElement("button");
      bDel.textContent = "✕"; bDel.title = "Remove";
      bDel.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); removeItem(it); });
      btns.append(bEdit, bDel);

      clip.append(tray, row);
      wrap.append(clip, btns);
      attachGestures(wrap, row, { id: it.id, onEdit: () => openEdit(it) });
      list.appendChild(wrap);
    }
  }

  // Every row was just rebuilt, so whichever had its Delete showing is gone.
  revealed = null;
  renderStreak();
  renderCounter();
  renderLevel();
  renderDayNav();
  renderPriority();
}

/* ---------- gestures ----------
   Swipe left to delete: the element tracks the finger 1:1 with no transition,
   and commits once it has passed a third of the screen. Long press to edit.
   Vertical scrolling has to keep working, so the first few pixels decide which
   gesture this is and the other one is then ignored.

   Task rows and the priority card both use this. `onEdit` and `onDelete` say
   what those two gestures mean for the caller, and `enabled` lets the priority
   card switch them off while its own form is open — a swipe or a long press
   through a field being typed into is never the intent. */
const TRAY_W = 96;        // px — matches .tray width
const TAP_SLOP = 8;       // shorter than this is a tap, not a swipe
const LONG_PRESS_MS = 500;

/* Only one card shows its Delete at a time, so opening one closes the last. */
let revealed = null;      // { id, close }
function closeRevealed() {
  if (!revealed) return;
  const { close } = revealed;
  revealed = null;
  close();
}

/* Swipe left to reveal Delete, long press to edit, tap to tick — the same
   gesture set Opportunities has, and deliberately the same shape of code.
   Nothing is destroyed by the swipe itself: it moves the card off a button, and
   the button is what deletes.

   Pointer events rather than touch events, so a mouse drag works too and the
   browser keeps its own scrolling (`touch-action: pan-y` on the card says
   vertical belongs to the page and horizontal to us). */
function attachGestures(wrap, card, { id, onEdit, enabled = () => true }) {
  let x0 = 0, y0 = 0, dx = 0, base = 0;
  let axis = null;          // null until decided, then "x" or "y"
  let tracking = false, timer = null, suppress = false;

  const settle = offset => {
    card.style.transition = "";
    card.style.transform = offset ? `translateX(${offset}px)` : "";
    wrap.classList.toggle("revealed", offset !== 0);
  };
  const close = () => settle(0);
  const isOpen = () => !!revealed && revealed.id === id;

  card.addEventListener("pointerdown", e => {
    if (e.button || !enabled()) return;
    tracking = true; axis = null; dx = 0; suppress = false;
    x0 = e.clientX; y0 = e.clientY;
    base = isOpen() ? -TRAY_W : 0;
    timer = setTimeout(() => {
      if (axis !== null) return;      // it moved — a swipe, not a press
      suppress = true;
      if (navigator.vibrate) navigator.vibrate(12);
      onEdit();
    }, LONG_PRESS_MS);
  });

  card.addEventListener("pointermove", e => {
    if (!tracking) return;
    const ax = e.clientX - x0;
    const ay = e.clientY - y0;
    if (axis === null) {
      if (Math.abs(ax) < TAP_SLOP && Math.abs(ay) < TAP_SLOP) return;
      axis = Math.abs(ax) > Math.abs(ay) ? "x" : "y";
      clearTimeout(timer);
      if (axis === "x") {
        card.style.transition = "none";
        card.setPointerCapture(e.pointerId);
      }
    }
    if (axis !== "x") return;
    suppress = true;                  // a drag must not also tick the row
    dx = Math.max(-TRAY_W, Math.min(0, base + ax));
    card.style.transform = `translateX(${dx}px)`;
  });

  const end = () => {
    clearTimeout(timer);
    if (!tracking) return;
    tracking = false;

    if (axis === "x") {
      axis = null;
      // Past the halfway mark it opens, otherwise it falls back shut.
      const open = dx <= -TRAY_W / 2;
      if (open && revealed && revealed.id !== id) closeRevealed();
      settle(open ? -TRAY_W : 0);
      revealed = open ? { id, close } : null;
      return;
    }
    axis = null;

    // A tap on a card with its Delete showing puts it away instead of ticking.
    if (isOpen()) { suppress = true; closeRevealed(); }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", () => {
    clearTimeout(timer);
    tracking = false; axis = null;
    settle(isOpen() ? -TRAY_W : 0);
  });

  // A drag or long press must not also toggle the checkbox.
  card.addEventListener("click", e => {
    if (suppress) { e.preventDefault(); e.stopPropagation(); suppress = false; }
  }, true);

  card.addEventListener("dblclick", e => { if (enabled()) { e.preventDefault(); onEdit(); } });
  card.addEventListener("contextmenu", e => { if (enabled()) { e.preventDefault(); onEdit(); } });
}

/* ---------- add / edit / remove ---------- */
let editing = null;   // null = adding; otherwise the item being changed
let addGroup = null;
let undoTimer = null;

function openAdd(group) {
  editing = null; addGroup = group;
  $("mTitle").textContent = "ADD TASK";
  $("mText").value = ""; $("mEmoji").value = ""; $("mXp").value = "10";
  // Points are still counted for an account that has them switched off — there
  // is just nothing to say about them here.
  $("mXpWrap").hidden = extras.xp === false;
  $("mScopeWrap").style.display = "";
  $("mScope").value = "today";
  $("scrim").hidden = false;
  setTimeout(() => $("mText").focus(), 30);
}

function openEdit(item) {
  editing = item; addGroup = null;
  $("mTitle").textContent = "EDIT TASK";
  $("mText").value = item.text || "";
  $("mEmoji").value = item.emoji || "";
  $("mXp").value = item.xp ?? 10;
  $("mXpWrap").hidden = extras.xp === false;
  // How often only applies to tasks you added — programme items are every day.
  const own = custom.added.find(a => a.id === item.id);
  $("mScopeWrap").style.display = own ? "" : "none";
  if (own) $("mScope").value = own.carry ? "carry" : own.scope === "daily" ? "daily" : "today";
  $("scrim").hidden = false;
  setTimeout(() => $("mText").focus(), 30);
}

function closeModal() { $("scrim").hidden = true; editing = null; addGroup = null; }

function saveModal() {
  const text = $("mText").value.trim();
  if (!text) { $("mText").focus(); return; }
  const emoji = $("mEmoji").value.trim() || "✅";
  const xp = Math.max(0, Math.min(99, parseInt($("mXp").value, 10) || 0));
  const how = $("mScope").value;

  if (editing) {
    const own = custom.added.find(a => a.id === editing.id);
    if (own) {
      Object.assign(own, { text, emoji, xp });
      if (how === "carry") {
        // Switching a task to a carried one starts its clock on the day in view.
        own.carry = true;
        own.created = own.created || plan.date;
        delete own.scope;
      } else {
        own.scope = how === "daily" ? "daily" : plan.date;
        delete own.carry; delete own.created; delete own.done;
      }
    } else {
      custom.edits[editing.id] = { text, emoji, xp };
    }
  } else if (how === "carry") {
    custom.added.push({ id: newId(), text, emoji, xp, group: addGroup,
                        carry: true, created: plan.date, done: "" });
  } else {
    custom.added.push({ id: newId(), text, emoji, xp, group: addGroup,
                        scope: how === "daily" ? "daily" : plan.date });
  }
  saveCustom();
  closeModal();
  rebuild();
}

function removeItem(item) {
  const own = custom.added.findIndex(a => a.id === item.id);
  const snapshot = own >= 0 ? custom.added[own] : null;
  if (own >= 0) custom.added.splice(own, 1);
  else custom.hidden[item.id] = true;
  saveCustom();
  rebuild();

  showToast(`Removed “${item.text}”`, () => {
    if (snapshot) custom.added.push(snapshot);
    else delete custom.hidden[item.id];
    saveCustom();
    rebuild();
  });
}

function showToast(msg, onUndo) {
  clearTimeout(undoTimer);
  $("toastMsg").textContent = msg;
  const btn = $("toastUndo");
  btn.onclick = () => { clearTimeout(undoTimer); $("toast").hidden = true; onUndo(); };
  $("toast").hidden = false;
  undoTimer = setTimeout(() => { $("toast").hidden = true; }, 6000);
}

/* Everything downstream of a tick that isn't the row itself. */
function refreshDerived() {
  const ticks = loadTicks(plan.date);
  lastRendered = JSON.stringify(ticks);
  for (const g of plan.groups || []) {
    const cnt = secEls.get(g.title);
    if (cnt) cnt.textContent = `${(g.items || []).filter(i => isTicked(i, ticks)).length}/${(g.items || []).length}`;
  }
  renderStreak();
  renderCounter();
  renderLevel();
}

/* Labelled SHOWING UP, not DAYS: the no-weed counter below it is also a day
   count, and two unlabelled numbers next to each other read as the same thing. */
function renderStreak() {
  const s = computeStreak();
  $("streakN").textContent = s;
  $("streakLbl").textContent = "SHOWING UP";
  $("streak").className = "streak" + (s === 0 ? " cold" : "");
}

function renderLevel() {
  if (!plan) return;
  // Live lifetime XP, not the high-water mark: the bar has to answer every tick,
  // which is the whole point of it. bumpPeak() still recomputes the month and
  // keeps the peak up to date — it just no longer drives what's drawn.
  bumpPeak();
  const { level, into, need } = levelFromXp(lifetimeXp());
  $("level").hidden = false;
  $("lvNum").textContent = level;
  $("lvFill").style.width = Math.max(0, Math.min(100, Math.round((into / need) * 100))) + "%";
  $("lvCap").textContent =
    `${into.toLocaleString()} / ${need.toLocaleString()} XP TO LEVEL ${level + 1}`;

  // The day's own number, free to move both ways — unlike the level above it.
  // Says TODAY only when today is what's on screen; the day nav can be on a past one.
  const day = todayXp();
  const pill = $("lvToday");
  pill.className = "lv-today" + (day < 0 ? " cost" : day === 0 ? " zero" : "");
  pill.textContent = `${day < 0 ? "−" : "+"}${Math.abs(day).toLocaleString()} XP` +
    (plan.date === todayISO() ? " TODAY" : "");
}

/* ---------- day counter ----------
   Days since the last recorded smoke, counting today.

   Firestore is the only source. The date lives in one field —
   users/{uid}/config/trackers.r-smoked-weed — read once on sign-in and then
   kept live by sync.attachTrackers(). Nothing is read from localStorage and
   nothing is rescanned: an earlier version answered from this device's own
   storage first, falling back to a 90-day scan, so two browsers signed into
   the same account showed two different numbers. That is the bug this
   replaces, and it is why no local fallback is left to drift.

   When the field is missing or malformed, sync.recoverWeed() asks the server
   for the single most recent day whose tick is set — one document, ordered by
   date descending — and writes the answer back, so the repair happens once
   rather than on every load. If there is genuinely no such day the counter
   shows a dash. It never guesses a start date.

   A day with no record at all counts as a no-weed day. That is deliberate —
   the alternative punishes forgetting to open an app rather than smoking. The
   cost is that a week away reads as 7.

   Read off todayISO() rather than plan.date, like computeStreak(): this is a
   fact about right now, not about the day the nav happens to be showing. */
const WEED_ID = "r-smoked-weed";

/* undefined = not loaded yet, null = nothing on record, otherwise the date.
   The first two both render as a dash, but only the second is a settled
   answer — keeping them apart is what stops a slow read looking like "never". */
let weedDate;

const isISODate = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);

function noWeedDays() {
  if (!isISODate(weedDate)) return null;
  return Math.max(0, daysBetween(weedDate, todayISO()));
}

function renderCounter() {
  if (!plan) return;              // nothing on screen to update
  const n = noWeedDays();
  const sq = $("counterN");
  $("counter").hidden = false;
  sq.textContent = n === null ? "\u2014" : n;
  sq.className = "sq" + (n > 0 ? " on" : "") + (n !== null && String(n).length > 2 ? " d3" : "");
}

/* ---------- moving between days ---------- */
function renderDayNav() {
  const today = todayISO();
  const d = plan.date;
  const diff = daysBetween(today, d);
  const lbl = $("dayLbl");

  let head;
  if (diff === 0) head = "TODAY";
  else if (diff === -1) head = "YESTERDAY";
  else if (diff === 1) head = "TOMORROW";
  else head = prettyDate(d).toUpperCase().replace(/,/g, "");

  lbl.textContent = "";
  lbl.append(document.createTextNode(head));
  const small = document.createElement("small");
  const n = Math.abs(diff), unit = n === 1 ? "day" : "days";
  small.textContent = diff === 0 ? prettyDate(d) : (diff < 0 ? `${n} ${unit} ago` : `in ${n} ${unit}`);
  lbl.appendChild(small);

  $("dayToday").hidden = diff === 0;
}

async function goToDay(date) {
  viewDate = date;
  await rebuild();
}

const isOneOff = id => (dailyConfig.oneOffs?.items || []).some(i => i.id === id);

function setTick(id, on) {
  const t = loadTicks(plan.date);
  if (on) t[id] = true; else delete t[id];
  saveTicks(plan.date, t);

  // A one-off is done for good, so say so explicitly rather than leaving it to
  // be re-inferred from day records that this browser may not have.
  if (isOneOff(id)) {
    if (on) custom.doneOnce[id] = plan.date;
    else delete custom.doneOnce[id];
    saveCustom();
  }

  if (id === WEED_ID) updateTracker(on);

  /* Finishing a carried task is what stops it carrying: the day it was ticked
     is written on the task itself, so tomorrow simply does not draw it. */
  const carried = custom.added.find(a => a.id === id && a.carry);
  if (carried) {
    if (on) carried.done = plan.date; else delete carried.done;
    saveCustom();
  }

  const item = allItems().find(i => i.id === id);
  const row = rowEls.get(id);
  if (row) row.classList.toggle("done", item?.invert ? !on : on);
  // xpEarned is kept locally too, so lifetime XP still adds up signed out.
  saveDayMeta(plan.date, { xpEarned: todayXp() });
  refreshDerived();
  sync.queueTick(plan.date, id, on);
}

/* Works out what the tracker date should become after this tick, without
   writing anything itself: flush() sends it in the same batch as the tick, so
   the day record and the tracker can never end up disagreeing.

   Ticking only ever moves the date forward — a backdated entry older than what
   is already recorded must not erase real clean days. Unticking only matters
   when the day being undone is the one currently recorded; any other day's
   untick cannot change what the most recent smoke was.

   Undoing the recorded day needs the next-most-recent one, and that is a
   question only the server can answer, so it is marked here and resolved in
   flush(). The one-step undo buffer this used to keep is gone with the scan it
   existed to protect against: there is no bounded local scan left to return a
   wrong empty answer, so there is nothing to guard. */
function updateTracker(on) {
  if (on) {
    if (isISODate(weedDate) && plan.date <= weedDate) return;
    weedDate = plan.date;
    sync.trackerPending = { set: plan.date };
  } else {
    if (plan.date !== weedDate) return;
    weedDate = undefined;                          // unknown until the server answers
    sync.trackerPending = { recoverBefore: plan.date };
  }
  renderCounter();
}

/* shared/firebase.js and shared/account.js, once init() has pulled them in. */
let fbLib = null, accountLib = null;

/* The parts of this page the account is allowed to see. Everything on until
   the answer arrives, which is what an account nobody has been through the
   extra settings for gets anyway. */
let extras = { xp: true, priority: true, streaks: true };
function applyExtras() {
  document.body.classList.toggle("no-xp", extras.xp === false);
  document.body.classList.toggle("no-priority", extras.priority === false);
  document.body.classList.toggle("no-streaks", extras.streaks === false);
}

/* ================= sync layer =================
   Firebase decides what this page shows. Without a signed-in account there is
   no day, no counter and no list — see setAuthState(). Nothing here may throw
   upward. */
const sync = {
  mode: "local",
  uid: null,
  fb: null,
  unsub: null,
  timer: null,
  queue: new Map(),
  queueDate: null,
  flushDate: null,        // a flush past its queue but not yet handed to Firestore
  xpTimer: null,
  xpPending: null,
  prefsTimer: null,
  trackerUnsub: null,
  trackerPending: null,   // { set } or { recoverBefore }, resolved in flush()
  lastRefresh: 0,         // throttles refreshAll(), see there

  setUI(state, msg, btnLabel, btnAction) {
    const row = $("sync"), btn = $("authBtn");
    row.className = "sync" + (state === "on" ? " on" : state === "err" ? " err" : "");
    $("syncMsg").textContent = msg;
    if (btnLabel) { btn.hidden = false; btn.textContent = btnLabel; btn.onclick = btnAction; }
    else { btn.hidden = true; btn.onclick = null; }
  },

  /* The gate. "in" is the only state that shows anything personal; the markup
     ships as "checking" so a cached page can't flash yesterday's list before
     Firebase has said who is looking. */
  setAuthState(state) { $("wrap").dataset.auth = state; },

  /* Signing out has to leave nothing of the account behind — not on screen, not
     in memory, and not queued to be written. There is no longer a localStorage
     copy to worry about: emptying `mem` is the whole of it. */
  teardown() {
    clearTimeout(this.timer);
    clearTimeout(this.xpTimer);
    clearTimeout(this.prefsTimer);
    this.queue.clear();
    this.queueDate = null;
    this.flushDate = null;
    this.xpPending = null;
    this.trackerPending = null;
    this.customPending = false;
    this.lastRefresh = 0;
    history.clear();
    rowEls.clear();
    secEls.clear();
    mem.ticks.clear();
    mem.meta.clear();
    mem.priority.clear();
    mem.xpMonth.clear();
    mem.peak = 0;
    dailyConfig = emptyPlan();
    extras = { xp: true, priority: true, streaks: true };
    applyExtras();
    collapsedGroups = new Set();
    custom = { added: [], hidden: {}, doneOnce: {}, edits: {} };
    plan = null;
    viewDate = null;
    weedDate = undefined;
    lastRendered = null;
    priorityEditDate = null;
    $("list").textContent = "";
    for (const id of ["counter", "level", "priorityWrap", "scrim"]) $(id).hidden = true;
  },

  /* Connecting, and knowing who is signed in, is shared/firebase.js's job now.
     What a failure says, and the gate it leaves the page in, stays here — the
     other sections word both differently on purpose. */
  async init() {
    try {
      [fbLib, accountLib] = await Promise.all([
        import("../shared/firebase.js"),
        import("../shared/account.js")
      ]);
      this.fb = await fbLib.connect();
    } catch (e) {
      this.setAuthState("err");
      if (e && e.code === "no-config") {
        this.setUI("err", "Sync isn't configured, so there's nothing to show here.",
          "Reload", () => location.reload());
      } else {
        console.warn("Firebase unavailable:", e);
        this.setUI("err", "Couldn't reach Firebase, so there's nothing to show here.",
          "Reload", () => location.reload());
      }
      return;
    }
    this.mode = "signed-out";
    fbLib.watchAuth(this.fb, u => this.onAuth(u));
  },

  async onAuth(user) {
    if (this.unsub) { this.unsub(); this.unsub = null; }
    if (this.trackerUnsub) { this.trackerUnsub(); this.trackerUnsub = null; }
    if (!user) {
      this.uid = null; this.mode = "signed-out";
      this.teardown();
      this.setAuthState("out");
      this.setUI("off", "Sign in to see your day.",
        "Sign in with Google", () => this.signIn());
      return;
    }
    this.uid = user.uid; this.mode = "signed-in";
    this.setUI("on", `Syncing as ${user.email || "your account"}`, "Sign out", () => this.signOut());
    // Anything still queued from a token refresh goes up FIRST, so the
    // read-back below can't overwrite it with an older server copy.
    this.flush();
    if (this.customPending) await this.pushCustom();
    // The day is built here rather than at boot: everything below reads
    // plan.date, and until an account is known there is no day to build. The
    // added tasks and the folded sections belong to the account rather than to
    // this device, so both are fetched before the first paint instead of being
    // corrected after it.
    // The routine first: everything below derives a day from it.
    await Promise.all([this.loadPlan(), this.loadExtras()]);
    await Promise.all([this.loadPrefs(), this.loadCustomRemote({ reconcile: false })]);
    await rebuild();
    this.setAuthState("in");
    this.attach();
    this.loadHistory();
    this.loadXp();
    this.attachTrackers();
    this.loadWeed();
  },

  /* ---------- lifetime XP ----------
     A month total and a peak, both whole-value writes with no merge — they are
     recomputed figures, not accumulating maps, so the no-merge rule that guards
     the ticks applies here for the same reason. */
  xpRef(id) {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "xp", id);
  },

  queueXp(monthKeyStr, total, peak) {
    if (this.mode !== "signed-in") return;
    this.xpPending = { monthKeyStr, total, peak };
    clearTimeout(this.xpTimer);
    this.xpTimer = setTimeout(() => this.flushXp(), 800);
  },

  async flushXp() {
    clearTimeout(this.xpTimer);
    if (this.mode !== "signed-in" || !this.xpPending) return;
    const { monthKeyStr, total, peak } = this.xpPending;
    this.xpPending = null;
    const { f } = this.fb;
    try {
      await Promise.all([
        f.setDoc(this.xpRef(monthKeyStr),
          { month: monthKeyStr, total, updatedAt: f.serverTimestamp() }),
        f.setDoc(this.xpRef("peak"), { peakXp: peak, updatedAt: f.serverTimestamp() })
      ]);
    } catch { /* offline — the local copy stands and the next tick retries */ }
  },

  /* Pull the other devices' months in, then let bumpPeak() re-derive. Peak is
     reconciled as a max, so it needs no conflict resolution. */
  async loadXp() {
    const { f, db } = this.fb;
    try {
      const snap = await f.getDocs(f.collection(db, "users", this.uid, "xp"));
      let remotePeak = 0;
      snap.forEach(d => {
        const v = d.data();
        if (d.id === "peak") { remotePeak = v.peakXp || 0; return; }
        if (!/^\d{4}-\d{2}$/.test(d.id)) return;
        // The month in view is authoritative locally — it is being edited now.
        if (plan && d.id === monthKey(plan.date)) return;
        mem.xpMonth.set(d.id, Number(v.total) || 0);
      });
      if (remotePeak > loadPeak()) mem.peak = remotePeak;
      renderLevel();
    } catch (e) {
      console.warn("XP totals unavailable:", e);
    }
  },

  /* ---------- trackers (e.g. last-smoked date) ----------
     One small doc holding one field per tracker, merge-written so a future
     second tracker can add its own key without a write to one clobbering the
     other's field. That is the whole reason this collection breaks the
     no-merge rule: every write here only ever names its own key.

     Live-subscribed, unlike xp/ above — this is the piece that used to go
     stale on another open tab until you navigated to the exact day that
     changed. */
  trackerRef() {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "config", "trackers");
  },

  /* One document read per sign-in, and that is the normal cost of the counter.
     The query below runs only when the field is missing or malformed, which is
     also how an account that predates the field repairs itself — once, because
     the answer is written back. */
  async loadWeed() {
    const { f } = this.fb;
    try {
      // Server first, cache second — the same shape attach() uses. A cached
      // copy would render a number that the listener then corrects a moment
      // later, and the flicker reads as the bug this is fixing.
      let snap;
      try { snap = await f.getDocFromServer(this.trackerRef()); }
      catch { snap = await f.getDoc(this.trackerRef()); }
      const raw = snap.exists() ? snap.data()[WEED_ID] : null;
      if (isISODate(raw)) { weedDate = raw; renderCounter(); return; }
      const found = await this.recoverWeed();
      weedDate = found;
      if (found) await this.writeTracker(found);
      renderCounter();
    } catch (e) {
      console.warn("Tracker read failed:", e.code || e.message);
    }
  },

  /* The most recent day whose weed tick is set, or null if there is none — one
     document, never a walk through the history window.

     `before` narrows it to days strictly earlier than that date, which is what
     unticking the recorded day needs in order to fall back to the one before
     it. Read from the server on purpose: the local cache can be arbitrarily
     stale, and this answer decides whether a real date gets erased.

     Ordering by the tick field before the document id reads as redundant, the
     filter having already pinned it to true. It is what keeps the query on
     Firestore's automatic index, so no composite index has to exist for it. */
  async recoverWeed(before) {
    const { f, db } = this.fb;
    const days = f.collection(db, "users", this.uid, "days");
    const tick = new f.FieldPath("ticks", WEED_ID);
    const only = [f.where(tick, "==", true)];
    if (before) only.push(f.where(f.documentId(), "<", f.doc(days, before)));
    const snap = await f.getDocsFromServer(f.query(days, ...only,
      f.orderBy(tick, "desc"), f.orderBy(f.documentId(), "desc"), f.limit(1)));
    return snap.empty ? null : snap.docs[0].id;
  },

  /* Only for the repair above. A tick's own tracker write rides in flush()'s
     batch instead, so the day record and this field move together. */
  async writeTracker(date) {
    const { f } = this.fb;
    await f.setDoc(this.trackerRef(),
      { [WEED_ID]: date || f.deleteField(), updatedAt: f.serverTimestamp() },
      { merge: true });
  },

  attachTrackers() {
    if (this.trackerUnsub) { this.trackerUnsub(); this.trackerUnsub = null; }
    const { f } = this.fb;
    this.trackerUnsub = f.onSnapshot(this.trackerRef(),
      snap => {
        /* Server-confirmed state only. This replaces a flag that held off any
           snapshot while a write was queued: the flag could be left standing
           after the write had already landed, locking out a perfectly good
           remote value. hasPendingWrites clears itself, so the server always
           gets the last word and a cached copy never does. */
        if (snap.metadata.hasPendingWrites) return;
        const raw = snap.exists() ? snap.data()[WEED_ID] : null;
        const remote = isISODate(raw) ? raw : null;
        if (remote === weedDate) return;
        weedDate = remote;
        if (plan) renderCounter();
      },
      e => console.warn("Tracker sync dropped:", e.code || e.message));
  },

  /* The popup, its redirect fallback and the wording of a failed sign-in are
     shared/firebase.js's. Where any of it appears is this page's status line. */
  async signIn() {
    const msg = await fbLib.signIn(this.fb, text => this.setUI("off", text));
    if (msg) this.setUI("err", msg, "Try again", () => this.signIn());
  },

  async signOut() {
    try { await fbLib.signOut(this.fb); }
    catch (e) { this.setUI("err", `Couldn't sign out (${e.message}).`, "Try again", () => this.signOut()); }
  },

  ref(date) {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "days", date);
  },

  /* Stored alongside the ticks so the history stands on its own later. `items`
     is the denominator — without the list that was on offer that day, a count of
     ticks can't be read as good or bad. `xpEarned` is stored because past days'
     XP can't be recomputed once their plan is gone. */
  meta() {
    return {
      date: plan.date,
      dayOfPlan: plan.dayOfPlan ?? null,
      week: plan.week ?? null,
      items: allItems().map(i => i.id),
      xpEarned: todayXp(),
      ticked: todayTicked()
    };
  },

  async ensureMeta(data, date) {
    const m = this.meta();
    const unchanged =
      data.date === m.date && data.dayOfPlan === m.dayOfPlan && data.week === m.week &&
      data.xpEarned === m.xpEarned && data.ticked === m.ticked &&
      JSON.stringify(data.items || []) === JSON.stringify(m.items);
    if (unchanged) return;
    try { await this.fb.f.updateDoc(this.ref(date), m); } catch {}
  },

  /* One question asked in two places: is this device holding a change to
     `date` that Firestore has not been told about yet? While that is true a
     snapshot can't be trusted to contain it, and adopting one would undo it.
     Covers queueTick()'s 500ms debounce and the lookup flush() does before its
     batch — that lookup is a round trip with the queue already emptied, so
     without flushDate an untick would be re-adopted from the server mid-flight. */
  writesPending(date) {
    return (this.queue.size > 0 && this.queueDate === date) || this.flushDate === date;
  },

  adopt(ticks, date) {
    saveTicks(date, ticks);
    // A snapshot already in flight can land after sign-out tore the day down.
    if (!plan || plan.date !== date) return;
    // Our own writes echo back through onSnapshot; rebuilding the list for a
    // state it already shows would flash the rows for nothing.
    if (JSON.stringify(ticks) === lastRendered) return;
    render();
  },

  adoptPriority(value, date) {
    const record = normalisePriority(value);
    if (!record) return false;
    savePriorityLocal(date, record);
    if (plan && plan.date === date && priorityEditDate !== date) renderPriority();
    return true;
  },

  priorityFields(date) {
    const record = loadPriority(date);
    if (!record) return {};
    return { priority:record, priorityUpdatedAt:this.fb.f.serverTimestamp() };
  },

  async pushPriority(date, record = loadPriority(date)) {
    if (this.mode !== "signed-in" || !record) return;
    const { f } = this.fb;
    try {
      await f.setDoc(this.ref(date), {
        priority:record,
        priorityUpdatedAt:f.serverTimestamp()
      }, { merge:true });
    } catch (e) {
