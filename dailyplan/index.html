   reason the day nav is there. They read the ninety days of history the rest of
   the page reads, so a date older than that window falls back to the tracker
   date below and then to the streak's own start.

   Stored in users/{uid}/config/streaks as one small list. Nothing about it is
   weed-specific — that one is simply the first entry, written in for accounts
   that had the old single counter. */

const DEFAULT_TARGET = 30;

let streaks = [];              // [{ id, name, kind, itemId, target, since, done }]

/* The last day each avoid-streak's card was ticked, from
   users/{uid}/config/trackers — one field per card id, merge-written so two
   trackers can never clobber each other.

   It exists because the history query is bounded to ninety days and a clean
   run is allowed to be longer than that. Undefined means not loaded yet and
   null means the server has nothing; the two look the same on screen but only
   the second is a settled answer, and keeping them apart is what stops a slow
   read reading as "never". */
let trackerDates = new Map();  // itemId -> "YYYY-MM-DD" | null | undefined

const isISODate = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);

function normaliseStreak(v) {
  if (!v || typeof v !== "object") return null;
  const id = typeof v.id === "string" && v.id ? v.id : null;
  const itemId = typeof v.itemId === "string" && v.itemId ? v.itemId : null;
  if (!id || !itemId) return null;
  const target = Math.max(1, Math.min(999, Number(v.target) || DEFAULT_TARGET));
  return {
    id, itemId, target,
    name: typeof v.name === "string" ? v.name.slice(0, 40) : "",
    kind: v.kind === "avoid" ? "avoid" : "build",
    since: isISODate(v.since) ? v.since : null,
    /* Marked done and taken off the row. The record stays so the undo has
       something to put back, and so a finished challenge is not simply lost. */
    done: isISODate(v.done) ? v.done : null
  };
}

const liveStreaks = () => streaks.filter(s => !s.done);

/* The raw flag for one card on one date. Days the page is holding win over the
   history query, because the day in view is being edited right now. Raw, never
   inverted: what "No weed" stores is the smoking, and that is what counts. */
function tickOn(itemId, date) {
  if (mem.ticks.has(date)) return !!mem.ticks.get(date)[itemId];
  const h = history.get(date);
  return !!(h && h.ticks && h.ticks[itemId]);
}

/* A day nobody opened is not told apart from a day nothing was ticked on, and
   that is deliberate. For a build streak it ends the run, which is what missing
   a day means. For an avoid streak it counts as a clean day — the alternative
   punishes forgetting to open an app rather than the thing being tracked, and
   the cost of it is that a week away reads as seven clean days. */

/* The most recent day on or before `date` that the card was ticked. History
   first, then the tracker field for anything older than the window. */
function lastTick(streak, date) {
  let best = null;
  for (const d of history.keys()) if (d <= date && tickOn(streak.itemId, d)) {
    if (!best || d > best) best = d;
  }
  for (const d of storedDates()) if (d <= date && tickOn(streak.itemId, d)) {
    if (!best || d > best) best = d;
  }
  const recorded = trackerDates.get(streak.itemId);
  if (isISODate(recorded) && recorded <= date && (!best || recorded > best)) best = recorded;
  return best;
}

/* The number on the tile, for the day in view. null while the answer is still
   on its way, which is the dash. */
function streakCount(streak, date) {
  if (streak.kind === "avoid") {
    // Not loaded yet, and nothing in the history to answer with instead.
    if (trackerDates.get(streak.itemId) === undefined && !history.size) return null;
    const last = lastTick(streak, date);
    const from = last || streak.since;
    if (!from) return null;
    return Math.max(0, daysBetween(from, date));
  }
  /* A build streak counts back from the day in view. The day itself is only
     part of the run once it has been ticked — an untouched today must not end
     a run that is still going, so it starts from yesterday until it is done. */
  let cur = tickOn(streak.itemId, date) ? date : shiftDate(date, -1);
  let n = 0;
  while (tickOn(streak.itemId, cur)) {
    if (streak.since && cur < streak.since) break;
    n++;
    cur = shiftDate(cur, -1);
  }
  return n;
}

function renderStreaks() {
  if (!plan) return;
  const row = $("streakRow");
  const live = liveStreaks();
  // Nothing to show and nothing to add to: the section goes altogether rather
  // than leaving an empty strip on a new account's first screen.
  $("streaks").hidden = live.length === 0 && sync.mode !== "signed-in";
  row.textContent = "";

  for (const st of live) {
    const n = streakCount(st, plan.date);
    const card = document.createElement("div");
    card.className = "strk press-edit" + (n ? "" : " cold");
    card.setAttribute("role", "button");
    card.tabIndex = 0;
    card.title = st.name;

    const sq = document.createElement("div");
    sq.className = "sq";
    const fill = document.createElement("i");
    fill.className = "fill";
    // Past the target it stays full — the count carries on, the bar cannot.
    fill.style.height = Math.max(0, Math.min(100, ((n || 0) / st.target) * 100)) + "%";
    const num = document.createElement("span");
    const shown = n === null ? "—" : String(n);
    num.className = "n" + (shown.length > 2 ? " d3" : "");
    num.textContent = shown;
    sq.append(fill, num);

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = st.name;

    card.append(sq, nm);
    attachHold(card, () => openStreakEdit(st.id));
    row.appendChild(card);
  }
}

/* The finger is still down when the dialog opens, so the click that ends the
   press lands on the backdrop that has just appeared underneath it — and the
   backdrop's job is to close the dialog. One click is swallowed to stop the
   press from undoing itself. */
function swallowNextClick() {
  const stop = e => { e.preventDefault(); e.stopPropagation(); off(); };
  const off = () => { clearTimeout(t); document.removeEventListener("click", stop, true); };
  const t = setTimeout(off, 700);
  document.addEventListener("click", stop, true);
}

/* Long press opens the tile's own dialog — editing and removing are both in
   there, so the tile needs no swipe and no second gesture. Desktop gets the
   same dialog from a double-click or a right-click, the way a task row does;
   hover buttons would have to sit on top of the number, which is the one thing
   a tile a third of a column wide has room for. */
function attachHold(el, onHold, { keys = true } = {}) {
  let timer = null, x0 = 0, y0 = 0, fired = false;
  const cancel = () => { clearTimeout(timer); timer = null; };
  el.addEventListener("pointerdown", e => {
    if (e.button) return;
    fired = false; x0 = e.clientX; y0 = e.clientY;
    timer = setTimeout(() => {
      fired = true;
      if (navigator.vibrate) navigator.vibrate(12);
      onHold();
      swallowNextClick();
    }, LONG_PRESS_MS);
  });
  el.addEventListener("pointermove", e => {
    if (!timer) return;
    if (Math.abs(e.clientX - x0) > TAP_SLOP || Math.abs(e.clientY - y0) > TAP_SLOP) cancel();
  });
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("click", e => { if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; } }, true);
  el.addEventListener("dblclick", e => { e.preventDefault(); onHold(); });
  el.addEventListener("contextmenu", e => { e.preventDefault(); onHold(); });
  // A category header already answers Enter and Space by folding up, so it
  // opts out rather than doing both at once.
  if (keys) el.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    onHold();
  });
}

/* ---------- the streak dialog ----------
   Adding one writes two things: the streak, and the daily card that feeds it.
   Editing one renames both, because the tile and the row are the same idea and
   letting them drift apart is how you end up with "Meditation" counting
   "Morning sit".

   MARK DONE takes the tile off the row and keeps the record; DELETE takes the
   streak away for good, and with it the card it created — but never a card that
   was already in the routine before the streak pointed at it. */
let streakEditing = null;   // streak id, or null while adding

function groupTitles() {
  const seen = [];
  for (const g of plan?.groups || []) if (!seen.includes(g.title)) seen.push(g.title);
  for (const g of dailyConfig.daily || []) if (!seen.includes(g.title)) seen.push(g.title);
  return seen.length ? seen : [TODO_GROUP];
}

function fillGroupSelect(value) {
  const sel = $("sGroup");
  sel.textContent = "";
  for (const title of groupTitles()) {
    const opt = document.createElement("option");
    opt.value = title; opt.textContent = title;
    sel.appendChild(opt);
  }
  sel.value = groupTitles().includes(value) ? value : TODO_GROUP;
}

function openStreakAdd() {
  streakEditing = null;
  $("sTitle").textContent = "ADD STREAK";
  $("sName").value = "";
  $("sKind").value = "build";
  $("sCard").value = "";
  $("sTarget").value = String(DEFAULT_TARGET);
  $("sCardWrap").hidden = false;
  $("sGroupWrap").hidden = false;
  fillGroupSelect(TODO_GROUP);
  $("sMinor").hidden = true;
  $("sScrim").hidden = false;
  focusSoon($("sName"));
}

function openStreakEdit(id) {
  const st = streaks.find(x => x.id === id);
  if (!st) return;
  streakEditing = id;
  $("sTitle").textContent = "EDIT STREAK";
  $("sName").value = st.name;
  $("sKind").value = st.kind;
  $("sTarget").value = String(st.target);
  const own = custom.added.find(a => a.id === st.itemId);
  const item = allItems().find(i => i.id === st.itemId);
  $("sCard").value = own ? own.text : (item ? item.text : "");
  // Only a card this page owns can be renamed or refiled from here; a routine
  // item belongs to the routine and is edited on its own row.
  $("sCardWrap").hidden = !own;
  $("sGroupWrap").hidden = !own;
  if (own) fillGroupSelect(own.group);
  $("sMinor").hidden = false;
  $("sScrim").hidden = false;
  focusSoon($("sName"));
}

function closeStreakModal() { $("sScrim").hidden = true; streakEditing = null; }

function saveStreakModal() {
  const name = $("sName").value.trim();
  if (!name) { $("sName").focus(); return; }
  const kind = $("sKind").value === "avoid" ? "avoid" : "build";
  const target = Math.max(1, Math.min(999, parseInt($("sTarget").value, 10) || DEFAULT_TARGET));
  const cardText = $("sCard").value.trim() || name;
  const group = $("sGroup").value || TODO_GROUP;

  if (streakEditing) {
    const st = streaks.find(x => x.id === streakEditing);
    if (!st) { closeStreakModal(); return; }
    Object.assign(st, { name, kind, target });
    const own = custom.added.find(a => a.id === st.itemId);
    if (own && !$("sCardWrap").hidden) {
      own.text = cardText;
      own.group = group;
      // The card records the slip for an avoid streak, so it reads inverted on
      // the list: ticked until the day you did the thing.
      if (kind === "avoid") own.invert = true; else delete own.invert;
      saveCustom();
    }
  } else {
    const itemId = newId();
    custom.added.push({
      id: itemId, text: cardText, emoji: "✅", xp: 10, group,
      scope: "daily", streakId: null, ...(kind === "avoid" ? { invert: true } : {})
    });
    const st = {
      id: "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name, kind, itemId, target, since: plan.date, done: null
    };
    // Marked on the card too, so deleting the streak knows which card it made.
    custom.added[custom.added.length - 1].streakId = st.id;
    streaks.push(st);
    saveCustom();
  }
  sync.pushStreaks();
  closeStreakModal();
  rebuild();
}

/* Finished, and off the row. The card it counts stays on the list — a run you
   completed is not a reason to stop doing the thing. */
function markStreakDone() {
  const st = streaks.find(x => x.id === streakEditing);
  if (!st) return;
  st.done = plan.date;
  sync.pushStreaks();
  closeStreakModal();
  rebuild();
  showToast(`“${st.name}” marked done`, () => {
    st.done = null;
    sync.pushStreaks();
    rebuild();
  });
}

function deleteStreak() {
  const st = streaks.find(x => x.id === streakEditing);
  if (!st) return;
  const at = streaks.indexOf(st);
  streaks.splice(at, 1);
  // Only a card this streak created goes with it. One that was already in the
  // routine is somebody's task, not this tile's private business.
  const cardAt = custom.added.findIndex(a => a.id === st.itemId && a.streakId === st.id);
  const card = cardAt >= 0 ? custom.added[cardAt] : null;
  if (card) { custom.added.splice(cardAt, 1); saveCustom(); }
  sync.pushStreaks();
  closeStreakModal();
  rebuild();
  showToast(`Removed “${st.name}”`, () => {
    streaks.splice(at, 0, st);
    if (card) { custom.added.push(card); saveCustom(); }
    sync.pushStreaks();
    rebuild();
  });
}

/* ---------- moving between days ---------- */
function renderDayNav() {
  const today = todayISO();
  const d = plan.date;
  const diff = daysBetween(today, d);
  const lbl = $("dayLbl");

  let head;
  if (diff === 0) head = "TODAY";
  else if (diff === -1) head = "YESTERDAY";
  else if (diff === 1) head = "TOMORROW";
  else head = prettyDate(d).toUpperCase().replace(/,/g, "");

  lbl.textContent = "";
  lbl.append(document.createTextNode(head));
  const small = document.createElement("small");
  const n = Math.abs(diff), unit = n === 1 ? "day" : "days";
  small.textContent = diff === 0 ? prettyDate(d) : (diff < 0 ? `${n} ${unit} ago` : `in ${n} ${unit}`);
  lbl.appendChild(small);

  $("dayToday").hidden = diff === 0;
}

async function goToDay(date) {
  viewDate = date;
  await rebuild();
}

/* Opening a dialog puts the keyboard in its first field, and the wait is what
   makes that work — focusing an element the same tick it is unhidden does
   nothing on iOS. The wait is also long enough to tap the second field in, and
   the focus would then jump back and type into the first one. So it stands
   down if the finger has already gone somewhere else in the same dialog. */
function focusSoon(el) {
  setTimeout(() => {
    const dialog = el.closest(".scrim");
    const active = document.activeElement;
    if (dialog && active && active !== el && dialog.contains(active)) return;
    el.focus();
  }, 30);
}

const isOneOff = id => (dailyConfig.oneOffs?.items || []).some(i => i.id === id);

function setTick(id, on) {
  const t = loadTicks(plan.date);
  if (on) t[id] = true; else delete t[id];
  saveTicks(plan.date, t);

  // A one-off is done for good, so say so explicitly rather than leaving it to
  // be re-inferred from day records that this browser may not have.
  if (isOneOff(id)) {
    if (on) custom.doneOnce[id] = plan.date;
    else delete custom.doneOnce[id];
    saveCustom();
  }

  /* An avoid streak's date is the durable record of the last slip, and it has
     to move with the tick that caused it. queued here, sent in flush()'s batch
     with the day record so the two can never end up disagreeing. */
  const avoided = liveStreaks().find(st => st.kind === "avoid" && st.itemId === id);
  if (avoided) updateTracker(id, on);

  /* Finishing a carried task is what stops it carrying: the day it was ticked
     is written on the task itself, so tomorrow simply does not draw it. */
  const carried = custom.added.find(a => a.id === id && a.carry);
  if (carried) {
    if (on) carried.done = plan.date; else delete carried.done;
    saveCustom();
  }

  /* An interval task records the day, and that day is the only thing that says
     when the next one is due — it is not worked out from the day records later.
     Ticking a past day writes that past day, and unticking takes it back off,
     which both land correctly because what is kept is a list. */
  const cycling = allItems().find(i => i.id === id && isInterval(i));
  if (cycling) {
    markInterval(id, plan.date, on);
    saveCustom();
  }

  const item = allItems().find(i => i.id === id);
  const row = rowEls.get(id);
  if (row) row.classList.toggle("done", item?.invert ? !on : on);
  // xpEarned is kept locally too, so lifetime XP still adds up signed out.
  saveDayMeta(plan.date, { xpEarned: todayXp() });
  refreshDerived();
  sync.queueTick(plan.date, id, on);
}

/* Works out what the tracker date should become after this tick, without
   writing anything itself: flush() sends it in the same batch as the tick, so
   the day record and the tracker can never end up disagreeing.

   Ticking only ever moves the date forward — a backdated entry older than what
   is already recorded must not erase real clean days. Unticking only matters
   when the day being undone is the one currently recorded; any other day's
   untick cannot change what the most recent one was.

   Undoing the recorded day needs the next-most-recent one, and that is a
   question only the server can answer, so it is marked here and resolved in
   flush(). */
function updateTracker(itemId, on) {
  const recorded = trackerDates.get(itemId);
  if (on) {
    if (isISODate(recorded) && plan.date <= recorded) return;
    trackerDates.set(itemId, plan.date);
    sync.trackerPending = { ...(sync.trackerPending || {}), [itemId]: { set: plan.date } };
  } else {
    if (plan.date !== recorded) return;
    trackerDates.set(itemId, undefined);            // unknown until the server answers
    sync.trackerPending = { ...(sync.trackerPending || {}), [itemId]: { recoverBefore: plan.date } };
  }
  renderStreaks();
}

/* shared/firebase.js and shared/account.js, once init() has pulled them in. */
let fbLib = null, accountLib = null;

/* The parts of this page the account is allowed to see. Everything on until
   the answer arrives, which is what an account nobody has been through the
   extra settings for gets anyway. */
/* Interval tasks are the exception: they start off, and an account is given
   them deliberately. The others are the page as it has always looked, so they
   stand until the answer says otherwise. */
let extras = { xp: true, priority: true, streaks: true, intervals: false };
function applyExtras() {
  document.body.classList.toggle("no-xp", extras.xp === false);
  document.body.classList.toggle("no-priority", extras.priority === false);
  document.body.classList.toggle("no-streaks", extras.streaks === false);
  /* Only the way to make one is switched off. A task that already cycles keeps
     cycling either way — hiding the option is not a reason to start showing
     something every day that is meant to come round every fortnight. */
  $("mEveryOpt").hidden = extras.intervals !== true;
  if (extras.intervals !== true && $("mScope").value === "every") {
    $("mScope").value = "today";
    syncEveryField();
  }
}

/* ================= sync layer =================
   Firebase decides what this page shows. Without a signed-in account there is
   no day, no counter and no list — see setAuthState(). Nothing here may throw
   upward. */
const sync = {
  mode: "local",
  uid: null,
  fb: null,
  unsub: null,
  timer: null,
  queue: new Map(),
  queueDate: null,
  flushDate: null,        // a flush past its queue but not yet handed to Firestore
  xpTimer: null,
  xpPending: null,
  prefsTimer: null,
  trackerUnsub: null,
  trackerPending: null,   // { itemId: { set } | { recoverBefore } }, resolved in flush()
  lastRefresh: 0,         // throttles refreshAll(), see there

  /* The strip is only on screen when it has something to say. Signed in and
     syncing there is nothing to report and no button left on it — signing out
     is the home page's — so the day ends with the list. */
  setUI(state, msg, btnLabel, btnAction) {
    const row = $("sync"), btn = $("authBtn");
    row.className = "sync" + (state === "on" ? " on" : state === "err" ? " err" : "");
    row.hidden = state === "on";
    $("syncMsg").textContent = msg;
    if (btnLabel) { btn.hidden = false; btn.textContent = btnLabel; btn.onclick = btnAction; }
    else { btn.hidden = true; btn.onclick = null; }
  },

  /* The gate. "in" is the only state that shows anything personal; the markup
     ships as "checking" so a cached page can't flash yesterday's list before
     Firebase has said who is looking. */
  setAuthState(state) { $("wrap").dataset.auth = state; },

  /* Signing out has to leave nothing of the account behind — not on screen, not
     in memory, and not queued to be written. There is no longer a localStorage
     copy to worry about: emptying `mem` is the whole of it. */
  teardown() {
    clearTimeout(this.timer);
    clearTimeout(this.xpTimer);
    clearTimeout(this.prefsTimer);
    this.queue.clear();
    this.queueDate = null;
    this.flushDate = null;
    this.xpPending = null;
    this.trackerPending = null;
    this.customPending = false;
    this.lastRefresh = 0;
    history.clear();
    rowEls.clear();
    secEls.clear();
    mem.ticks.clear();
    mem.meta.clear();
    mem.priority.clear();
    mem.xpMonth.clear();
    mem.peak = 0;
    dailyConfig = emptyPlan();
    extras = { xp: true, priority: true, streaks: true, intervals: false };
    applyExtras();
    collapsedGroups = new Set();
    custom = { added: [], hidden: {}, doneOnce: {}, edits: {}, intervals: {} };
    plan = null;
    viewDate = null;
    streaks = [];
    trackerDates = new Map();
    streakEditing = null;
    $("streakRow").textContent = "";
    lastRendered = null;
    priorityEditDate = null;
    $("list").textContent = "";
    reordering = false;
    categoryEditing = null;
    document.body.classList.remove("reordering");
    for (const id of ["streaks", "level", "priorityWrap", "scrim", "sScrim", "cScrim", "listTools"]) {
      $(id).hidden = true;
    }
  },

  /* Connecting, and knowing who is signed in, is shared/firebase.js's job now.
     What a failure says, and the gate it leaves the page in, stays here — the
     other sections word both differently on purpose. */
  async init() {
    try {
      [fbLib, accountLib] = await Promise.all([
        import("../shared/firebase.js"),
        import("../shared/account.js")
      ]);
      this.fb = await fbLib.connect();
    } catch (e) {
      this.setAuthState("err");
      if (e && e.code === "no-config") {
        this.setUI("err", "Sync isn't configured, so there's nothing to show here.",
          "Reload", () => location.reload());
      } else {
        console.warn("Firebase unavailable:", e);
        this.setUI("err", "Couldn't reach Firebase, so there's nothing to show here.",
          "Reload", () => location.reload());
      }
      return;
    }
    this.mode = "signed-out";
    fbLib.watchAuth(this.fb, u => this.onAuth(u));
  },

  async onAuth(user) {
    if (this.unsub) { this.unsub(); this.unsub = null; }
    if (this.trackerUnsub) { this.trackerUnsub(); this.trackerUnsub = null; }
    if (!user) {
      this.uid = null; this.mode = "signed-out";
      this.teardown();
      this.setAuthState("out");
      this.setUI("off", "Sign in to see your day.",
        "Sign in with Google", () => this.signIn());
      return;
    }
    this.uid = user.uid; this.mode = "signed-in";
    this.setUI("on", `Syncing as ${user.email || "your account"}`);
    // Anything still queued from a token refresh goes up FIRST, so the
    // read-back below can't overwrite it with an older server copy.
    this.flush();
    if (this.customPending) await this.pushCustom();
    // The day is built here rather than at boot: everything below reads
    // plan.date, and until an account is known there is no day to build. The
    // added tasks and the folded sections belong to the account rather than to
    // this device, so both are fetched before the first paint instead of being
    // corrected after it.
    // The routine first: everything below derives a day from it.
    await Promise.all([this.loadPlan(), this.loadExtras()]);
    await Promise.all([this.loadPrefs(), this.loadCustomRemote({ reconcile: false }),
                       this.loadStreaks()]);
    await rebuild();
    this.setAuthState("in");
    this.attach();
    this.loadHistory();
    this.loadXp();
    this.attachTrackers();
    this.loadTrackers();
  },

  /* ---------- lifetime XP ----------
     A month total and a peak, both whole-value writes with no merge — they are
     recomputed figures, not accumulating maps, so the no-merge rule that guards
     the ticks applies here for the same reason. */
  xpRef(id) {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "xp", id);
  },

  queueXp(monthKeyStr, total, peak) {
    if (this.mode !== "signed-in") return;
    this.xpPending = { monthKeyStr, total, peak };
    clearTimeout(this.xpTimer);
    this.xpTimer = setTimeout(() => this.flushXp(), 800);
  },

  async flushXp() {
    clearTimeout(this.xpTimer);
    if (this.mode !== "signed-in" || !this.xpPending) return;
    const { monthKeyStr, total, peak } = this.xpPending;
    this.xpPending = null;
    const { f } = this.fb;
    try {
      await Promise.all([
        f.setDoc(this.xpRef(monthKeyStr),
          { month: monthKeyStr, total, updatedAt: f.serverTimestamp() }),
        f.setDoc(this.xpRef("peak"), { peakXp: peak, updatedAt: f.serverTimestamp() })
      ]);
    } catch { /* offline — the local copy stands and the next tick retries */ }
  },

  /* Pull the other devices' months in, then let bumpPeak() re-derive. Peak is
     reconciled as a max, so it needs no conflict resolution. */
  async loadXp() {
    const { f, db } = this.fb;
    try {
      const snap = await f.getDocs(f.collection(db, "users", this.uid, "xp"));
      let remotePeak = 0;
      snap.forEach(d => {
        const v = d.data();
        if (d.id === "peak") { remotePeak = v.peakXp || 0; return; }
        if (!/^\d{4}-\d{2}$/.test(d.id)) return;
        // The month in view is authoritative locally — it is being edited now.
        if (plan && d.id === monthKey(plan.date)) return;
        mem.xpMonth.set(d.id, Number(v.total) || 0);
      });
      if (remotePeak > loadPeak()) mem.peak = remotePeak;
      renderLevel();
    } catch (e) {
      console.warn("XP totals unavailable:", e);
    }
  },

  /* ---------- trackers (e.g. last-smoked date) ----------
     One small doc holding one field per tracker, merge-written so a future
     second tracker can add its own key without a write to one clobbering the
     other's field. That is the whole reason this collection breaks the
     no-merge rule: every write here only ever names its own key.

     Live-subscribed, unlike xp/ above — this is the piece that used to go
     stale on another open tab until you navigated to the exact day that
     changed. */
  trackerRef() {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "config", "trackers");
  },

  /* One document read per sign-in, and that is the normal cost of the tiles.
     The query below runs only for a streak whose field is missing and which
     has no start date of its own — in practice the one carried over from the
     single counter this replaced, which repairs itself once because the answer
     is written back. A streak added here always records the day it started, so
     it never asks. */
  async loadTrackers() {
    const { f } = this.fb;
    const avoid = liveStreaks().filter(st => st.kind === "avoid");
    if (!avoid.length) return;
    try {
      // Server first, cache second — the same shape attach() uses. A cached
      // copy would render a number that the listener then corrects a moment
      // later, and the flicker reads as the bug this is fixing.
      const snap = await fbLib.readDoc(f, this.trackerRef());
      const data = snap.exists() ? snap.data() : {};
      for (const st of avoid) {
        const raw = data[st.itemId];
        if (isISODate(raw)) { trackerDates.set(st.itemId, raw); continue; }
        if (st.since) { trackerDates.set(st.itemId, null); continue; }
        const found = await this.recoverLast(st.itemId);
        trackerDates.set(st.itemId, found);
        if (found) await this.writeTracker(st.itemId, found);
      }
      renderStreaks();
    } catch (e) {
      console.warn("Tracker read failed:", e.code || e.message);
    }
  },

  /* The most recent day a card was ticked, or null if there is none — one
     document, never a walk through the history window.

     `before` narrows it to days strictly earlier than that date, which is what
     unticking the recorded day needs in order to fall back to the one before
     it. Read from the server on purpose: the local cache can be arbitrarily
     stale, and this answer decides whether a real date gets erased.

     Ordering by the tick field before the document id reads as redundant, the
     filter having already pinned it to true. It is what keeps the query on
     Firestore's automatic index, so no composite index has to exist for it. */
  async recoverLast(itemId, before) {
    const { f, db } = this.fb;
    const days = f.collection(db, "users", this.uid, "days");
    const tick = new f.FieldPath("ticks", itemId);
    const only = [f.where(tick, "==", true)];
    if (before) only.push(f.where(f.documentId(), "<", f.doc(days, before)));
    const snap = await fbLib.readDocs(f, f.query(days, ...only,
      f.orderBy(tick, "desc"), f.orderBy(f.documentId(), "desc"), f.limit(1)));
    return snap.empty ? null : snap.docs[0].id;
  },

  /* Only for the repair above. A tick's own tracker write rides in flush()'s
     batch instead, so the day record and this field move together. */
  async writeTracker(itemId, date) {
    const { f } = this.fb;
    await f.setDoc(this.trackerRef(),
      { [itemId]: date || f.deleteField(), updatedAt: f.serverTimestamp() },
      { merge: true });
  },

  attachTrackers() {
    if (this.trackerUnsub) { this.trackerUnsub(); this.trackerUnsub = null; }
    const { f } = this.fb;
    this.trackerUnsub = f.onSnapshot(this.trackerRef(),
      snap => {
        /* Server-confirmed state only. This replaces a flag that held off any
           snapshot while a write was queued: the flag could be left standing
           after the write had already landed, locking out a perfectly good
           remote value. hasPendingWrites clears itself, so the server always
           gets the last word and a cached copy never does. */
        if (snap.metadata.hasPendingWrites) return;
        const data = snap.exists() ? snap.data() : {};
        let moved = false;
        for (const st of liveStreaks()) {
          if (st.kind !== "avoid") continue;
          const raw = data[st.itemId];
          const remote = isISODate(raw) ? raw : null;
          if (remote === trackerDates.get(st.itemId)) continue;
          trackerDates.set(st.itemId, remote);
          moved = true;
        }
        if (moved && plan) renderStreaks();
      },
      e => console.warn("Tracker sync dropped:", e.code || e.message));
  },

  /* ---------- the streaks themselves ----------
     One small list, written whole: it is read back off what is on screen, and
     it changes only when somebody opens the dialog.

     An account that has the old single weed counter and no list yet gets one
     written for it, pointing at the card already in its routine. That is the
     only migration here, and it runs once — afterwards the document exists and
     this does nothing. */
  streaksRef() {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "config", "streaks");
  },

  async loadStreaks() {
    const { f } = this.fb;
    let v = null;
    try {
      const snap = await fbLib.readDoc(f, this.streaksRef());
      if (snap.exists()) v = snap.data();
    } catch (e) {
      console.warn("Streaks unavailable:", e.code || e.message);
      return;
    }
    if (v && Array.isArray(v.items)) {
      streaks = v.items.map(normaliseStreak).filter(Boolean);
      return;
    }
    streaks = this.migrateStreaks();
    if (streaks.length) await this.pushStreaks();
  },

  /* The counter this section used to have was one hard-coded card id. If the
     account's routine still holds it, it becomes the first streak rather than
     disappearing with the code that drew it. */
  migrateStreaks() {
    const legacy = (dailyConfig.daily || []).flatMap(g => g.items || [])
      .find(i => i.id === "r-smoked-weed");
    if (!legacy) return [];
    return [{ id: "s-weed", name: "No weed", kind: "avoid",
              itemId: "r-smoked-weed", target: DEFAULT_TARGET, since: null, done: null }];
  },

  async pushStreaks() {
    if (this.mode !== "signed-in") return;
    const { f } = this.fb;
    try {
      await f.setDoc(this.streaksRef(),
        { items: streaks, updatedAt: f.serverTimestamp() });
    } catch (e) {
      this.setUI("err", `Couldn't save the streak (${e.code || e.message}). Saved on this device.`,
        "Retry", () => this.pushStreaks());
    }
  },

  /* The popup, its redirect fallback and the wording of a failed sign-in are
     shared/firebase.js's. Where any of it appears is this page's status line. */
  async signIn() {
    const msg = await fbLib.signIn(this.fb, text => this.setUI("off", text));
    if (msg) this.setUI("err", msg, "Try again", () => this.signIn());
  },

  async signOut() {
    try { await fbLib.signOut(this.fb); }
    catch (e) { this.setUI("err", `Couldn't sign out (${e.message}).`, "Try again", () => this.signOut()); }
  },

  ref(date) {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "days", date);
  },

  /* Stored alongside the ticks so the history stands on its own later. `items`
     is the denominator — without the list that was on offer that day, a count of
     ticks can't be read as good or bad. `xpEarned` is stored because past days'
     XP can't be recomputed once their plan is gone. */
  meta() {
    return {
      date: plan.date,
      dayOfPlan: plan.dayOfPlan ?? null,
      week: plan.week ?? null,
      items: allItems().map(i => i.id),
      xpEarned: todayXp(),
      ticked: todayTicked()
    };
  },

  async ensureMeta(data, date) {
    const m = this.meta();
    const unchanged =
      data.date === m.date && data.dayOfPlan === m.dayOfPlan && data.week === m.week &&
      data.xpEarned === m.xpEarned && data.ticked === m.ticked &&
      JSON.stringify(data.items || []) === JSON.stringify(m.items);
    if (unchanged) return;
    try { await this.fb.f.updateDoc(this.ref(date), m); } catch {}
  },

  /* One question asked in two places: is this device holding a change to
     `date` that Firestore has not been told about yet? While that is true a
     snapshot can't be trusted to contain it, and adopting one would undo it.
     Covers queueTick()'s 500ms debounce and the lookup flush() does before its
     batch — that lookup is a round trip with the queue already emptied, so
     without flushDate an untick would be re-adopted from the server mid-flight. */
  writesPending(date) {
    return (this.queue.size > 0 && this.queueDate === date) || this.flushDate === date;
  },

  adopt(ticks, date) {
    saveTicks(date, ticks);
    // A snapshot already in flight can land after sign-out tore the day down.
    if (!plan || plan.date !== date) return;
    // Our own writes echo back through onSnapshot; rebuilding the list for a
    // state it already shows would flash the rows for nothing.
    if (JSON.stringify(ticks) === lastRendered) return;
    render();
  },

  adoptPriority(value, date) {
    const record = normalisePriority(value);
    if (!record) return false;
    savePriorityLocal(date, record);
    if (plan && plan.date === date && priorityEditDate !== date) renderPriority();
    return true;
  },

  priorityFields(date) {
    const record = loadPriority(date);
    if (!record) return {};
    return { priority:record, priorityUpdatedAt:this.fb.f.serverTimestamp() };
  },

  async pushPriority(date, record = loadPriority(date)) {
    if (this.mode !== "signed-in" || !record) return;
    const { f } = this.fb;
    try {
      await f.setDoc(this.ref(date), {
        priority:record,
        priorityUpdatedAt:f.serverTimestamp()
      }, { merge:true });
    } catch (e) {
      this.setUI("err", `Couldn't sync the priority (${e.code || e.message}). Saved on this device.`,
        "Retry", () => this.pushPriority(date, record));
    }
  },

  /* The merge-write everywhere else here cannot express "this field is gone",
     so the delete is explicit. Without it an undone dismissal would be handed
     straight back by the next read. */
  async dropPriority(date) {
    if (this.mode !== "signed-in") return;
    const { f } = this.fb;
    try {
      await f.setDoc(this.ref(date), {
        priority:f.deleteField(),
        priorityUpdatedAt:f.serverTimestamp()
      }, { merge:true });
    } catch (e) {
      this.setUI("err", `Couldn't sync the priority (${e.code || e.message}). Saved on this device.`,
        "Retry", () => this.dropPriority(date));
    }
  },

  async reconcilePriority(data, date) {
    if (this.adoptPriority(data.priority, date)) return;
    const local = loadPriority(date);
    if (local) await this.pushPriority(date, local);
  },

  async attach() {
    const { f } = this.fb;
    const date = plan.date;
    const ref = this.ref(date);
    try {
      const snap = await fbLib.readDoc(f, ref);
      if (snap.exists()) {
        const data = snap.data();
        // Same guard the live listener uses: a tick still on its way up must not
        // be undone by the copy we just read back.
        if (!this.writesPending(date)) this.adopt(data.ticks || {}, date);
        await this.ensureMeta(data, date);
        await this.reconcilePriority(data, date);
      } else {
        await f.setDoc(ref, {
          ticks: loadTicks(date), ...this.meta(),
          ...this.priorityFields(date),
          createdAt: f.serverTimestamp(), updatedAt: f.serverTimestamp()
        });
      }
    } catch (e) {
      this.setUI("err", `Sync read failed (${e.code || e.message}). Ticks are still saved locally.`,
        "Retry", () => this.attach());
      return;
    }
    this.unsub = f.onSnapshot(ref,
      s => {
        if (this.writesPending(date)) return;
        const data = s.exists() ? s.data() : {};
        this.adopt(data.ticks || {}, date);
        if (data.priority) this.adoptPriority(data.priority, date);
      },
      e => this.setUI("err", `Live sync dropped (${e.code || e.message}). Ticks are still saved locally.`,
        "Reconnect", () => { this.onAuth(this.fb.auth.currentUser); })
    );
  },

  /* Your added / edited / removed tasks, so they follow you between devices.
     One small document, written whole — it's tiny and rarely changes. */
  customRef() {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "config", "custom");
  },

  /* An edit made before onAuthStateChanged has answered is remembered rather
     than dropped, and sent from onAuth(). Losing it is what let removed tasks
     come back: the removal had reached nothing yet, and the sign-in read put
     the older remote copy back on top of it. */
  customPending: false,

  async pushCustom() {
    if (this.mode !== "signed-in") { this.customPending = true; return; }
    const { f } = this.fb;
    this.customPending = false;
    try {
      await f.setDoc(this.customRef(), { ...custom, updatedAt: f.serverTimestamp() });
    } catch (e) {
      this.customPending = true;
      this.setUI("err", `Couldn't save your changes to sync (${e.code || e.message}). Saved on this device.`,
        "Retry", () => this.pushCustom());
    }
  },

  /* Merged, never replaced. Replacing wholesale meant any removal or edit made on
     this device while signed out was destroyed the moment the remote copy arrived.
     Removals and completed one-offs are unions — something dismissed on any device
     stays dismissed — and the merged result is pushed back so both sides converge. */
  /* Two different jobs behind one read.
     At sign-in (`reconcile`) this device may hold items the server has never
     seen, so local wins and the merged result is pushed straight back.
     On a later refresh that same rule is destructive: every local edit is
     already pushed the moment it's made, so anything present only on the
     server is a *newer* change from another device — re-asserting the local
     copy over it would delete a task renamed on the phone the instant the
     laptop tab regained focus, and then the phone would undo it right back.
     So a refresh takes the server's version and pushes nothing. */
  async loadCustomRemote({ reconcile = true } = {}) {
    if (this.mode !== "signed-in") return;
    // Local edits that never made it up must not be overwritten by an older
    // server copy; pushCustom() will carry them and this can run again after.
    if (!reconcile && this.customPending) return;
    const { f } = this.fb;
    try {
      const snap = await fbLib.readDoc(f, this.customRef());

      const v = snap.exists() ? snap.data() : {};

      if (!reconcile) {
        custom = {
          added:     Array.isArray(v.added) ? v.added : [],
          hidden:    v.hidden    || {},
          doneOnce:  v.doneOnce  || {},
          edits:     v.edits     || {},
          intervals: v.intervals || {}
        };
        saveCustom({ push: false });
        rebuild();
        return;
      }

      const byId = new Map();
      for (const a of (v.added || [])) byId.set(a.id, a);
      for (const a of custom.added) byId.set(a.id, a);   // this device's version wins

      /* Completions merge per task, not per document: two devices that each
         ticked a different day of the same task both did something real, and
         taking one side's list whole would throw the other away. */
      const bothWays = (mine, theirs) => {
        const ids = new Set([...Object.keys(theirs || {}), ...Object.keys(mine || {})]);
        return Object.fromEntries([...ids].map(id => [id,
          [...new Set([...((theirs || {})[id] || []), ...((mine || {})[id] || [])])]
            .sort().slice(-INTERVAL_KEEP)]));
      };

      custom = {
        added: [...byId.values()],
        hidden:    { ...(v.hidden   || {}), ...custom.hidden   },
        doneOnce:  { ...(v.doneOnce || {}), ...custom.doneOnce },
        edits:     { ...(v.edits    || {}), ...custom.edits    },
        intervals: bothWays(custom.intervals, v.intervals)
      };
      saveCustom({ push: false });
      rebuild();
      await this.pushCustom();
    } catch { /* offline — the local copy stands */ }
  },

  /* ---------- the switches inside this section ----------
     Set in admin/, read here. Nothing about the day depends on them, so a
     failed read leaves the page as it is rather than blanking half of it. */
  async loadExtras() {
    const features = await accountLib.loadFeatures(this.fb, this.uid);
    if (!features) return;
    extras = features.extras.dailyplan || extras;
    applyExtras();
  },

  /* ---------- the routine ----------
     What the day is made of: the categories, their items, and the date day one
     is counted from. This used to be daily.json, a file in the repository, which
     meant every account that signed in was shown Nikita's medication and his
     weed tracker. It is one person's routine, so it lives with the person.

     An account without one gets an empty routine written for it, dated today.
     That is what a new person should open: nothing on the list, day one today,
     and the add button to fill it in. */
  planRef() {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "config", "plan");
  },

  async loadPlan() {
    const { f } = this.fb;
    let v = null;
    try {
      // Server first, cache second — the same shape attach() uses.
      const snap = await fbLib.readDoc(f, this.planRef());
      if (snap.exists()) v = snap.data();
    } catch (e) {
      // Leave whatever is already loaded rather than blanking a working page.
      console.warn("Routine unavailable:", e.code || e.message);
      return;
    }
    if (!v) {
      v = emptyPlan();
      try { await f.setDoc(this.planRef(), { ...v, updatedAt: f.serverTimestamp() }); }
      catch { /* offline — written on the next sign-in, and empty until then */ }
    }
    dailyConfig = {
      schemaVersion: v.schemaVersion || 1,
      startDate: isISODate(v.startDate) ? v.startDate : todayISO(),
      principles: v.principles || null,
      daily: withTodo(Array.isArray(v.daily) ? v.daily : []),
      oneOffs: v.oneOffs || null
    };
  },

  /* The routine is written from here now — categories are added, renamed,
     removed and reordered on this page, and a task dragged between them moves
     inside it. Written whole rather than merged: it is read back off what is
     on screen, and a merge would leave a removed category's items behind. */
  async pushPlan() {
    if (this.mode !== "signed-in") return;
    const { f } = this.fb;
    try {
      await f.setDoc(this.planRef(), { ...dailyConfig, updatedAt: f.serverTimestamp() });
    } catch (e) {
      this.setUI("err", `Couldn't save the categories (${e.code || e.message}). Saved on this device.`,
        "Retry", () => this.pushPlan());
    }
  },

  /* ---------- page preferences ----------
     One small document holding the sections folded up. Written whole rather
     than merged: it is read back off what is on screen, so there is nothing
     another device could be holding that a whole-value write would lose. */
  prefsRef() {
    const { f, db } = this.fb;
    return f.doc(db, "users", this.uid, "config", "prefs");
  },

  async loadPrefs() {
    const { f } = this.fb;
    try {
      // Server first, cache second — the same shape attach() uses, so the
      // sections don't unfold a moment after the list appears.
      const snap = await fbLib.readDoc(f, this.prefsRef());
      const v = snap.exists() ? snap.data() : {};
      collapsedGroups = new Set((Array.isArray(v.collapsed) ? v.collapsed : [])
        .filter(title => typeof title === "string"));
    } catch (e) {
      console.warn("Preferences unavailable:", e.code || e.message);
    }
  },

  /* Folding four sections one after another is four taps and one write. */
  pushPrefs() {
    if (this.mode !== "signed-in") return;
    clearTimeout(this.prefsTimer);
    this.prefsTimer = setTimeout(() => this.flushPrefs(), 600);
  },

  async flushPrefs() {
    clearTimeout(this.prefsTimer);
    if (this.mode !== "signed-in") return;
    const { f } = this.fb;
    try {
      await f.setDoc(this.prefsRef(), {
        collapsed: [...collapsedGroups],
        updatedAt: f.serverTimestamp()
      });
    } catch { /* offline — the next toggle sends both fields again */ }
  },

  /* One bounded query per page load rather than a growing scan. */
  async loadHistory() {
    const { f, db } = this.fb;
    try {
      const q = f.query(
        f.collection(db, "users", this.uid, "days"),
        f.orderBy(f.documentId(), "desc"),
        f.limit(HISTORY_DAYS)
      );
      const snap = await f.getDocs(q);
      history.clear();
      snap.forEach(d => {
        const v = d.data();
        history.set(d.id, {
          xpEarned: v.xpEarned || 0,
          // Tick keys are retained for one-off suppression and history.
          ticks: v.ticks || {},
          ticked: typeof v.ticked === "number"
            ? v.ticked
            : Object.values(v.ticks || {}).filter(Boolean).length
        });
      });
      this.seedIntervals();
      rebuild();
    } catch (e) {
      console.warn("History unavailable:", e);
    }
  },

  /* One-time, per task: interval tasks used to leave no record of their own —
     the day records were the record — so the first load after this shipped has
     to lift what is in them, or every cycle would restart from today and
     microneedling done last week would come due again tomorrow.

     It runs off the history that has just loaded and writes once. After that
     the completions are their own record and this finds nothing left to do. */
  seedIntervals() {
    if (this.mode !== "signed-in") return;
    const cycling = [
      ...(dailyConfig.daily || []).flatMap(g => g.items || []),
      ...custom.added
    ].filter(isInterval);

    let found = false;
    for (const it of cycling) {
      if (completions(it.id).length) continue;
      const done = [];
      for (const [date, h] of history) if (h.ticks && h.ticks[it.id]) done.push(date);
      if (!done.length) continue;
      done.sort();
      custom.intervals = { ...(custom.intervals || {}), [it.id]: done.slice(-INTERVAL_KEEP) };
      found = true;
    }
    if (found) saveCustom();
  },

  /* Queued whatever the auth state is. A tick made before onAuthStateChanged
     has fired used to be dropped here and then overwritten by the server's copy
     on sign-in, which is how ticked one-offs came back. The gate makes that
     window much narrower — there is no list to tick until an account is known —
     but a token refresh can still re-enter onAuth() with writes outstanding,
     and recording the intent costs nothing. */
  queueTick(date, id, on) {
    if (this.queueDate !== date) { this.queue.clear(); this.queueDate = date; }
    this.queue.set(id, on);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 500);
  },

  /* Signed out the queue just sits there and waits — it is flushed from onAuth()
     before anything reads the server back. */
  async flush() {
    clearTimeout(this.timer);
    if (this.mode !== "signed-in") return;
    const tracker = this.trackerPending;
    if (!this.queue.size && !(tracker && Object.keys(tracker).length)) return;
    const { f, db } = this.fb;
    const date = this.queueDate;
    const edits = new Map(this.queue);

    /* Held from here until the batch has been handed to Firestore. In that
       window this device knows about the edit and Firestore does not, which is
       exactly what the day listener's guard covers for an ordinary tick —
       and emptying the queue on the next line would otherwise open it for the
       whole round trip the lookup below takes. */
    this.flushDate = date;
    this.queue.clear();
    this.trackerPending = null;

    /* Put the queued work back where it came from, so Retry sends the tick and
       the tracker together rather than one without the other. */
    const requeue = () => {
      this.flushDate = null;
      for (const [id, on] of edits) if (!this.queue.has(id)) this.queue.set(id, on);
      if (edits.size) this.queueDate = date;
      if (tracker) this.trackerPending = { ...tracker, ...(this.trackerPending || {}) };
    };

    /* Resolved before the batch is opened rather than inside it: replacing an
       unticked date with the one before it is a server query, and a batch can
       only be assembled from answers already in hand. */
    const trackerFields = {};
    if (tracker) {
      try {
        for (const [itemId, intent] of Object.entries(tracker)) {
          trackerFields[itemId] = "set" in intent
            ? intent.set
            : await this.recoverLast(itemId, intent.recoverBefore);
        }
      } catch (e) {
        requeue();
        await this.loadTrackers();  // show what the server actually holds
        this.setUI("err", `Couldn't check the streak history (${e.code || e.message}). Not saved.`,
          "Retry", () => this.flush());
        return;
      }
    }

    const args = [];
    for (const [id, on] of edits) args.push(new f.FieldPath("ticks", id), on ? true : f.deleteField());
    args.push("xpEarned", todayXp(), "ticked", todayTicked(), "updatedAt", f.serverTimestamp());

    /* One batch, so the day record and the tracker can never disagree — a tick
       that saved without its date, or a date without its tick, is precisely the
       split that made two devices show two different counts. */
    const addTracker = batch => {
      if (!tracker) return;
      const fields = { updatedAt: f.serverTimestamp() };
      for (const [itemId, date] of Object.entries(trackerFields)) {
        fields[itemId] = date || f.deleteField();
      }
      batch.set(this.trackerRef(), fields, { merge: true });
    };

    /* Released once commit() has been called rather than when the server
       acknowledges it: from that moment the mutation is in Firestore's pending
       set and every snapshot carries it. Waiting for the ack would hold the
       guard open forever offline, where commit() never settles. */
    try {
      const batch = f.writeBatch(db);
      if (edits.size) batch.update(this.ref(date), ...args);
      addTracker(batch);
      const committed = batch.commit();
      this.flushDate = null;
      await committed;
    } catch (e) {
      if (e.code === "not-found") {
        // The day has no document yet, so there is nothing to update into.
        try {
          this.flushDate = date;
          const batch = f.writeBatch(db);
          batch.set(this.ref(date), {
            ticks: loadTicks(date), ...this.meta(),
            ...this.priorityFields(date),
            createdAt: f.serverTimestamp(), updatedAt: f.serverTimestamp()
          });
          addTracker(batch);
          const committed = batch.commit();
          this.flushDate = null;
          await committed;
          return;
        } catch (e2) { e = e2; }
      }
      requeue();
      if (tracker) await this.loadTrackers();   // never leave a rejected value on screen
      this.setUI("err", `Couldn't save to sync (${e.code || e.message}). Saved locally.`,
        "Retry", () => this.flush());
    }
  },

  /* Unused since the Clear button was removed. Kept because it is the only
     merge-safe way to wipe a day without taking its priority with it. */
  async clearDay(date) {
    if (this.mode !== "signed-in") return;
    this.queue.clear();
    clearTimeout(this.timer);
    const { f } = this.fb;
    try {
      // Merge instead of replacing the day document: clearing ticks must not
      // erase its priority or future date-scoped fields.
      await f.setDoc(this.ref(date),
        { ticks: {}, ...this.meta(), updatedAt: f.serverTimestamp() },
        { merge:true });
    } catch (e) {
      this.setUI("err", `Couldn't clear on sync (${e.code || e.message}). Cleared locally.`,
        "Retry", () => this.clearDay(date));
    }
  },

  async resync() {
    if (this.mode !== "signed-in") return;
    await this.flush();
    const { f } = this.fb;
    try {
      const snap = await fbLib.readDoc(f, this.ref(plan.date));
      const data = snap.exists() ? snap.data() : {};
      this.adopt(data.ticks || {}, plan.date);
      if (data.priority) this.adoptPriority(data.priority, plan.date);
    } catch { /* offline; the listener catches up on reconnect */ }
  },

  /* resync() above covers the day in view, which also has a live listener.
     Everything else here is read once at sign-in and never again: the 90-day
     history the streaks are counted from, the XP
     month totals, and the custom edits. A page left open — or a home-screen
     app, which is never really closed — would keep showing all of that as it
     was hours or days ago. Returning to the page is exactly when a stale copy
     becomes visible, so that is when to re-read it.

     The heavier reloads are held back while a dialog or a priority
     edit is open, since each one ends in a render() that would take the open
     field with it. The day resync still runs: it flushes queued ticks before
     it reads, so it can't read past a tick still on its way up.

     Throttled, and awaited in sequence. Each reload ends in a render(), and
     render() runs bumpPeak(), which queues an XP write — so an unthrottled
     handler turned every tab focus into a few Firestore writes with nothing
     changed. Sequencing them also stops two rebuild()s racing and firing
     duplicate override fetches. */
  async refreshAll() {
    if (this.mode !== "signed-in") return;
    await this.resync();
    if (!$("scrim").hidden || !$("sScrim").hidden || !$("cScrim").hidden) return;
    if (priorityEditDate || reordering) return;
    const now = Date.now();
    if (now - this.lastRefresh < 45000) return;
    this.lastRefresh = now;
    await this.loadExtras();
    await this.loadPlan();
    // Custom before history: loadHistory() seeds any interval task that has no
    // completions of its own yet, and it should be reading the account's own
    // list when it decides there are none — not a copy this tab has been
    // holding since the last refresh.
    await this.loadCustomRemote({ reconcile: false });
    await this.loadStreaks();
    await this.loadHistory();
    await this.loadXp();
    // Only when a tile never got an answer. null is settled — nothing on
    // record — and re-querying it on every focus would buy nothing.
    if (liveStreaks().some(st => st.kind === "avoid" && trackerDates.get(st.itemId) === undefined)) {
      await this.loadTrackers();
    }
  },

  watchLifecycle() {
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") this.flush();
      else this.refreshAll();
    });
    window.addEventListener("pagehide", () => this.flush());
    window.addEventListener("online", () => this.resync());
  },

  reattach() {
    if (this.mode !== "signed-in") return;
    if (this.unsub) { this.unsub(); this.unsub = null; }
    this.attach();
  }
};

/* ---------- load ----------
   The routine comes from the account, in sync.loadPlan(). The page derives the
   day from it, so it can no longer go stale waiting for someone to publish a
   new list. An override file is the rare escape hatch for a day that needs
   something the rules can't express. */
async function rebuild() {
  const prevDate = plan && plan.date;
  plan = deriveDay(viewDate || todayISO());
  await applyOverride();
  render();
  if (prevDate && prevDate !== plan.date) sync.reattach();
}

async function applyOverride() {
  try {
    const res = await fetch(`overrides/${plan.date}.json?t=${Date.now()}`, { cache:"no-store" });
    if (!res.ok) return;                       // the normal case: no override
    const o = await res.json();
    if (o.groups) o.groups = o.groups.map(g => ({ ...g, items: g.items.map(i => ({ ...i, text: itemText(i) })) }));
    plan = { ...plan, ...o };
  } catch { /* absent or unparseable — the derived day stands */ }
}

$("dayPrev").addEventListener("click", () => goToDay(shiftDate(plan.date, -1)));
$("dayNext").addEventListener("click", () => goToDay(shiftDate(plan.date, 1)));
$("dayToday").addEventListener("click", () => goToDay(todayISO()));

$("prioritySet").addEventListener("click", startPriorityEdit);
$("priorityEditBtn").addEventListener("click", startPriorityEdit);
$("priorityDeleteBtn").addEventListener("click", deletePriority);
$("priorityCancel").addEventListener("click", cancelPriorityEdit);
$("prioritySave").addEventListener("click", savePriorityForm);
$("priorityText").addEventListener("input", () => { $("priorityError").textContent = ""; });

/* Long press to edit, swipe left to remove — the same gestures as a task row,
   held off while the form is open. */
attachGestures($("priorityWrap"), $("priority"), {
  id: "priority",
  onEdit: () => { if (plan) startPriorityEdit(); },
  enabled: () => !!plan && priorityEditDate !== plan.date
});
$("prioritySwipeDelete").addEventListener("click", e => {
  e.preventDefault(); e.stopPropagation();
  closeRevealed();
  if (plan) deletePriority();
});

$("addCat").addEventListener("click", () => { if (plan) openCategoryAdd(); });
$("reorderBtn").addEventListener("click", () => { if (plan) toggleReorder(); });
$("cCancel").addEventListener("click", closeCategoryModal);
$("cSave").addEventListener("click", saveCategoryModal);
$("cDelete").addEventListener("click", deleteCategory);
$("cScrim").addEventListener("click", e => { if (e.target === $("cScrim")) closeCategoryModal(); });
$("cName").addEventListener("keydown", e => { if (e.key === "Enter") saveCategoryModal(); });

$("streakAdd").addEventListener("click", () => { if (plan) openStreakAdd(); });
$("sCancel").addEventListener("click", closeStreakModal);
$("sSave").addEventListener("click", saveStreakModal);
$("sDone").addEventListener("click", markStreakDone);
$("sDelete").addEventListener("click", deleteStreak);
$("sScrim").addEventListener("click", e => { if (e.target === $("sScrim")) closeStreakModal(); });
$("sName").addEventListener("keydown", e => { if (e.key === "Enter") saveStreakModal(); });

$("mScope").addEventListener("change", syncEveryField);
$("mCancel").addEventListener("click", closeModal);
$("mSave").addEventListener("click", saveModal);
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeModal(); });
$("mText").addEventListener("keydown", e => { if (e.key === "Enter") saveModal(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("scrim").hidden) closeModal();
  else if (!$("sScrim").hidden) closeStreakModal();
  else if (!$("cScrim").hidden) closeCategoryModal();
  else if (priorityEditDate) cancelPriorityEdit();
});

sync.init().then(() => sync.watchLifecycle());
</script>
</body>
</html>
