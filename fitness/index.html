<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2EDE0">
<title>Moved → Exercise</title>
<!-- The exercise page now lives at /exercise/. This stub stays
     so the already-installed home-screen app and any old bookmark keep working.
     Safe to delete once nothing points here any more. -->
<link rel="canonical" href="../exercise/">
<meta http-equiv="refresh" content="0; url=../exercise/">
<style>
  :root{ --paper:#F2EDE0; --card:#FFFDF7; --ink:#111111; --yellow:#FFD53D; --grey:#7A756A; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:24px;
    font:15px/1.5 "Archivo","Helvetica Neue",Arial,sans-serif;
  }
  .box{
    max-width:380px;background:var(--card);
    border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:20px;
  }
  .k{font-size:9px;letter-spacing:.1em;background:var(--ink);color:var(--paper);
    padding:3px 8px;display:inline-block;
    font-family:"Arial Black",Impact,sans-serif}
  h1{margin:12px 0 8px;font-size:24px;line-height:1.05;
    font-family:"Arial Black",Impact,sans-serif;font-weight:900}
  p{margin:0 0 16px;font-size:13px;font-weight:600;color:var(--grey)}
  a{
    display:inline-block;text-decoration:none;color:var(--ink);background:var(--yellow);
    border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    padding:10px 14px;font-size:12px;letter-spacing:.05em;
    font-family:"Arial Black",Impact,sans-serif;
  }
</style>
</head>
<body>
  <div class="box">
    <span class="k">MOVED</span>
    <h1>This is Exercise now</h1>
    <p>
      It lives at <strong>/exercise/</strong>. Taking you there — if nothing happens,
      tap below. Worth re-adding to your home screen from the new address.
    </p>
    <a href="../exercise/">GO TO EXERCISE →</a>
  </div>
  <script>location.replace("../exercise/");</script>
</body>
</html>
